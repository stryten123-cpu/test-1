<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice — Blood Spill Only</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Blood Spill Only</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Blood Spill","q":"If blood appears during a nail service, what is the FIRST action the technician must take?","a":["Wipe the area with a dry towel and keep working","Stop the service immediately","Cover the cut with a nail tip","Apply cuticle oil and continue"],"c":1,"e":"Kansas blood-exposure procedure starts with stopping the service so no more blood is spread and proper precautions can begin."},
{"t":"Blood Spill","q":"When the CLIENT is cut, the technician should put on protective gloves:","a":["After bandaging the wound","Only if the cut looks deep","Before cleaning the injured area","After returning to the service"],"c":2,"e":"For a client injury, don gloves first. This protects both people before you touch the wound, blood, or contaminated items."},
{"t":"Blood Spill","q":"After stopping the service and gloving, the injured area should be:","a":["Rinsed with hot monomer","Covered with acrylic powder","Cleaned with antiseptic and covered with a sterile bandage","Scrubbed with a metal file"],"c":2,"e":"Clean the injury with antiseptic, then cover it with a sterile bandage so bleeding is controlled and further exposure is blocked."},
{"t":"Blood Spill","q":"How must antiseptic, styptic, or other first-aid products be applied during a blood spill?","a":["Poured directly from the bottle onto the wound","Applied with an applicator so the container never touches skin","Rubbed on with a reused cloth towel","Dipped from a community jar with a finger"],"c":1,"e":"Kansas exam notes: all blood-spill products must be applied with an applicator. Bottles, nozzles, and brushes must not touch the wound."},
{"t":"Blood Spill","q":"Which item is NOT acceptable for stopping a minor bleed in a nail salon?","a":["Liquid or spray styptic applied with an applicator","Astringent on a clean applicator","A reused styptic pencil or alum block pressed on the wound","A sterile adhesive bandage after antiseptic"],"c":2,"e":"Solid styptic pencils and alum blocks that touch the wound are prohibited. Use liquid/spray product on a fresh applicator, then bandage."},
{"t":"Blood Spill","q":"Contaminated gloves, cotton, and dressings must be placed in:","a":["The regular open trash can","The client's purse","A double bag marked Biohazard","A drawer until the end of the day"],"c":2,"e":"All blood-soiled items go into a double bag labeled Biohazard (or clearly marked with permanent ink), then sealed and discarded."},
{"t":"Blood Spill","q":"When disposing of blood-contaminated materials, gloves should be:","a":["Washed and reused","Removed first before cleaning the station","Removed last and placed in the biohazard bag","Left on the table for the examiner"],"c":2,"e":"Gloves come off last so your bare hands never touch contaminated items, then the gloves go into the same sealed double bag."},
{"t":"Blood Spill","q":"For the Kansas practical exam, how many blood-spill / first-aid kits are required?","a":["None if you are careful","One shared kit for the whole room","One kit with enough supplies for more than one spill, OR two separate kits","Only a box of bandages"],"c":2,"e":"KBOC requires one well-stocked kit for multiple spills OR two kits: one for the demonstration and a second unused kit that stays on the station."},
{"t":"Blood Spill","q":"Why must a second unused blood-spill kit stay visible on the workstation during the exam?","a":["To decorate the station","In case an actual blood exposure happens during the exam","So other candidates can borrow supplies","Because the first kit cannot contain gloves"],"c":1,"e":"The demonstration kit may be used up. The second unused kit is required so a real injury can still be treated legally and the candidate is not dismissed."},
{"t":"Blood Spill","q":"After the wound is covered, tools and implements that contacted blood must be:","a":["Wiped with a client towel and reused","Rinsed in the pedicure bowl","Cleaned and disinfected with an EPA-registered hospital-grade disinfectant","Put back in the dry sanitizer immediately"],"c":2,"e":"Blood-contaminated implements need cleaning plus disinfection with a product labeled EPA-registered, bactericidal, fungicidal, and virucidal."},
{"t":"Blood Spill","q":"Which product is acceptable for disinfecting the workstation after a blood exposure?","a":["Household Clorox or Lysol daily wipes","A bleach solution or hospital-grade disinfectant wipe/solution","Plain soap and water only","Nail polish remover"],"c":1,"e":"Kansas exam rules: use bleach solution or hospital-grade disinfectant. Everyday surface wipes (Clorox/Lysol daily) are not accepted for blood exposure."},
{"t":"Blood Spill","q":"The disinfectant used after a blood spill must have which words on the label (printed or handwritten)?","a":["Organic and cruelty-free","EPA-registered disinfectant, bactericidal, fungicidal, and virucidal","For salon fragrance only","Alcohol-free and gentle"],"c":1,"e":"Examiners check the label. Those four claims must be present so the product is proven effective against bacteria, fungi, and viruses."},
{"t":"Blood Spill","q":"Do not seal and throw away the biohazard double bag until:","a":["The client leaves the salon","It contains all contaminated items, including gloves and final cleaning products","The next client sits down","The bottle of antiseptic is empty"],"c":1,"e":"Keep the bag open until every contaminated item is inside. Sealing too early leaves soiled gloves or wipes on the station."},
{"t":"Blood Spill","q":"If the technician's own finger is cut during the exam, after first aid they should:","a":["Continue bare-handed so the bandage can breathe","Place a single-use disposable glove over the injured hand before returning to service","Dip the finger in monomer to seal it","Ask the client to finish the service"],"c":1,"e":"A cut on the candidate's hand requires a fresh single-use glove over that hand. Change the glove each time it becomes contaminated."},
{"t":"Blood Spill","q":"Any material that touched the client's skin or the wound is considered:","a":["Reusable after a quick wipe","Contaminated and must be discarded properly","Safe if it looks clean","Sterile if it came from the kit"],"c":1,"e":"Kansas note: anything that contacts skin or the wound is contaminated. Treat it as a biohazard—do not return it to the clean kit."},
{"t":"Blood Spill","q":"A single-use item (glove, cotton, applicator) is defined as an item that:","a":["Can be boiled and used again","Must be disposed of immediately after one use because it cannot be cleaned and disinfected","May be shared if both clients agree","Only needs alcohol sprayed on it"],"c":1,"e":"KBOC: single-use items cannot be cleaned and disinfected, so they are discarded after one use. Never save a used glove or cotton."},
{"t":"Blood Spill","q":"Universal precautions mean the technician treats blood and body fluids as:","a":["Safe unless the client says they are sick","Potentially infectious every time, from every client","Only dangerous if HIV is confirmed","Not a concern during a manicure"],"c":1,"e":"You cannot know a client's status. Treat every blood exposure as infectious and follow the full procedure without exception."},
{"t":"Blood Spill","q":"Which action is a blood-spill violation that can fail the practical exam?","a":["Stopping service and putting on gloves","Placing contaminated implements in the client's purse or pocket","Double-bagging soiled cotton","Cleaning the table with hospital-grade disinfectant"],"c":1,"e":"Contaminated tools never leave with the client and never go in a purse. They must be cleaned, disinfected, or discarded as required."},
{"t":"Blood Spill","q":"After the station is cleaned and contaminated items are sealed in the biohazard bag, the technician should:","a":["Leave without washing hands","Clean hands with antimicrobial cleanser/soap and then return to service if it is safe","Spray perfume to cover the smell","Continue using the same pair of soiled gloves"],"c":1,"e":"Wash or sanitize hands after glove removal, then resume only if the wound is covered and the area is sanitary."},
{"t":"Blood Spill","q":"If a candidate does not have enough supplies to treat an actual blood spill safely during the Kansas exam, the result can be:","a":["A verbal warning only","Dismissal from the exam","Extra time added to the service","A free retake the same day"],"c":1,"e":"KBOC states candidates without sufficient supplies to treat an actual spill in a safe, sanitary, legal way will be dismissed if a spill occurs."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
