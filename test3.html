<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 3</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 3</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Safety and Sanitation","q":"The ultimate goal of state laws for beauty salons is to maintain an environment that is?","a":["Completely sterile","Limited in infection","Splendidly decorated","Sanitary and safe for health"],"c":3,"e":"State laws aim to keep salons sanitary and safe for both clients and technicians, reducing the risk of infection and disease transmission."},
{"t":"Safety and Sanitation","q":"What is a mandatory requirement for each beauty establishment regarding posted documents?","a":["Detailed service price list","List of all chemicals used","Owner's personal information","Sanitary rules and regulations poster"],"c":3,"e":"Most state boards require salons to post the official sanitary rules and regulations in a visible location for clients and staff."},
{"t":"Safety and Sanitation","q":"During the nail process, tools like cuticle nippers and pushers should be stored in?","a":["A separate drawer of the workbench","An open disinfection container","Specialized dry sanitizer equipment","A container of alcohol solution for disinfection"],"c":3,"e":"Multi-use metal implements must be kept in a covered container of appropriate disinfectant solution between uses to prevent contamination."},
{"t":"Safety and Sanitation","q":"Items like liquid soap and cotton balls used daily in the salon are classified into the group of?","a":["Consumables (supplies)","Durable equipment","Personal items","Reusable tools"],"c":0,"e":"Single-use or quickly depleted items such as soap, cotton, and paper products are classified as consumable supplies."},
{"t":"Safety and Sanitation","q":"Although Phenolics disinfect tools very well, what is their disadvantage?","a":["Complex usage procedure","Solution often becomes imbalanced","Very scarce in the market","Investment cost is quite expensive"],"c":3,"e":"Phenolic disinfectants are effective but relatively expensive compared with other common salon disinfectants such as quats."},
{"t":"Manicure","q":"What is a metal cuticle pusher often called?","a":["Skin trimming tool","Orange wood stick","Emery board","Steel pushers"],"c":3,"e":"Metal cuticle pushers are commonly referred to as steel pushers. They must be properly disinfected between clients."},
{"t":"Nail Enhancements","q":"In the process of applying acrylic nails, a bead is formed when?","a":["Dipping the brush into dry powder","Mixing polymer resin powder with liquid monomer","Mixing powder with nail polish","Dipping the brush into warm water"],"c":1,"e":"A proper acrylic bead is created by dipping the brush into monomer liquid and then into polymer powder so the two components combine."},
{"t":"Safety and Sanitation","q":"Which common term is used to refer to pathogenic microorganisms?","a":["Mildew","Spirilla","Pathogenic germs","Beneficial fungus"],"c":2,"e":"Pathogenic germs (or pathogens) are the microorganisms capable of causing disease in humans."},
{"t":"Nail Enhancements","q":"To remove acrylic powder nails for a client, the technician should soak the nails in?","a":["Acetone","Nail polish remover","Cuticle softener","Medical alcohol"],"c":0,"e":"Acetone is the solvent that dissolves acrylic polymer, allowing safe removal of acrylic enhancements."},
{"t":"Nail Enhancements","q":"The two most common types of light sources used to cure gel nails are?","a":["Ultraviolet (UV) and LED lights","Ultraviolet and Infrared lights","Infrared and Halogen lights","Only infrared lights"],"c":0,"e":"Gel polish and hard gel are cured under UV or LED lamps. LED is faster and more energy-efficient; UV is the traditional method."},
{"t":"Manicure","q":"The purpose of using base coat is to?","a":["Help artificial nails adhere better","Prevent natural nails from being stained by polish","Make the top coat shinier","Make nails grow faster"],"c":1,"e":"Base coat forms a protective barrier that stops highly pigmented color polish from staining the natural nail plate."},
{"t":"Nail Enhancements","q":"What will happen if an acrylic chemical bottle is not capped after use?","a":["The chemical volume increases","The chemical evaporates and reduces quality","The operation becomes more convenient","Nails will become brittle and crack"],"c":1,"e":"Monomer liquid is volatile. Leaving the bottle open allows evaporation, which changes the liquid-to-powder ratio and weakens the finished product."},
{"t":"Nail Enhancements","q":"The two-color acrylic powder technique (pink and white) is commonly used to create which nail style?","a":["Simple natural style","French manicure","Artistic nail with gems","Linen wrap style"],"c":1,"e":"Pink-and-white acrylic is the classic method for creating a durable French manicure enhancement."},
{"t":"Nail Enhancements","q":"How often is a nail fill-in typically performed?","a":["Once every week","Every 2 to 3 weeks","Waiting until the old nail falls off","Every 6 weeks"],"c":1,"e":"Most clients need a fill every 2–3 weeks as the natural nail grows and the enhancement lifts at the cuticle."},
{"t":"Safety and Sanitation","q":"Quaternary ammonium solution at 1,000 p.p.m. is a disinfectant often referred to as?","a":["Wet sanitizer","Dry sanitizer","Common antiseptic solution","Deodorant solution"],"c":0,"e":"Quats mixed at the proper strength and used as an immersion solution are commonly called wet sanitizers."},
{"t":"Pedicure","q":"To prevent ingrown toenails, a nail technician should file nails straight across and?","a":["Use steel tools","Slightly round the corners","Use a metal file","Use a chamois buffer to polish"],"c":1,"e":"Filing straight across and gently rounding the corners helps the free edge grow forward instead of digging into the side walls."},
{"t":"Manicure","q":"To shape the nail most safely, a nail technician should prioritize using which type of file?","a":["Steel or metal file","Emery board","Large black coarse file","Industrial grinder"],"c":1,"e":"Emery boards are disposable or easily replaced and gentler on the natural nail than metal files, reducing the risk of damage."},
{"t":"Manicure","q":"How can abnormal ridges on the nail surface be effectively handled?","a":["Apply top coat over them","Use cuticle softener solution","Use nail softener solution","Use pumice powder to polish and smooth"],"c":3,"e":"Light buffing with pumice powder or a fine buffer can reduce the appearance of ridges and create a smoother surface for polish."},
{"t":"Nail Enhancements","q":"When using an electric file and noticing it lacks power in one direction, the technician should?","a":["Increase pressure on the nail","File in the opposite direction","Keep the same direction","Change the rotation speed"],"c":1,"e":"Most electric files are designed to cut effectively in one direction. Switching direction restores cutting power without increasing pressure."},
{"t":"Manicure","q":"How does a healthy fingernail typically look?","a":["Rough and coarse surface","Opaque pigment","Curved, smooth, and shiny","Brittle and split"],"c":2,"e":"A healthy natural nail is smooth, slightly curved, translucent to pink, and has a natural shine."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
