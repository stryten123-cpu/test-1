<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 3</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 3</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Safety and Sanitation","q":"The PRIMARY purpose of a client consultation before a nail service is:","a":["To gather health history, preferences, and contraindications guiding safe, personalized service.","To determine the client's ability to pay and to collect a deposit before any products are opened at the table.","To recommend retail products increasing salon revenue.","To satisfy state board documentation requirements only."],"c":0,"e":"Client consultations serve clinical purposes first: identifying contraindications, prior service history, allergies, and preferences. They enable safe, personalized service and support referral decisions."},
{"t":"Manicure / Pedicure","q":"Cuticle remover is applied to:","a":["Disinfect the cuticle area.","Promote adhesion of products by leaving an alkaline film that etches the plate for bonding.","Remove nail polish from the plate by dissolving the color film with its acetone-based solvent.","Chemically soften dead cuticle tissue using alkaline pH for easier removal."],"c":3,"e":"Cuticle remover (pH 9–12, alkaline) softens dead keratinized cuticle tissue by disrupting protein bonds, making pushback and removal easier. Applied for manufacturer-recommended time only."},
{"t":"Nail Enhancements","q":"Bubbling in powder dip product during application most likely indicates:","a":["Using wrong powder color, since dark pigments react faster with the activator.","Using too many dip cycles, which traps air pockets between the powder layers.","Incorrect lamp wattage, since the light must be strong enough to set dip resin.","Applying activator before the base coat was sufficiently dry."],"c":3,"e":"Bubbling in powder dip: activator applied before base coat is sufficiently dry causes rapid polymerization that traps gas bubbles. Allow the base to become slightly tacky before activating."},
{"t":"Safety and Sanitation","q":"A client arrives with pus and inflammation around one nail fold. The nail technician should:","a":["Apply antiseptic and continue the service.","Soak the finger longer in warm antiseptic water to reduce inflammation before proceeding.","Decline service on the affected digit and recommend medical evaluation.","Proceed using extra disinfectant on the affected digit, since an antiseptic soak clears it."],"c":2,"e":"Pus and inflammation indicate paronychia — active bacterial infection. Service on that digit is contraindicated. The technician must decline and refer for medical treatment."},
{"t":"Manicure","q":"Nail nippers are used to:","a":["File the nail plate to desired shape.","Apply acrylic product to the nail plate surface.","Remove hangnail tags and dead cuticle, not living skin.","Cut the nail tip before blending."],"c":2,"e":"Nail nippers (cuticle nippers) remove only dead skin tags (hangnails) and dead cuticle tissue. Living skin must never be cut. They are multi-use metal implements requiring disinfection between clients."},
{"t":"Manicure","q":"Asking about a client's occupation during consultation informs:","a":["Scheduling frequency for maintenance.","Conversation topics during the service.","Appropriate service selection (length, shape).","Ability to pay for premium services."],"c":2,"e":"Occupation directly informs service selection: manual labor, chemicals, frequent handwashing all affect appropriate nail length, shape, and product durability recommendations."},
{"t":"Nail Enhancements","q":"Gel nail extensions sculpted over forms differ from tip-and-overlay in that sculpted nails:","a":["Require UV curing; tip-and-overlay does not.","Use no pre-formed plastic tip.","Are always stronger than tip-and-overlay nails.","Take less time than tip-and-overlay nails."],"c":1,"e":"Sculpted nails use only enhancement product over a disposable form — no plastic tip. Tip-and-overlay uses a pre-formed plastic tip adhered to the natural nail, then covered with enhancement product. Different foundation, same product."},
{"t":"Safety and Sanitation","q":"Cross-contamination between clients is best prevented by:","a":["Using the same file for every client and wiping it with disinfectant spray between each use.","Using single-use abrasives per client and disinfecting all multi-use implements.","Spraying implements with alcohol between clients, which evaporates and kills pathogens on contact.","Asking clients to wash hands before service begins."],"c":1,"e":"Porous implements cannot be reliably disinfected — they are single-use per client. Multi-use metal implements must be cleaned and disinfected. Alcohol spray alone is insufficient for full disinfection."},
{"t":"Safety and Sanitation","q":"The nail technician's workstation must be disinfected:","a":["Weekly during the scheduled deep-cleaning protocol, when each surface is wiped with soapy detergent.","Once daily at opening.","Only when visible product spills occur.","Between each client using an EPA-registered disinfectant for all surfaces that contacted the client."],"c":3,"e":"All workstation surfaces (table surface, armrest, lamp) that contacted the client must be disinfected between clients. This prevents transfer of skin cells, oils, and potential pathogens from one client to the next."},
{"t":"Manicure","q":"Each nail polish coat should be:","a":["Thin and even.","Applied without base coat if the color is opaque.","Applied from tip to base to prevent bubbles.","Applied as thickly as possible for coverage."],"c":0,"e":"Thin coats dry faster, adhere better, and last longer than thick coats. Thick coats are slow-drying, prone to bubbling, and tend to peel. Two thin color coats is standard."},
{"t":"Nail Enhancements","q":"A nail enhancement with insufficient apex height is prone to:","a":["Stress fractures at zone 2.","Lifting at the cuticle area.","Discoloration from UV exposure.","Poor adhesion at the free edge tip."],"c":0,"e":"Insufficient apex = flat nail = concentrated stress at zone 2 (the stress zone where nail bed meets free edge). Without the structural arch, all flexion force concentrates at this zone causing stress fractures."},
{"t":"Safety and Sanitation","q":"The primary purpose of workstation disinfection immediately after a nail service is:","a":["To satisfy a state board end-of-day requirement.","To prepare the station for the next retail product display.","To remove all client-contact surface contamination before the next client is seated.","To reduce chemical odors from products during the service, as disinfectant clears the fumes."],"c":2,"e":"Post-service disinfection removes client skin cells, products, and potential pathogens from all surfaces before the next client. This is the critical cross-contamination prevention step between every client."},
{"t":"Safety and Sanitation","q":"Proper handwashing in nail salon practice requires:","a":["5 seconds with antibacterial soap.","20 seconds covering all hand surfaces with soap and running water.","10 seconds if followed by hand sanitizer, whose alcohol gel finishes the job.","60 seconds in a medical-grade antiseptic."],"c":1,"e":"CDC guidance: wash all hand surfaces for at least 20 seconds with soap and running water. Hand sanitizer is an acceptable adjunct but does not replace handwashing when hands are visibly soiled."},
{"t":"Nail Enhancements","q":"The 'bead' used in acrylic application is formed when:","a":["The brush loaded with monomer picks up polymer powder, creating a monomer-saturated polymer bead.","Polymer powder is added directly to the dry nail surface.","UV light initiates a reaction between the brush and product, hardening the monomer into a workable bead.","The polymer powder is pre-mixed with monomer in a dappen dish."],"c":0,"e":"When the monomer-loaded brush contacts the polymer powder, it picks up a specific amount of powder surrounded by monomer — this is the bead. The bead's consistency (wet, medium, dry) depends on the monomer-to-polymer ratio."},
{"t":"Nail Enhancements","q":"The purpose of nail prep (cleansing and dehydration) before acrylic application is to:","a":["Apply a temporary sealer to the nail plate.","Activate the initiator in the acrylic powder.","Remove surface oils and moisture that impair adhesion.","Neutralize the acid mantle for better chemical bonding."],"c":2,"e":"Surface oils and moisture are the primary cause of adhesion failure. Dehydration with IPA or a nail prep product removes these, allowing the primer and enhancement product to bond directly to the nail plate keratin."},
{"t":"Safety and Sanitation","q":"A small cut on a client's knuckle discovered during a manicure requires:","a":["Applying nail polish over the cut to seal it.","Avoiding contact, documenting it, and using standard precautions.","Applying antiseptic and proceeding without modification.","Stopping the entire manicure service."],"c":1,"e":"A small existing cut is noted, documented, and avoided (no massage pressure, no product on broken skin). Standard precautions apply throughout. Not a reason to cancel the entire service."},
{"t":"Safety and Sanitation","q":"An orangewood stick is classified as:","a":["A reusable multi-use implement disinfected between clients.","A semi-disposable item that is sanitized between clients and reused.","A single-use implement discarded after each client.","A permanent tool requiring sterilization in an autoclave weekly."],"c":2,"e":"Orangewood sticks are porous wood — they cannot be reliably disinfected and must be single-use. They are used for cuticle pushback, cleaning under the free edge, and product placement during nail art."},
{"t":"Safety and Sanitation","q":"The portal of entry for most nail-related bacterial infections is:","a":["The nail matrix, accessed through the lunula.","The nail plate, which bacteria penetrate directly by dissolving its keratin layers.","Broken skin — hangnail tears, cuts, or abrasions on the nail fold.","The respiratory tract, where inhaled monomer vapors carry bacteria down into the lungs."],"c":2,"e":"Bacteria cannot penetrate intact skin. Breaks from cuticle cutting, hangnail removal, or abrasions provide portals of entry — explaining why aggressive cuticle work increases infection risk."},
{"t":"Nail Enhancements","q":"The C-curve of a nail enhancement refers to:","a":["The smile line curvature in a French manicure.","The front view of the nail's curved free edge as it arches downward toward the fingertip.","The cross-sectional arch of the nail from one lateral fold to the other.","The downward curve of the free edge toward the fingertip, measured from sidewall to tip."],"c":2,"e":"The C-curve (cross-sectional arch) is visible when the nail is viewed head-on from the free edge. A proper C-curve (approximately 35% of the nail width) provides structural rigidity — flat nails crack and break more easily."},
{"t":"Safety and Sanitation","q":"A nail technician asks a new client about medications during consultation. This is important because:","a":["Some medications affect nail health, healing, bleeding risk, and chemical processing outcomes.","Medication history is required by OSHA for all salon records.","Only prescription medications are relevant; OTC drugs do not affect nail services.","Medications may indicate the client's income level and ability to pay for pricier service upgrades offered."],"c":0,"e":"Medications like blood thinners increase bleeding risk, immunosuppressants increase infection risk, Accutane thins skin and nails, and some drugs affect healing. Medication history guides safe service planning."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
