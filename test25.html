<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice — Blood Spill Test 2</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Blood Spill Test 2</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Blood Spill","q":"The main purpose of a blood-spill procedure is to:","a":["Finish the manicure faster","Prevent the spread of bloodborne pathogens","Save product","Avoid writing an incident report"],"c":1,"e":"The procedure exists to stop bloodborne pathogens from spreading to the client, technician, tools, and station."},
{"t":"Blood Spill","q":"If YOU (the technician) are the one who is cut, the first difference from a client injury is:","a":["You do not need gloves later","You stop and clean YOUR injured area before dressing it","You ask the client to treat you","You ignore a small nick"],"c":1,"e":"For a licensee injury: stop, clean your own cut, apply antiseptic with an applicator, bandage, then protect the area with a finger guard or glove."},
{"t":"Blood Spill","q":"When the CLIENT is injured, who should put antiseptic on the wound when possible?","a":["The next client in the waiting area","The client, using product and an applicator you provide","Anyone walking by the station","The receptionist without gloves"],"c":1,"e":"Best practice is to glove, then give the client antiseptic and dressing with an applicator so the bottle never contacts the wound."},
{"t":"Blood Spill","q":"A finger guard is used after a technician cut to:","a":["Make the nail look longer","Cover and protect the dressed injury so service can resume safely","Replace the need for disinfectant","Hold acrylic beads"],"c":1,"e":"After antiseptic and a bandage, a finger guard or glove covers the injury so you do not contaminate the client or the enhancement."},
{"t":"Blood Spill","q":"Blood-soiled towels or linens should be:","a":["Rinsed in the sink and reused on the next client","Given to the client to take home","Placed in a closed, labeled container for contaminated items","Left on the table until closing"],"c":2,"e":"Porous items that absorbed blood cannot go back into clean laundry loose. Bag or contain them as contaminated."},
{"t":"Blood Spill","q":"Which item belongs in a complete blood-exposure kit?","a":["Only nail polish and a buffer","Gloves, antiseptic, applicators, sterile bandages, biohazard bags, and disinfectant","Only a bottle of acetone","A metal pusher and cuticle nippers"],"c":1,"e":"The kit must have enough supplies to treat a spill: protection, wound care, cleanup, and proper disposal."},
{"t":"Blood Spill","q":"During the Kansas practical, the unused second kit must be:","a":["Hidden under the chair","Labeled and visible on top of the workstation","Shared with the candidate next to you","Kept in your car"],"c":1,"e":"The spare kit stays labeled and in sight on the station the entire exam in case a real injury happens."},
{"t":"Blood Spill","q":"After a blood exposure, the workstation surface must be cleaned with:","a":["Baby wipes","Hospital-grade disinfectant or a proper bleach solution","Hand lotion","Warm water only"],"c":1,"e":"Household daily wipes are not enough. Use bleach solution or hospital-grade disinfectant that kills bacteria, fungi, and viruses."},
{"t":"Blood Spill","q":"Why is double-bagging required?","a":["It looks more professional","It adds a second barrier against leaks and exposure","State law requires three bags","Bags replace the need to disinfect tools"],"c":1,"e":"Two bags reduce the chance that blood leaks onto hands, trash, or the floor."},
{"t":"Blood Spill","q":"The outer bag of contaminated items should be marked:","a":["Recycle","Biohazard, or the word Biohazard written clearly in permanent ink","Lost and found","Clean implements"],"c":1,"e":"Anyone handling trash must be able to see that the bag contains blood-contaminated waste."},
{"t":"Blood Spill","q":"Implements that contacted blood must NOT be:","a":["Cleaned then immersed in proper disinfectant","Placed back on the clean sanitary-maintenance area while still soiled","Discarded if they are single-use","Handled with gloved hands"],"c":1,"e":"Soiled tools stay out of the clean zone until they are fully cleaned and disinfected."},
{"t":"Blood Spill","q":"OSHA's Bloodborne Pathogens Standard is written mainly to protect:","a":["Only salon owners from inspections","Employees from exposure to infectious blood and body fluids","Clients from paying extra","Product manufacturers"],"c":1,"e":"It is a worker-safety rule. Salons still owe clients a safe service, but the standard itself targets employee exposure."},
{"t":"Blood Spill","q":"Examples of bloodborne pathogens of concern in a salon include:","a":["Only the common cold","Hepatitis viruses and HIV","Dandruff","Nail polish fumes"],"c":1,"e":"Hepatitis B, hepatitis C, and HIV can be carried in blood. That is why every spill is treated as infectious."},
{"t":"Blood Spill","q":"If blood gets on a multi-use metal implement, the correct order is:","a":["Wipe once and reuse immediately","Clean visible soil, then fully disinfect according to the product label","Spray perfume on it","Give it to the client"],"c":1,"e":"Disinfectant does not work through dried blood. Clean first, then disinfect for the full contact time."},
{"t":"Blood Spill","q":"A small nick that has already stopped bleeding still requires:","a":["No action if it looks minor","The same stop-clean-cover-clean-up steps","Only a smile and an apology","Acrylic powder packed into the cut"],"c":1,"e":"Any blood exposure, even a tiny nick, follows universal precautions. Size does not cancel the procedure."},
{"t":"Blood Spill","q":"You should return to the nail service only after:","a":["The wound is covered, the station and tools are disinfected, waste is bagged, and hands are cleaned","The client says it is fine to skip cleanup","Five minutes have passed, even if the table is still soiled","You hide the cotton under a towel"],"c":0,"e":"Service resumes only when exposure is controlled and the work area is sanitary again."},
{"t":"Blood Spill","q":"Using the open bottle tip or brush directly on a bleeding cut is wrong because:","a":["It wastes product","The container becomes contaminated and can infect the next person","It makes the polish last longer","Boards require larger bottles"],"c":1,"e":"That is why an applicator is mandatory. The stock bottle must stay clean."},
{"t":"Blood Spill","q":"If an examiner checks a station after a mock blood exposure, they will look for:","a":["Whether every step was done in a safe, sanitary order","How pretty the nail art is","Whether you used MMA","How fast you talked"],"c":0,"e":"On the Kansas practical, missing a required blood-exposure step can fail that portion even if the nails look good."},
{"t":"Blood Spill","q":"A glove used during blood cleanup is:","a":["Multi-use if it was only worn one minute","A single-use item that is discarded after the incident","Washed in the foot bath","Stored in the dry sanitizer"],"c":1,"e":"Gloves cannot be cleaned and disinfected for reuse. Change them whenever they are contaminated."},
{"t":"Blood Spill","q":"Documenting a real salon blood incident (when required by policy) should happen:","a":["Never, to avoid paperwork","After the person is cared for and the area is cleaned","Before you stop the service","Only if the client asks for a refund"],"c":1,"e":"Care and cleanup come first. Then complete any required incident log so the event is recorded."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
