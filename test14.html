<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nail Technology Practice Test 14</title><style>:root{--i:#241b1a;--r:#b51f46;--p:#f8dce4;--g:#2f6b46;--gb:#e5f3e9;--rd:#a21f36;--rb:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--i);font-family:system-ui}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--r);color:#fff;font:23px Georgia}.test,.counter{font-size:14px;color:#756a66;font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--r),#db6785)}.card{background:#fffdfa;border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px #3f251e24;padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--p);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;text-align:left;gap:14px;padding:17px 18px;border:1px solid #eadfda;border-radius:16px;background:#fff;color:var(--i);cursor:pointer;font:inherit}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--gb)}.answer.correct .letter{background:var(--g);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--rb)}.answer.wrong .letter{background:var(--rd);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.good{background:var(--gb);border-color:var(--g)}.bad{background:var(--rb);border-color:var(--rd)}.controls{margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--i);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.hidden{display:none!important}.result{text-align:center;padding:60px}.score{font:800 76px Georgia;color:var(--r)}</style><main class=shell><div class=top><div class=brand><span class=mark>N</span><span>Nail Technology Practice</span></div><span class=test>Test 14</span><span id=counter class=counter></span></div><div class=progress><div id=bar></div></div><section id=quiz class=card><span id=topic class=topic></span><h1 id=question class=question></h1><div id=answers class=answers></div><div id=feedback class=feedback></div><div class=controls><button id=prev class="btn secondary">← Previous</button><button id=next class="btn primary" disabled>Next →</button></div></section><section id=result class="card result hidden"><span class=topic>Complete</span><div id=score class=score></div><h1 id=rt></h1><p id=rp></p><button id=restart class="btn primary">Take it again</button></section></main><script>
const q=[
['Manicure','After applying nail polish, the technician notices a brush stroke line in the color coat. The correct fix is:',['Wipe the entire nail with remover and start over.','Apply top coat immediately to seal the defect.','Allow that coat to fully dry, then lightly float a thin corrective coat over the area to blend.','Apply additional color coats until the line is no longer visible.'],2,'Float a thin coat of the same color over the dried defect to blend it.'],
['Safety and Sanitation',"OSHA's Bloodborne Pathogens Standard applies to nail salons because:",['All workers need federal certification.','It applies only to pedicures.','Nail technicians are healthcare workers.','Blood exposure can occur occupationally during nail services.'],3,'Cuticle work and skin nicks can create blood exposure in nail salons.'],
['Nail Enhancements','The base coat in a powder dip system:',['Contains the cyanoacrylate bonder that adheres powder to the nail plate.','Provides color to the initial layer.','Is used only before top coat.','Is identical to gel polish base coat.'],0,'The cyanoacrylate adhesive bonds the powder layer to the nail plate.'],
['Pedicure','Reflexology incorporated into pedicure massage is based on:',['A licensed reflexologist requirement.','Specific pressure points on the foot corresponding to organs and body systems.','All foot massage being equally beneficial.','Different foot muscle groups.'],1,'Reflexology theory links specific foot areas to organs and body systems.'],
['Safety and Sanitation','Acetone for nail polish and enhancement removal is classified as:',['A restricted substance.','A highly flammable solvent requiring separation from heat and open flames.','A substance requiring chemical-hauler disposal.','A non-flammable solvent.'],1,'Acetone is highly flammable and must be kept away from heat and open flames.'],
['Nail Enhancements','The correct number of tip sizes typically available in a professional set:',['3 sizes.','6 sizes.','2 sizes.','10 sizes numbered 1–10.'],3,'Ten sizes allow matching to a range of natural nail widths.'],
['Nail Enhancements','Dip and activator chemistry in powder dip systems:',['Uses a UV lamp.','Cyanoacrylate monomer reacts with powder polymer to form a solid coating.','Uses EMA monomer.','Depends on ambient moisture.'],1,'Cyanoacrylate infiltrates the powder and polymerizes into a hard coating.'],
['Nail Enhancements','The powder in powder dip systems is typically:',['Tinted cornstarch.','The same PMMA beads as acrylic.','Fine-milled polymer powder that becomes the coating structure with cyanoacrylate.','Ground-glass microbeads.'],2,'Fine-milled polymer forms the bulk of the dip coating.'],
['Blood Spill','The bloodborne pathogens of greatest concern in nail salons are:',['Hepatitis B, Hepatitis C, and HIV.','Trichophyton and Candida.','Hepatitis A, herpes simplex, and HPV.','Staphylococcus and Streptococcus.'],0,'HBV, HCV, and HIV are the primary bloodborne pathogens of occupational concern.'],
['Pedicure','The pedicure service sequence generally follows:',['Assessment and polish removal, shaping, soaking, cuticle care, callus reduction, exfoliation, massage, then polish.','Massage first, then soak and polish removal.','Massage, shaping, soaking, then callus reduction.','Fresh polish before old polish removal.'],0,'This sequence prepares nails and skin safely before the final polish application.'],
['Nail Enhancements','A nail tip is adhered to the natural nail using:',['Cyanoacrylate nail tip adhesive in the contact zone.','Colored nail polish.','UV/LED gel across the underside.','Acrylic bead in the contact zone.'],0,'Apply nail tip adhesive to the contact zone and press at an angle to remove air bubbles.'],
['Safety and Sanitation','To minimize chemical vapor exposure during monomer application:',['Work with source-capture ventilation and keep containers capped.','Apply monomer quickly.','Use a higher bead ratio.','Heat the monomer.'],0,'Source capture removes vapors at the origin, and capped containers reduce evaporation.'],
['Pedicure','Moisturizing mask applied during a pedicure add-on:',['Permanently restructures skin proteins.','Permanently strips all dead skin.','Provides temporary deep conditioning and hydration during a set contact time.','Disinfects the skin.'],2,'Foot masks provide temporary hydration and conditioning.'],
['Nail Enhancements','Light buffing the nail plate before acrylic application creates:',['Micro-texture that improves mechanical adhesion.','Removal of the nail plate’s pink color.','Thinning needed for adhesion.','Nail growth stimulation.'],0,'Light buffing creates micro-abrasions; over-buffing thins the nail.'],
['Blood Spill','Engineering controls to reduce blood-exposure risk include:',['Handwashing reminder signs.','Using single-use implements to minimize sharps reuse.','Training on pathogen awareness.','Requiring medical histories.'],1,'Engineering controls are physical measures such as single-use implements and sharps containers.'],
['Manicure','Safe gel polish acetone removal requires:',['Two-minute foil wraps and peeling.','Peeling gel off immediately.','Full acetone contact time until softened, then gentle removal without force.','Dry coarse filing to the natural nail.'],2,'Removing gel while firm requires force and risks nail-plate damage.'],
['Nail Enhancements','The primary structural difference between a sculpted nail and a tip-and-overlay nail is:',['Different product.','Sculpted nails cannot be French.','Different removal procedure.','Sculpted nails use product built over a form — no plastic tip.'],3,'A sculpted extension is formed entirely with enhancement product over a form.'],
['Pedicure','Pumice stone for callus reduction:',['Is replaced only when it loses grit.','Is porous volcanic rock that cannot be reliably disinfected.','Is non-porous and fully disinfectable.','Can be sterilized by boiling.'],1,'Natural pumice is porous, so it must be single-use or assigned to one client.'],
['Nail Enhancements',"Consistent zone 2 breakage in a client's enhancements most likely indicates:",['Old product.','Insufficient cuticle oil.','Missing primer.','Insufficient apex height.'],3,'Without enough apex, stress concentrates at zone 2 and causes fractures.'],
['Nail Enhancements','Nail tip selection requires matching:',['Tip color to natural nail color.','Tip length before application.','Tip brand to product brand.','Contact-zone width to the client’s natural nail plate width.'],3,'A correct fit gives full coverage without gaps or skin overlap.']];let i=0,s=0,a=Array(20).fill(null),$=x=>document.getElementById(x),L='ABCD';function r(){let x=q[i];$('counter').textContent=`Question ${i+1} of 20`;$('bar').style.width=(i+1)*5+'%';$('topic').textContent=x[0];$('question').textContent=x[1];$('answers').innerHTML='';x[2].forEach((v,n)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class=letter>${L[n]}</span><span>${v}</span>`;b.onclick=()=>pick(n);$('answers').append(b)});$('feedback').className='feedback';$('prev').disabled=!i;$('next').disabled=a[i]===null;$('next').textContent=i==19?'See results →':'Next →';if(a[i]!=null)paint(a[i])}function pick(n){if(a[i]!=null)return;a[i]=n;if(n==q[i][3])s++;paint(n)}function paint(n){let x=q[i];[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j==x[3])b.classList.add('correct');if(j==n&&j!=x[3])b.classList.add('wrong')});let good=n==x[3];$('feedback').className='feedback show '+(good?'good':'bad');$('feedback').innerHTML=`<strong>${good?'Correct!':'Incorrect — correct answer: '+L[x[3]]}</strong>${x[4]}`;$('next').disabled=false}$('prev').onclick=()=>{if(i){i--;r()}};$('next').onclick=()=>{if(i<19){i++;r()}else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=s+'/20';$('rt').textContent='Your score';$('rp').textContent=`You answered ${s} of 20 questions correctly.`}};$('restart').onclick=()=>{i=s=0;a.fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');r()};r();
</script>
