<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Technology Practice Test 16</title>
  <style>
    :root{--ink:#211713;--rose:#bc214d;--rose-soft:#f8e9ee;--paper:#fffdfb;--line:#eadfd9;--muted:#796e68;--green:#557252;--green-soft:#f2f6f1;--red:#c42650}
    *{box-sizing:border-box} body{margin:0;background:#fbf7f4;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .top{border-bottom:1px solid var(--line);background:#fffdfb}.nav{max-width:1120px;margin:auto;padding:18px 26px;display:flex;align-items:center;gap:18px}
    .mark{width:31px;height:31px;border-radius:8px;background:var(--rose);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:21px;font-weight:bold}.brand{font:700 25px Georgia,serif}.sub{color:#857a74;font-size:13px}
    main{max-width:930px;margin:42px auto;padding:0 22px}.quiz{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:40px;box-shadow:0 12px 34px rgba(67,40,29,.05)}
    .test-label{font:600 12px monospace;letter-spacing:2px;text-transform:lowercase;color:var(--rose);margin-bottom:22px}.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font:13px monospace;letter-spacing:1px;text-transform:uppercase}
    .tag{background:#f8dbe3;color:#8e1438;border-radius:999px;padding:7px 14px;font-size:11px;letter-spacing:1px}.question{font:700 31px/1.2 Georgia,serif;margin:28px 0 26px}
    .options{display:grid;gap:12px}.option{width:100%;border:1px solid var(--line);background:#fffaf7;border-radius:14px;padding:17px 19px;display:flex;align-items:center;gap:18px;text-align:left;cursor:pointer;color:var(--ink);font-size:17px;line-height:1.35;transition:.15s}
    .option:hover:not(:disabled){border-color:#c4aaa1;background:#fff}.option:disabled{cursor:default}.letter{width:35px;height:35px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;flex:none;font:700 14px monospace;color:#7d5548;background:#fff}
    .option.correct{border-color:var(--green);background:var(--green-soft)}.option.correct .letter{background:var(--green);color:#fff;border-color:var(--green)}.option.incorrect{border-color:var(--red);background:var(--rose-soft)}.option.incorrect .letter{background:var(--red);color:#fff;border-color:var(--red)}
    .feedback{display:none;margin-top:24px;border-left:2px solid var(--green);background:#f7f9f6;border-radius:13px;padding:20px 24px;line-height:1.55}.feedback.show{display:block}.feedback.wrong{border-left-color:var(--red);background:#fff8fa}.feedback h3{margin:0 0 10px;font:600 12px monospace;letter-spacing:2px;text-transform:uppercase;color:var(--green)}.feedback.wrong h3{color:var(--red)}.feedback p{margin:0;font-size:16px;color:#51443e}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:34px;padding-top:22px}.progress{font:12px monospace;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:12px 21px;font-size:15px;font-weight:bold;cursor:pointer}.button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.button:disabled{opacity:.35;cursor:not-allowed}
    .results{text-align:center;padding:26px 5px}.results h1{font:700 35px Georgia,serif;margin:0 0 12px}.score{font:700 52px Georgia,serif;color:var(--rose);margin:20px 0}.review{margin-top:23px;text-align:left;border-top:1px solid var(--line);padding-top:20px}.review div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.good{color:var(--green)}.bad{color:var(--red)}
    @media(max-width:640px){.nav{padding:15px 18px}.brand{font-size:21px}.sub{display:none}main{margin:22px auto;padding:0 12px}.quiz{padding:25px 18px}.question{font-size:27px}.option{font-size:16px;padding:14px}.controls{flex-wrap:wrap}.progress{order:3;width:100%;text-align:center}}
  </style>
</head>
<body>
  <header class="top"><div class="nav"><div class="mark">N</div><div class="brand">Nail Technology Practice</div><div class="sub">Practice Questions</div></div></header>
  <main><section class="quiz" id="quiz" aria-live="polite"></section></main>
  <script>
    const questions = [
      {"topic":"Manicure and Pedicure Services","q":"Gel polish lamp compatibility means:","options":["LED always works with UV gel formulations.","The specific photoinitiators in the gel must be matched to the wavelengths emitted by the lamp.","All UV lamps produce identical results for every gel, since curing depends only on exposure time.","Lamp brand must match gel brand."],"answer":1,"rationale":"Gel formulations contain photoinitiators activated by specific wavelengths. Match the product to a compatible lamp; an incompatible pairing can leave the gel under-cured."},
      {"topic":"Nail Enhancement Services","q":"After completing an acrylic or gel full set, the finished nail should be inspected for:","options":["Only surface smoothness.","Apex, C-curve, smoothness, capping, and balance.","Client satisfaction only.","Only the nail shape and color accuracy."],"answer":1,"rationale":"A complete quality check includes apex placement, C-curve, smoothness, free-edge capping, adhesion, and overall balance."},
      {"topic":"Infection Control and Safety Practices","q":"A salon has no SDS for a product it uses. The correct action is:","options":["Create a temporary SDS based on the product label.","Continue using it.","SDS are optional for products sold to licensed professionals.","Obtain an SDS from the manufacturer and refrain from using the product until it is obtained."],"answer":3,"rationale":"Hazard information must be available for hazardous products. Obtain the manufacturer SDS and do not use the product until it is available."},
      {"topic":"Nail Service Tools","q":"Foil wraps used during enhancement removal serve to:","options":["Hold acetone-soaked cotton against the nail to slow evaporation.","Protect the nail from UV light during gel curing.","Protect the nail plate from damage during electric-file use.","Apply heat to speed up the removal process."],"answer":0,"rationale":"Foil keeps acetone-soaked cotton in close contact with the coating, maintaining saturation and slowing evaporation for effective soak-off removal."},
      {"topic":"Manicure and Pedicure Services","q":"Round nail shape is recommended for:","options":["Short nails, wide nail beds, or clients working with their hands.","Long, narrow nails wanting extra length emphasis and a tapered tip.","Only natural nails.","Clients wanting the maximum illusion of added length and a slender look."],"answer":0,"rationale":"Round nails follow the fingertip's natural curve. They are practical for short nails, wider nail beds, and clients who work with their hands."},
      {"topic":"Chemistry of Nail Products","q":"A no-wipe gel top coat differs from a standard top coat in that:","options":["It requires no UV or LED curing.","Slip agents prevent a sticky inhibition layer, so no cleanser wipe is needed.","It contains no photo-initiators and is therefore hypoallergenic.","It is applied without a brush directly from the bottle."],"answer":1,"rationale":"No-wipe top coats include additives that prevent or minimize the tacky inhibition layer. Standard gel top coats generally require a cleanser wipe after curing."},
      {"topic":"Nail Enhancement Services","q":"Pseudomonas infection under nail enhancements occurs most commonly because:","options":["The client applied hand cream under the enhancement.","The UV lamp heated the nail plate to a temperature favoring bacterial growth.","A lifting enhancement creates a warm, moist pocket ideal for Pseudomonas growth.","The enhancement product reacts chemically with the nail plate."],"answer":2,"rationale":"Lifting creates a warm, moist, enclosed gap. This environment supports Pseudomonas growth, so lifting should be addressed promptly."},
      {"topic":"Infection Control and Safety Practices","q":"The GHS signal word indicating the more severe hazard is:","options":["Alert.","Caution.","Danger.","Warning."],"answer":2,"rationale":"Under GHS, DANGER indicates the more severe hazard category. WARNING is used for less severe hazards, and only one signal word appears on a label."},
      {"topic":"Manicure and Pedicure Services","q":"Inspecting the pedicure basin for cracks is important because:","options":["Cracks harbor biofilm that cannot be removed by standard disinfection.","Cracks indicate the disinfectant concentration is too high.","Cracked basins are only aesthetically unpleasant.","Cracks change water temperature faster."],"answer":0,"rationale":"Cracks and damaged surfaces can harbor biofilm that resists cleaning and disinfection. A damaged basin should not be used until it is properly repaired or replaced."},
      {"topic":"Nail Enhancement Services","q":"The squeak test performed on finished acrylic or gel nails is:","options":["Rubbing the nail against a dry paper towel.","Pressing firmly on the apex to test structural strength.","Listening for popping sounds indicating delamination.","Running a lint-free cloth or fingernail across the dry surface."],"answer":3,"rationale":"The squeak test uses a dry lint-free cloth or fingernail over a finished surface. A properly prepared and finished surface feels clean and smooth rather than dull or draggy."},
      {"topic":"Post-Service Procedures","q":"The purpose of scheduling maintenance appointments at the end of each service is:","options":["To ensure the client commits before changing their mind.","To keep a regular schedule that maintains nail health and enhancement integrity.","To generate immediate revenue for the salon.","To fulfill state-board appointment scheduling requirements."],"answer":1,"rationale":"Regular maintenance prevents excessive growth-related imbalance, helps prevent lifting, and supports the condition and longevity of the enhancement."},
      {"topic":"Infection Control and Safety Practices","q":"Proper seated posture at the nail station requires:","options":["Hips below knee level to support spinal alignment.","Feet dangling to reduce lower-back pressure.","Leaning full upper-body weight onto the work surface.","Hips and knees at approximately 90 degrees with feet flat or on a footrest."],"answer":3,"rationale":"A neutral seated posture keeps the hips and knees near 90 degrees with the feet supported, reducing lumbar and lower-body strain."},
      {"topic":"Chemistry of Nail Products","q":"The purpose of nail primer in acrylic application is to:","options":["Dehydrate the nail plate to remove moisture.","Initiate polymerization when monomer contacts the plate.","Improve adhesion between the nail plate and enhancement product by bonding to both surfaces.","Prevent lifting by sealing the cuticle to the enhancement."],"answer":2,"rationale":"Primer acts as a bonding agent, helping bridge the adhesion gap between the natural nail plate and the enhancement product."},
      {"topic":"Nail Enhancement Services","q":"Air pockets (bubbles) under acrylic or gel enhancements are problematic because:","options":["They create a cosmetic imperfection only.","They improve flexibility of the enhancement.","They indicate over-curing of gel products.","They are voids that trap moisture and weaken adhesion."],"answer":3,"rationale":"Air pockets are adhesion failures. They can trap moisture and create conditions favorable for microbial growth, while also weakening the enhancement."},
      {"topic":"Manicure and Pedicure Services","q":"For a client with a wide nail bed seeking a more slender appearance, the recommended shape is:","options":["Oval or almond.","Round — it matches the natural shape.","Squoval for good balance.","A wide, blunt square shape."],"answer":0,"rationale":"Oval and almond shapes taper the sides and visually draw the eye along the nail length, creating a more slender appearance."},
      {"topic":"Nail Service Tools","q":"Which grit nail file is appropriate for shaping natural nails?","options":["100–150 grit — for general-purpose natural nail work.","180–240 grit — fine enough to shape natural nail without excessive thinning.","80–100 grit — coarse enough to shape a natural nail smoothly.","Any grit — natural nails are sturdy and grit selection does not matter."],"answer":1,"rationale":"A 180–240 grit file is appropriate for natural nails. Coarser files can excessively thin or damage the nail plate; file in one direction to reduce splitting."},
      {"topic":"Infection Control and Safety Practices","q":"A product's flash point of -20°C means it is:","options":["A combustible liquid needing a spark.","Extremely flammable.","Safe to use near open flames.","Non-flammable at room temperature."],"answer":1,"rationale":"A flash point of -20°C means the product can produce ignitable vapors far below room temperature. Keep it away from heat sources and open flames."},
      {"topic":"Nail Enhancement Services","q":"Pink and white (French) gel or acrylic nail enhancements require:","options":["A single product with built-in color-zone separation.","Two enhancement products: a pink or nude for the nail bed and white for the free-edge extension.","White product applied first, then a pink overlay blended over it to form the smile line.","A single white product applied to the entire nail."],"answer":1,"rationale":"A classic pink-and-white enhancement uses separate white product for the free edge and pink or nude product for the nail-bed area, creating a crisp smile line."},
      {"topic":"Manicure and Pedicure Services","q":"Gel polish over cured acrylic:","options":["Requires a special bridge coat between acrylic and gel.","Can be performed — apply gel polish over cured acrylic using the normal gel application steps.","Is not possible because the systems use incompatible chemistry.","Requires acrylic removal before gel can be applied."],"answer":1,"rationale":"Gel polish may be applied over a properly prepared cured acrylic surface. Use the normal compatible gel application steps and cure according to product directions."},
      {"topic":"Nail Enhancement Services","q":"Toenail enhancement application follows the same principles as fingernail enhancement with the addition of:","options":["Higher primer concentration for toenail adhesion.","Accounting for footwear pressure and keeping length modest.","Thinner product layers due to thinner toenail plates.","A different UV lamp for toenail gel services."],"answer":1,"rationale":"Toenail enhancements experience footwear pressure, walking impact, and shoe confinement. A modest length and appropriate structure help prevent breakage."}
    ];
    let current=0; const answers=Array(questions.length).fill(null);
    const letters=['A','B','C','D'];
    function render(){
      const root=document.getElementById('quiz');
      if(current===questions.length){renderResults(root);return;}
      const item=questions[current], selected=answers[current], answered=selected!==null;
      let options=item.options.map(function(option,index){
        let state='';
        if(answered){if(index===item.answer) state=' correct'; else if(index===selected) state=' incorrect';}
        return '<button class="option'+state+'" '+(answered?'disabled':'')+' onclick="choose('+index+')"><span class="letter">'+letters[index]+'</span><span>'+option+'</span></button>';
      }).join('');
      const feedback=answered ? '<div class="feedback show '+(selected===item.answer?'':'wrong')+'"><h3>'+ (selected===item.answer?'Correct · Rationale':'Incorrect · Correct answer: '+letters[item.answer]) +'</h3><p>'+item.rationale+'</p></div>' : '';
      root.innerHTML='<div class="test-label">practice test 16</div><div class="meta"><span>Question '+(current+1)+' of '+questions.length+'</span><span class="tag">'+item.topic+'</span></div><h1 class="question">'+item.q+'</h1><div class="options">'+options+'</div>'+feedback+'<div class="controls"><button class="button secondary" onclick="previous()" '+(current===0?'disabled':'')+'>← Previous</button><div class="progress">'+answers.filter(function(a){return a!==null;}).length+' answered · '+questions.length+' total</div><button class="button" onclick="next()">'+(current===questions.length-1?'Finish':'Next →')+'</button></div>';
    }
    function choose(index){if(answers[current]===null){answers[current]=index;render();}}
    function previous(){if(current>0){current--;render();}}
    function next(){if(current<questions.length-1){current++;render();}else if(answers.every(function(a){return a!==null;})){current++;render();}else{const first=answers.findIndex(function(a){return a===null;});current=first;render();}}
    function renderResults(root){const correct=answers.reduce(function(total,answer,index){return total+(answer===questions[index].answer?1:0);},0);const rows=questions.map(function(item,index){const ok=answers[index]===item.answer;return '<div class="'+(ok?'good':'bad')+'>'+ (index+1)+'. '+(ok?'✓ Correct':'✕ Correct answer: '+letters[item.answer])+'</div>';}).join('');root.innerHTML='<div class="test-label">practice test 16</div><div class="results"><h1>Test complete</h1><p>You answered all 20 questions.</p><div class="score">'+correct+' / '+questions.length+'</div><button class="button" onclick="retake()">Retake test</button><div class="review">'+rows+'</div></div>';}
    function retake(){for(let i=0;i<answers.length;i++)answers[i]=null;current=0;render();}
    render();
  </script>
</body>
</html>
