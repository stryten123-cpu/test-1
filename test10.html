<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 10</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Nail Enhancements","q":"When removing a hard gel nail enhancement, the technician:","a":["Soaks it in acetone because hard gel dissolves easily.","Files off the bulk to a thin layer, then gently buffs off the remainder.","Applies cuticle remover to dissolve the hard gel over 30 minutes.","Peels the gel from the free edge using a cuticle pusher."],"c":1,"e":"Hard gel does not soak off easily. It must be carefully filed to a thin layer and removed without damaging the natural nail plate."},{"t":"Manicure / Nail Enhancements","q":"The apex of a nail enhancement refers to:","a":["The lunula area at the nail base.","The highest point of the enhancement, over the stress zone, for strength.","The zone where the enhancement meets the natural nail at the cuticle.","The free-edge tip."],"c":1,"e":"The apex is the highest point of the enhancement arch and provides structural strength by distributing stress."},{"t":"Blood Spill / Safety","q":"An exposure incident under OSHA's bloodborne-pathogens standard means:","a":["Any client complaint about a service.","Inhalation of chemical vapors during application.","Specific contact of the eyes, mouth, non-intact skin, or skin penetration with blood or other potentially infectious material.","Any skin contact with a nail product such as monomer or acetone."],"c":2,"e":"An exposure incident involves blood or other potentially infectious material contacting the eyes, mouth, non-intact skin, or entering through the skin."},{"t":"Nail Enhancements","q":"Enhancement products should never be applied over any nail condition that presents:","a":["Mild surface ridges.","Natural nail color variation.","Mild dryness at the cuticle.","Signs of infection, open wounds, or suspected non-serviceable disorders."],"c":3,"e":"Enhancements can trap or worsen an infection and should never cover wounds or a non-serviceable disorder."},{"t":"Pedicure","q":"Before applying polish to toenails after a pedicure massage, the technician should:","a":["Apply an extra base coat over the massage oil.","Cleanse the toenails with an alcohol prep wipe to remove massage oil.","Apply base coat immediately.","Have the client walk briefly so floor friction removes the oil."],"c":1,"e":"Removing massage oil from the nail plate allows the base coat and polish to adhere properly."},{"t":"Nail Enhancements","q":"Gel enhancement application on a client with very thin natural nail plates requires:","a":["No special considerations.","Light buffing, careful primer application, and monitoring for heat sensitivity.","A medical-grade primer.","More layers of builder gel to compensate."],"c":1,"e":"Thin nail plates are easily damaged by aggressive buffing and may feel curing heat more strongly."},{"t":"Safety and Sanitation","q":"If implements show visible organic debris after disinfection, the cause is most likely:","a":["Incorrect storage after disinfection.","Inadequate pre-cleaning—the debris was not removed before disinfection.","Excessive disinfectant contact time.","A disinfectant that lost enzymes needed to dissolve debris."],"c":1,"e":"Disinfectants work properly only on items that have first been thoroughly cleaned of visible debris."},{"t":"Pedicure","q":"Toe separators during polish application:","a":["Provide stability for foot-care steps.","Assist with callus reduction.","Stretch the toe joints to speed polish drying.","Keep toes apart so fresh polish does not transfer between adjacent toes during drying."],"c":3,"e":"Toe separators prevent adjacent toes from touching and smearing fresh polish."},{"t":"Nail Enhancements","q":"Powder dip products are classified as:","a":["A type of gel polish requiring a UV lamp.","A hybrid system between acrylic and gel.","An air-dry nail lacquer with added powder.","A cyanoacrylate-based coating system."],"c":3,"e":"Powder dip uses a cyanoacrylate-based adhesive that polymerizes around powder particles when activated."},{"t":"Safety and Sanitation","q":"A pedicure basin must be disinfected:","a":["Once daily at the end of business.","Between every client using an EPA-registered disinfectant for the full contact time.","Weekly during deep cleaning.","Only when visible debris is present."],"c":1,"e":"The basin must be cleaned and disinfected between every client to prevent pathogen growth and cross-contamination."},{"t":"Manicure","q":"The ballerina nail shape gets its name from:","a":["Its tapered body and flat square tip resembling a ballerina's pointe-shoe toe box.","A ballet dancer's rounded, flexible toe positions.","Its popularity among professional ballet dancers.","The technique used to create it."],"c":0,"e":"The tapered sides and flat, squared tip resemble the toe box of a ballerina’s pointe shoe."},{"t":"Nail Enhancements","q":"The 'squeeze method,' or pinching a gel enhancement while curing, refers to:","a":["Squeezing the builder-gel tube to control flow.","Squeezing the nail sides together only to make a narrow shape.","Applying lateral pressure to the gel sides during curing to shape the C-curve.","Pressing gel firmly onto the nail plate to improve adhesion."],"c":2,"e":"Lateral pressure during the early cure shapes the C-curve before full polymerization locks the enhancement in place."},{"t":"Blood Spill / Safety","q":"Personal protective equipment (PPE) for nail-salon blood-exposure prevention includes:","a":["Salon uniforms and name badges.","Safety goggles, steel-toed boots, and hard hats.","Anti-static wrist bands used during electric-file work.","Gloves, masks, and eye protection as barriers against blood and chemical splashes."],"c":3,"e":"Appropriate PPE creates a physical barrier between the technician and potentially infectious material."},{"t":"Nail Enhancements","q":"The activator in a powder dip system:","a":["Is the same as the base coat.","Provides UV energy to cure the powder layer.","Polymerizes the cyanoacrylate, hardening the powder layer through a chemical reaction.","Is used only once after final buffing."],"c":2,"e":"The activator accelerates cyanoacrylate polymerization so the dip-powder layers harden."},{"t":"Pedicure","q":"Callus reduction during a pedicure uses:","a":["A foot file, pumice stone, or callus-softening product.","A razor blade drawn across the heel.","A chemical peel that removes the entire callus in one application.","An acetone soak."],"c":0,"e":"Foot files, pumice, and approved softeners safely reduce thickened skin; razor blades should not be used."},{"t":"Safety and Sanitation","q":"An antiseptic differs from a disinfectant because antiseptics are:","a":["Used only to reduce airborne pathogens.","Too harsh and toxic for living skin.","Formulated for safe use on living tissue without damaging it.","Used only on implements."],"c":2,"e":"Antiseptics are formulated for skin and living tissue, while disinfectants are intended for nonliving surfaces."},{"t":"Nail Enhancements","q":"The purpose of a gel nail form is:","a":["To protect adjacent nails during application.","To provide a disposable scaffold under the free edge on which the gel extension is sculpted.","To hold the UV/LED lamp at the correct angle.","To act only as a ruler for measuring extension length."],"c":1,"e":"The form supports the gel while the extension is sculpted and is removed after curing."},{"t":"Nail Enhancements","q":"Powder dip top coat differs from gel-polish top coat because it:","a":["Requires a longer UV cure.","Must be applied in at least three coats.","Is chemically identical to gel top coat.","Does not require UV/LED curing."],"c":3,"e":"Powder-dip top coat air-dries or works with an activator, while gel-polish top coat requires a curing lamp."},{"t":"Safety and Sanitation","q":"Section 8 of a Safety Data Sheet (SDS) covers:","a":["Ecological and environmental information.","Regulatory information and shipping labels.","Reactivity and stability.","Exposure controls and required personal protective equipment."],"c":3,"e":"SDS Section 8 lists exposure limits, engineering controls, and PPE required for safe handling."},{"t":"Pedicure / Safety","q":"Water temperature for a diabetic pedicure soak should be:","a":["As hot as the client can tolerate.","Cold to reduce inflammation.","Comfortably warm—about 100°F—and tested by the technician before the client’s foot enters.","At least 110°F to maximize circulation."],"c":2,"e":"Diabetic neuropathy can reduce heat sensation, so the technician must test comfortably warm water to prevent burns."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
