<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 11</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Nail Enhancements","q":"A gel tip-and-overlay service applies:","a":["UV gel only to the plastic tip, leaving the natural nail uncovered.","Only gel polish over the natural nail without an extension.","A tip and overlay of acrylic product rather than gel.","Enhancement product over the natural nail with a pre-formed extension tip as the base for added length."],"c":3,"e":"A pre-formed tip provides added length, and gel is applied over the natural nail and tip as a structural overlay."},{"t":"Pedicure","q":"Effleurage strokes during a pedicure lower-leg massage are directed:","a":["From the knee downward toward the ankle.","Across the leg from side to side.","In circles around the ankle only.","From the ankle upward toward the knee."],"c":3,"e":"Effleurage strokes move upward from the ankle toward the knee to support circulation."},{"t":"Safety and Sanitation","q":"Spraying implements with disinfectant rather than immersing them is:","a":["Acceptable when the implements look clean.","Insufficient because complete immersion for the required contact time is necessary.","Required for all metal implements.","Equivalent to immersion if sprayed twice."],"c":1,"e":"Disinfectable implements must be fully immersed for the complete labeled contact time."},{"t":"Nail Enhancements","q":"N95 respiratory protection during nail enhancement services filters:","a":["Only large dust particles.","Both chemical vapors and particulates equally.","Chemical vapors released by monomer and solvent products.","Airborne particulates, including fine nail dust generated during filing."],"c":3,"e":"N95 respirators filter airborne particles, including fine nail dust, but not chemical vapors."},{"t":"Manicure","q":"Petrissage on the thenar eminence:","a":["Uses rapid tapping to stimulate the area.","Should be avoided.","Kneads and squeezes the muscle at the base of the thumb.","Uses light superficial stroking only."],"c":2,"e":"Petrissage uses kneading and squeezing on deeper muscle tissue."},{"t":"Safety and Sanitation","q":"The employer's responsibility under OSHA HazCom includes:","a":["Testing all products for safety before employee use.","Ensuring employees are trained on chemical hazards and that Safety Data Sheets are accessible.","Purchasing only products containing no hazardous ingredients.","Providing every client with a full SDS before service."],"c":1,"e":"OSHA HazCom requires hazard training and accessible Safety Data Sheets."},{"t":"Nail Enhancements","q":"Powder dip typically provides durability of:","a":["3–4 weeks with normal wear.","3–5 days, similar to regular polish.","6–8 weeks without maintenance.","Indefinitely until it is filed off."],"c":0,"e":"Powder-dip enhancements typically last about three to four weeks."},{"t":"Pedicure","q":"Hot stone massage during a pedicure uses:","a":["Heated basalt stones in effleurage strokes.","Room-temperature stones as ankle weights.","Cold stones to reduce inflammation.","Mineral stones soaked in essential oils."],"c":0,"e":"Basalt retains heat well and is used with effleurage strokes."},{"t":"Nail Enhancements","q":"Onycholysis developing under a nail enhancement indicates:","a":["A normal response to enhancement weight over time.","Possible infection in the separation space, mechanical trauma, or a product reaction.","The enhancement needs to be thicker.","The nail plate is naturally too thin for every enhancement product."],"c":1,"e":"Onycholysis is abnormal; remove the enhancement so the nail can be assessed."},{"t":"Safety and Sanitation","q":"A client discloses being HIV-positive before a nail service. The technician should:","a":["Proceed with standard precautions.","Require physician clearance before proceeding.","Decline the service to protect themselves.","Use double gloves throughout the entire service."],"c":0,"e":"Standard precautions apply to every client regardless of known health status."},{"t":"Pedicure","q":"Ingrown toenail prevention involves:","a":["Cutting the nail straight across and not too short.","Applying nail hardener at the corners.","Cutting the nail corners deeply rounded.","Cutting at 45 degrees from each corner."],"c":0,"e":"Straight-across cutting with corners intact helps prevent ingrown edges."},{"t":"Nail Enhancements","q":"Gel nail products must be stored away from UV and visible light sources because:","a":["Light exposure bleaches the pigments.","Light exposure thins the gel.","Ambient light creates a protective skin.","Photoinitiators can be activated by ambient light, causing premature polymerization in the container."],"c":3,"e":"UV and some visible light can activate photoinitiators and begin curing the gel."},{"t":"Safety and Sanitation","q":"The clean-disinfect-store sequence must occur in exactly that order because:","a":["State board regulations specify it by statute.","Debris blocks disinfectant action, and disinfected items need protection from recontamination.","The disinfectant activates the cleaning agent.","Storing implements before disinfection prevents corrosion."],"c":1,"e":"Cleaning removes debris, disinfection destroys pathogens, and storage prevents recontamination."},{"t":"Pedicure","q":"A lower-leg pedicure massage extends to:","a":["The knee joint and thigh muscles above it.","The entire leg up to the hip.","Just below the knee to the ankle and foot.","Only the foot, with no lower-leg massage."],"c":2,"e":"Pedicure massage includes the foot and lower leg but does not extend above the knee."},{"t":"Nail Enhancements","q":"The 'no-double-dip' rule in powder-dip services means:","a":["A used nail is never re-dipped into the shared powder container.","The nail may be dipped no more than twice.","Activator is required between each dip.","The nail must fully air-dry before another layer."],"c":0,"e":"Powder should be individually dispensed or poured to prevent cross-contamination."},{"t":"Safety and Sanitation","q":"Why is any post-service implement treated as contaminated even when it appears clean?","a":["Pathogens are invisible, and intact-skin contact can transfer microbes.","One nail carries too little contamination to matter.","Only implements touching visible infection require decontamination.","Contamination occurs only when bleeding happens."],"c":0,"e":"Microorganisms are invisible and can transfer during ordinary client contact."},{"t":"Manicure","q":"A paraffin-wax manicure add-on is performed by:","a":["Dipping the hand in warm wax multiple times, then wrapping it in plastic and a towel to retain heat.","Brushing on a thin film and peeling it away.","Melting wax into hand cream and massaging it in.","Applying one coat and curing it under a UV lamp."],"c":0,"e":"Several wax layers and insulating wraps retain warmth and condition the skin."},{"t":"Nail Enhancements","q":"When gel is applied too close to the lateral nail folds:","a":["Lifting develops as skin movement and oils separate the product from the nail-plate edge.","It protects the folds from water.","Moist skin boosts adhesion.","It creates a stronger sidewall."],"c":0,"e":"Skin oil and movement weaken adhesion and cause lifting."},{"t":"Safety and Sanitation","q":"MMA (methyl methacrylate) is prohibited in professional nail products because it:","a":["Is a DEA-controlled substance.","Can cause severe allergic reactions and is rigid enough to rip the natural nail plate.","Produces insufficient odor.","Is more expensive than EMA."],"c":1,"e":"MMA can cause sensitization and serious natural-nail damage."},{"t":"Pedicure","q":"After the foot soak, the technician:","a":["Applies polish immediately.","Applies callus softener and re-soaks for ten minutes.","Pats the feet dry with a clean towel before beginning nail-care steps.","Immediately begins callus reduction while the foot is wet."],"c":2,"e":"Feet should be patted dry because wet, slippery feet are harder to work with."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
