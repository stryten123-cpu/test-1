<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nail Technology Practice Test 18</title>
<style>
  :root{--ink:#241815;--muted:#766b66;--paper:#fbf7f4;--card:#fff;--line:#e7ddd7;--rose:#bf214d;--pink:#f8dce4;--green:#587654;--green-bg:#edf3ec;--red:#c81e4b;--red-bg:#fff0f4}
  *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#fff9f7,#f8efec);color:var(--ink);font-family:Arial,sans-serif}
  .shell{max-width:940px;margin:0 auto;padding:28px 18px 48px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.brand{font:700 23px Georgia,serif}.mark{display:inline-grid;place-items:center;width:29px;height:29px;margin-right:8px;border-radius:7px;background:var(--rose);color:#fff;font:700 18px Georgia,serif}.test{margin-left:auto;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}.counter{color:var(--muted);font-size:13px;font-weight:700}.progress{height:8px;overflow:hidden;border-radius:99px;background:#eadfda;margin-bottom:25px}.progress div{height:100%;width:0;background:var(--rose);transition:width .25s}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(24px,5vw,46px);box-shadow:0 18px 54px #3f251e14}.topic{display:inline-flex;padding:7px 12px;border-radius:999px;background:var(--pink);color:#8e1939;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(23px,3vw,32px)/1.28 Georgia,serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;padding:17px 18px;border:1px solid #eadfda;border-radius:16px;background:#fffaf8;color:var(--ink);cursor:pointer;font:inherit;font-size:16px;line-height:1.42;text-align:left}.answer:not(:disabled):hover{border-color:#c9aaa2;background:#fff}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:9px;display:grid;place-items:center;background:#fff;font-weight:900}.answer.correct{background:var(--green-bg);border-color:var(--green)}.answer.correct .letter{background:var(--green);color:#fff}.answer.wrong{background:var(--red-bg);border-color:var(--red)}.answer.wrong .letter{background:var(--red);color:#fff}.answer:disabled{cursor:default;color:var(--ink)}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.55}.feedback.show{display:block}.good{background:var(--green-bg);border-color:var(--green)}.bad{background:var(--red-bg);border-color:var(--red)}.feedback-title{display:block;margin-bottom:7px;font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.btn{border:0;border-radius:14px;padding:13px 20px;font:700 16px Arial,sans-serif;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1;color:var(--ink)}.btn:disabled{opacity:.42;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center;padding:60px 24px}.score{font:800 76px Georgia,serif;color:var(--rose);margin:10px 0}.result h1{font:400 33px Georgia,serif;margin:0}.result p{color:var(--muted)}
  @media(max-width:620px){.test{margin-left:0}.question{font-size:24px}.answer{font-size:15px}.btn{padding:12px 15px}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="brand"><span class="mark">N</span>Nail Technology Practice</div><span class="test">Test 18</span><span id="counter" class="counter"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
  <section id="result" class="card result hidden"><h1>Test complete</h1><div id="score" class="score"></div><p id="summary"></p><button id="restart" class="btn primary">Restart Test 18</button></section>
</main>
<script>
const questions=[
 {topic:'Nail Enhancement Services',q:'Ventilation in a nail salon performing enhancement services must be adequate to:',a:['Maintain a pleasant odor by masking fumes with fragrance.','Replace the need for PPE.','Dilute vapors until they are undetectable by smell.','Keep airborne chemical concentrations below occupational exposure limits.'],c:3,r:'Adequate ventilation keeps monomer vapor and dust below occupational exposure limits. Smell is not a reliable safety indicator.'},
 {topic:'Safety and Sanitation',q:'The GHS flame pictogram indicates:',a:['Aquatic toxicity.','Explosion hazard.','Flammability.','Serious eye damage.'],c:2,r:'The flame pictogram warns of flammable products, such as acetone and monomer, which must be kept away from heat sources.'},
 {topic:'Manicure and Pedicure Services',q:'The “no-chip” or “long-lasting” polish service uses:',a:['A liquid-and-powder acrylic system.','A special air-dry polish.','Gel polish cured under UV/LED.','Regular polish applied in extra layers.'],c:2,r:'“No-chip” and “long-lasting polish” are consumer terms for gel polish services cured under UV or LED.'},
 {topic:'Nail Enhancement Services',q:'When the natural free edge is extremely short or the nail has been bitten, tips can be applied by:',a:['Refusing the service.','Applying a tip without adhesive.','Gluing several small tips together.','Using minimal-contact or full-well tips that fit the entire nail plate.'],c:3,r:'Very short nails can still receive extensions using properly fitted minimal-contact or full-coverage tips.'},
 {topic:'Nail Enhancement Services',q:'Proper workstation ventilation during acrylic services primarily protects against:',a:['Exothermic heat from polymerization.','EMA monomer vapor.','PMMA powder from the contained liquid system.','UV light from curing lamps.'],c:1,r:'Source-capture ventilation removes EMA monomer vapor at the workstation before it reaches the breathing zone.'},
 {topic:'Manicure and Pedicure Services',q:'Square nail shape is most suitable for:',a:['Any nail-bed shape equally.','Long, narrow nail beds or clients desiring a geometric look.','Short, wide nail beds.','Short, narrow nail beds needing added width.'],c:1,r:'Square nails are most flattering on longer, narrower nail beds. On wide, short nails, square edges can make the nail appear shorter.'},
 {topic:'Safety and Sanitation',q:'Which ergonomic modification is most effective for lower back pain in a nail technician?',a:['Adjust chair height and workstation to maintain a neutral lumbar spine.','Take one long break instead of short micro-breaks.','Wear a lumbar support belt all day.','Perform every service standing.'],c:0,r:'Proper chair and workstation height helps maintain neutral posture, supported feet, and hips and knees near 90 degrees.'},
 {topic:'Nail Enhancement Services',q:'Zone 1 of a nail enhancement is:',a:['The free edge or extension area where new length is created.','The entire enhancement surface.','The cuticle area.','The center stress area where the apex is placed.'],c:0,r:'Zone 1 is the free-edge/extension area that extends beyond the natural free edge.'},
 {topic:'Manicure and Pedicure Services',q:'The massage sequence in a manicure begins with effleurage because it:',a:['Is required by regulations.','Is only useful for quickly covering large areas.','Creates the deepest therapeutic effect.','Warms tissue, makes contact, and assesses it before deeper work.'],c:3,r:'Effleurage introduces touch, warms superficial tissue, spreads product, and gives tactile information before deeper massage.'},
 {topic:'Safety and Sanitation',q:'Acetone disposal requires:',a:['Evaporating it in an open container before drain disposal.','Mixing it with water before drain disposal.','Pouring it down the drain after service.','Following local regulations for flammable liquid waste.'],c:3,r:'Acetone is flammable solvent waste and must be handled under applicable local hazardous-waste requirements.'},
 {topic:'Nail Enhancement Services',q:'The correct handling of nail-tip adhesive to prevent skin exposure is:',a:['Apply adhesive to both the tip and nail plate.','Use a generous amount and wipe excess from skin.','Apply minimal adhesive to the contact zone with proper tip sizing.','Brush adhesive broadly over the nail plate.'],c:2,r:'Minimal adhesive in a correctly sized contact zone prevents seepage onto the nail plate or skin.'},
 {topic:'Manicure and Pedicure Services',q:'A waterless pedicure is preferred for which client?',a:['A client who dislikes warm water.','A client who requests a faster service.','A diabetic client, where water exposure risks skin maceration.','A client with very dry skin needing moisture.'],c:2,r:'Waterless pedicures limit prolonged water exposure, which is especially important for diabetic clients.'},
 {topic:'Safety and Sanitation',q:'Section 6 of an SDS covers:',a:['Accidental-release measures and spill-cleanup procedures.','Physical and chemical properties.','Regulatory information.','Hazard identification.'],c:0,r:'Section 6, Accidental Release Measures, explains safe actions and cleanup procedures for spills and leaks.'},
 {topic:'Nail Enhancement Services',q:'Gloves are changed between clients during enhancement services to:',a:['Prevent cross-contamination between clients.','Match the color of the service.','Comply with hourly glove-change rules.','Maintain consistent grip strength.'],c:0,r:'Gloves contact client skin and products; changing them between clients prevents transfer of organisms.'},
 {topic:'Manicure and Pedicure Services',q:'Appropriate depth of pressure for pedicure lower-leg massage is:',a:['Adjusted to client preference and tissue response.','Standardized at medium pressure.','As firm as possible.','Always limited to light effleurage.'],c:0,r:'Massage pressure is individualized according to tissue response and client feedback to remain effective and comfortable.'},
 {topic:'Nail Enhancement Services',q:'During hard-gel removal by filing, the natural nail plate must be protected by:',a:['Soaking the gel in warm water first.','Using only circular filing motions.','Filing to a thin protective layer, then gently buffing without reaching bare plate.','Applying extra polish before filing.'],c:2,r:'Stop filing before the natural nail plate and gently remove only the remaining thin layer with a fine buffer.'},
 {topic:'Safety and Sanitation',q:'A nail technician with recurring headaches and nausea after shifts should first:',a:['Have salon ventilation assessed and chemical exposure evaluated.','Take pain reliever before every shift.','Request better desk lighting.','Consult a dermatologist.'],c:0,r:'Recurring headaches and nausea can indicate chemical overexposure. Ventilation and exposure assessment are appropriate first steps.'},
 {topic:'Manicure and Pedicure Services',q:'Massage in manicure services covers:',a:['Only the fingers.','Only the palm and base of the thumb.','Fingers, hand, forearm, and upper arm to the shoulder.','Fingers, hand, and forearm up to the elbow.'],c:3,r:'Standard manicure massage includes the fingers, hand, and forearm up to the elbow.'},
 {topic:'Nail Enhancement Services',q:'Nail extensions are contraindicated for clients who:',a:['Have actively infected nail tissue.','Use hand cream regularly.','Are left-handed.','Have naturally short nail beds.'],c:0,r:'Active bacterial, fungal, or Pseudomonas infection contraindicates enhancement application.'},
 {topic:'Safety and Sanitation',q:'EPA-registered disinfectant contact time must be followed because:',a:['Longer time is always preferred.','It is the minimum exposure needed to achieve the stated kill claims.','The product works immediately on contact.','Shorter times improve productivity without reducing efficacy.'],c:1,r:'Contact time is the minimum duration required for disinfection efficacy. Removing items early can leave organisms alive.'}
];
/*
 {topic:'Blood Spill',q:'When a blood spill occurs during a nail service, the technician should first:',a:['Continue the service after wiping the area with a towel.','Put on gloves and stop the service to address the exposure safely.','Apply polish over the affected area to seal it.','Ask the client to handle the cleanup alone.'],c:1,r:'Use appropriate personal protective equipment and follow blood-exposure procedures before continuing or ending the service.'},
 {topic:'Manicure and Pedicure Services',q:'During a manicure, cuticle remover is used primarily to:',a:['Dissolve the nail plate.','Soften and loosen excess nonliving tissue for gentle removal.','Disinfect the nail plate.','Replace the need for a hand wash.'],c:1,r:'Cuticle remover softens excess nonliving tissue so it can be removed carefully without damaging living tissue.'},
 {topic:'Nail Enhancement Services',q:'The apex of a nail enhancement is important because it:',a:['Creates the strongest point to support the nail’s stress area.','Makes the free edge thinner than the natural nail.','Eliminates the need for proper sidewall balance.','Allows the enhancement to cure without a lamp.'],c:0,r:'A properly placed apex provides structural strength and helps the enhancement resist breaking at the stress area.'},
 {topic:'Nail Enhancement Services',q:'Product-to-skin distance during acrylic application is monitored by:',a:['Visual assessment from straight on and from the side.','A ruler held near the cuticle to measure the gap between product and skin.','The client’s feedback about how close the product feels to the skin.','A plastic measuring template applied to the nail before the product.'],c:0,r:'Visual monitoring from multiple angles confirms the proper gap. Products placed too close are removed immediately while still workable.'},
 {topic:'Manicure and Pedicure Services',q:'Direction of effleurage strokes on the forearm during manicure massage:',a:['Wrist to elbow.','From the elbow down to the wrist.','Random directions.','Always across muscle fibers only.'],c:0,r:'Effleurage moves toward the heart (centripetal), from wrist to elbow on the forearm.'},
 {topic:'Safety and Sanitation',q:'TLV-TWA for a chemical represents:',a:['Average airborne concentration safe for 8-hour exposure.','Total lethal volume causing harm.','Time required for complete volatilization.','Temperature at which the chemical becomes toxic.'],c:0,r:'TLV-TWA is the average airborne concentration considered safe for repeated daily 8-hour exposure.'},
 {topic:'Nail Enhancement Services',q:'A Pseudomonas infection under a nail enhancement appears as:',a:['Diffuse yellowing across the entire enhancement.','White discoloration indicating incomplete cure.','A confined green-black spot beneath a lifting enhancement.','Red inflammation visible through the enhancement.'],c:2,r:'Pseudomonas discoloration is commonly yellow-green to blue-green or black and is confined to a lifting area.'},
 {topic:'Manicure and Pedicure Services',q:'Observing suspicious lesions on a client’s foot, the nail technician should:',a:['Apply antiseptic and simply monitor it at future appointments.','Note the finding, describe it to the client, and recommend medical evaluation.','Photograph the lesion for documentation.','Diagnose it and recommend an over-the-counter treatment.'],c:1,r:'Nail technicians recognize abnormalities but do not diagnose. A suspicious finding warrants a recommendation for medical evaluation.'},
 {topic:'Safety and Sanitation',q:'Nitrile gloves are preferred over latex for nail technicians because:',a:['Latex provides superior chemical resistance.','Nitrile eliminates latex allergy risk with adequate chemical resistance.','Latex is the only glove OSHA approves for blood exposure.','Nitrile dissolves on contact with acetone.'],c:1,r:'Nitrile avoids latex allergy risk and offers suitable resistance to most nail-salon chemicals.'},
 {topic:'Nail Enhancement Services',q:'The “C-curve mold” technique during gel extension application involves:',a:['Applying gel in repeated C-shaped brush strokes.','Using a C-curve stick, pinching the enhancement sides together before full cure to shape the arch.','Clamping a metal cutter over wet gel through the whole cure.','Molding the client’s finger into a C-shape.'],c:1,r:'Before full cure locks the form, the sides are pinched together or shaped with a C-curve stick to create the cross-sectional arch.'},
 {topic:'Manicure and Pedicure Services',q:'Clients should avoid using nails as tools with gel polish because:',a:['Repeated tool use makes the coating harder to chip.','It only loosens bare natural nails.','Leverage stress can cause chipping or lifting at the gel-nail interface.','It has no effect on gel polish.'],c:2,r:'Using nails as tools applies leverage stress at the free edge or sides, which can cause chipping or lifting.'},
 {topic:'Nail Enhancement Services',q:'A methacrylate allergy means acrylic nail services are:',a:['Possible using MMA instead of EMA.','Safe if skin contact is avoided.','Safe with extra ventilation.','Contraindicated because EMA is also a methacrylate.'],c:3,r:'A methacrylate allergy contraindicates acrylic services. Both EMA and prohibited MMA are methacrylates.'},
 {topic:'Safety and Sanitation',q:'A pregnant client requests an acrylic enhancement service. The nail technician should:',a:['Limit the service to gel polish only.','Decline all chemical nail services.','Inform the client of potential chemical exposure concerns and recommend she consult her physician.','Proceed normally because topical products present no fetal risk.'],c:2,r:'There is no universal prohibition, but chemical-exposure concerns warrant informing the client and deferring medical decisions to her physician.'},
 {topic:'Manicure and Pedicure Services',q:'Paraffin temperature for a pedicure should be approximately:',a:['120–125°F.','Room temperature only.','At least 150°F for deep heat.','As hot as possible.'],c:0,r:'Paraffin for pedicure is maintained around 120–125°F: warm enough to condition deeply without burning.'},
 {topic:'Nail Enhancement Services',q:'The primary chemical hazard in liquid acrylic monomer services is:',a:['Exothermic heat produced during polymerization.','EMA (ethyl methacrylate) vapor.','PMMA polymer powder becoming airborne during filing.','UV light produced by the curing lamp.'],c:1,r:'EMA monomer vapor is a primary hazard because chronic exposure can cause respiratory irritation and sensitization.'},
 {topic:'Safety and Sanitation',q:'Section 4 of an SDS provides:',a:['Accidental-release and spill-containment steps.','First-aid measures for skin, eye, ingestion, or inhalation exposure.','Composition data and ingredient information.','Stability and reactivity data.'],c:1,r:'Section 4 is First Aid Measures and explains what to do for exposure by each route.'},
 {topic:'Manicure and Pedicure Services',q:'Massage lotion is applied during nail service:',a:['Only for pedicure.','At the very end after polish.','During the massage phase; the nail plate is cleansed afterward before polish.','Before any nail-care steps.'],c:2,r:'Massage cream or lotion is used during the massage phase. The nail plate is cleansed afterward to remove oils before polish.'},
 {topic:'Nail Enhancement Services',q:'Length-limit guidelines for nail extensions are primarily determined by:',a:['Structural balance: extension length should not significantly exceed nail-bed length.','Lamp wattage available for curing.','The client’s maintenance budget.','The enhancement product used alone.'],c:0,r:'The C-curve/balance guideline keeps extension length in proportion to nail-bed length so leverage forces do not overwhelm the structure.'},
 {topic:'Safety and Sanitation',q:'The 16-section SDS format was standardized under:',a:['FDA food-safety labeling rules.','EPA toxic-substance controls.','OSHA’s GHS-aligned Hazard Communication Standard.','Individual state licensing rules alone.'],c:2,r:'OSHA aligned HazCom with the UN Globally Harmonized System, standardizing SDS documents into 16 sections.'},
 {topic:'Manicure and Pedicure Services',q:'Petrissage differs from effleurage in that petrissage:',a:['Involves deeper kneading and compressing of muscle tissue.','Uses rapid percussion with the sides of the hands.','Is performed only at the beginning and end.','Is only applied to the lower leg.'],c:0,r:'Effleurage uses superficial gliding strokes; petrissage involves deeper kneading, squeezing, and rolling of tissue.'}
];
*/
let index=0,answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id), letters=['A','B','C','D'];
function render(){const x=questions[index],chosen=answers[index],done=chosen!==null;$('topic').textContent=x.topic;$('question').textContent=x.q;$('counter').textContent=`${index+1} of ${questions.length}`;$('bar').style.width=`${((index+(done?1:0))/questions.length)*100}%`;$('answers').innerHTML=x.a.map((t,i)=>`<button class="answer ${done&&i===x.c?'correct':''} ${done&&i===chosen&&i!==x.c?'wrong':''}" data-i="${i}" ${done?'disabled':''}><span class="letter">${letters[i]}</span><span>${t}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>select(+b.dataset.i));const f=$('feedback');if(done){const correct=chosen===x.c;f.className=`feedback show ${correct?'good':'bad'}`;f.innerHTML=`<span class="feedback-title">${correct?'Correct · Rationale':`Incorrect · Correct Answer: ${letters[x.c]}`}</span>${x.r}`;}else{f.className='feedback';f.textContent=''}$('prev').disabled=index===0;$('next').disabled=!done;$('next').textContent=index===questions.length-1?'Finish →':'Next →';}
function select(i){answers[index]=i;render()}
$('prev').onclick=()=>{if(index){index--;render()}};$('next').onclick=()=>{if(answers[index]===null)return;if(index<questions.length-1){index++;render()}else finish()};
function finish(){const score=answers.reduce((n,a,i)=>n+(a===questions[i].c),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`${score}/${questions.length}`;$('summary').textContent=`You answered ${score} of ${questions.length} questions correctly.`}$('restart').onclick=()=>{index=0;answers=Array(questions.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script>
</body>
</html>
