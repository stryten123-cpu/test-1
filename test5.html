<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 5</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Manicure","q":"A French manicure uses:","a":["One opaque color across the entire nail.","Multiple colors in a gradient.","A natural-looking pink or nude base with a white tip at the free edge.","A glossy top coat over bare nails."],"c":2,"e":"A French manicure uses a sheer pink or nude base and white polish at the free edge."},{"t":"Nail Enhancements","q":"The proper ratio of monomer to powder in the working bead is described as:","a":["Variable based on the zone being applied.","As dry as possible for every zone.","As wet as possible for every zone.","Always precisely 1:1 by weight."],"c":0,"e":"The optimal consistency varies: wetter for extension areas, medium for the structural zone, and drier near the cuticle."},{"t":"Safety and Sanitation","q":"Used single-use items such as cotton, files, and orangewood sticks should be:","a":["Saved for the client's next visit.","Returned to supply storage after an alcohol wipe.","Sanitized for future services.","Discarded immediately in the appropriate waste container after the service."],"c":3,"e":"Single-use items are contaminated after use and cannot be reliably disinfected or reused."},{"t":"Nail Enhancements","q":"Porosity of the natural nail plate relevant to acrylic application means:","a":["The plate completely absorbs acrylic monomer.","The plate absorbs moisture like a sponge and needs soaking.","Keratin micro-channels allow dehydrator and primer to penetrate slightly, improving adhesion.","Surface pores must be sealed with base coat before primer."],"c":2,"e":"The nail plate’s micro-porosity permits slight penetration by dehydrator and primer, supporting adhesion."},{"t":"Pedicure","q":"Toenails should be cut or filed:","a":["Rounded to match the toe contour.","Straight across with gently rounded corners—not too short—to prevent ingrown toenails.","Pointed for optimal appearance.","From the free edge inward toward the base."],"c":1,"e":"Straight-across trimming with gently softened corners reduces the chance of ingrown toenails."},{"t":"Blood Spill / Safety","q":"Hepatitis B vaccination is recommended for nail technicians because:","a":["HBV is transmissible through blood contact and is preventable by vaccination.","HBV causes onychomycosis and spreads through shared files.","It also prevents HCV and HIV infection.","OSHA mandates it for every cosmetology worker."],"c":0,"e":"HBV is a genuine blood-contact risk, and vaccination provides effective protection."},{"t":"Nail Enhancements","q":"Over-filing of the natural nail during enhancement preparation can cause:","a":["Improved adhesion from a rougher surface.","Permanent thinning and weakening of the nail plate.","No harm because filing is always beneficial.","Stronger bonding through faster primer absorption."],"c":1,"e":"Over-filing permanently removes nail-plate layers, increasing weakness, flexibility, and sensitivity."},{"t":"Manicure / Nail Enhancements","q":"Residual gel polish from a previous service must be:","a":["Completely removed before the new service begins.","Removed only when more than half is chipped.","Filed smooth and covered with fresh gel.","Left on because fresh gel bonds directly to it."],"c":0,"e":"Old gel must be fully removed to avoid uneven thickness, poor adhesion, and lifting."},{"t":"Manicure / Safety","q":"The purpose of a nail-cleaner brush is:","a":["To apply nail primer evenly.","To spread acrylic powder.","To apply gel to small areas.","To clean debris from under the free edge and around the nail fold."],"c":3,"e":"A small stiff nail brush removes debris around the nail fold and beneath the free edge."},{"t":"Safety and Sanitation","q":"Disinfectant solution in a wet sanitizer jar must be changed:","a":["Once per week only.","When visibly dirty or according to manufacturer instructions.","Only when the jar becomes empty.","Monthly regardless of use."],"c":1,"e":"Change solution when visibly soiled and on the manufacturer’s schedule because contamination reduces efficacy."},{"t":"Nail Enhancements","q":"An acrylic nail that is too thin at the stress zone is at risk of:","a":["Stress fracture or breakage from inability to resist flexion.","Excessive heat during wear.","Yellowing from insufficient product depth.","Cuticle lifting from reduced adhesion surface."],"c":0,"e":"The stress zone bears the greatest flexion load and needs enough product depth for strength."},{"t":"Manicure","q":"Clients are advised to apply cuticle oil daily after a manicure because:","a":["It makes polish dry faster.","It maintains moisture and helps prevent brittleness.","It provides UV protection.","It prevents nail growth."],"c":1,"e":"Daily cuticle oil supports nail flexibility and conditions the surrounding skin."},{"t":"Safety and Sanitation","q":"Between clients, the nail technician should change the workstation cushion or pad cover:","a":["Only when visibly soiled.","Once per day.","After each client.","Only after pedicure services."],"c":2,"e":"Client-contact covers must be replaced with clean ones after every client to prevent cross-contamination."},{"t":"Safety and Sanitation","q":"The immune response triggered by vaccination is classified as:","a":["Natural passive immunity.","Artificial passive immunity.","Artificial active immunity.","Natural active immunity."],"c":2,"e":"Vaccines artificially introduce antigens, and the body actively forms antibodies and memory cells."},{"t":"Nail Enhancements","q":"The CIB-standard term for the dip nail system is:","a":["Powder dip.","SNS nails or dip nails.","Chrome powder system.","Acrylic dip system."],"c":0,"e":"The NIC CIB uses the standardized licensing-exam term “powder dip.”"},{"t":"Manicure","q":"A basic manicure includes all of the following EXCEPT:","a":["Cuticle care.","Hand massage.","Nail-tip extension with artificial product.","Nail shaping and filing."],"c":2,"e":"A nail-tip extension is an enhancement service, not a component of a basic manicure."},{"t":"Nail Enhancements","q":"Nail-tip adhesive is used to:","a":["Apply gel product to the nail plate.","Seal the free edge.","Disinfect the nail plate.","Bond the plastic nail tip to the natural nail plate."],"c":3,"e":"Nail-tip adhesive bonds a plastic tip to the prepared natural nail plate."},{"t":"Nail Enhancements","q":"Lifting at the proximal edge of an acrylic enhancement most commonly indicates:","a":["The acrylic powder was expired.","Product was applied too close to or touching the skin or cuticle.","Too little primer was applied.","The client did not use enough cuticle oil."],"c":1,"e":"Product touching skin or cuticle commonly causes proximal lifting as the nail grows and the skin moves."},{"t":"Safety and Sanitation","q":"A client with diabetes requires extra infection-control awareness because:","a":["Diabetes hides infection by increasing nail thickness.","Impaired circulation and immune response increase infection risk from minor skin breaks.","Diabetes accelerates nail growth.","Diabetic medication reacts with acrylic monomer."],"c":1,"e":"Diabetes may impair circulation and immune function, so minor injuries can become serious infections."},{"t":"Manicure","q":"What is the standard number of color coats in a manicure?","a":["One coat for sheer colors only.","Two thin coats.","One thick coat.","Three or more coats for all colors."],"c":1,"e":"Two thin color coats provide even coverage, good adhesion, and better wear than one thick coat."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
