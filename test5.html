<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 5</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 5</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Safety and Sanitation","q":"Which of the following actions is a mandatory requirement for nail technicians when serving clients?","a":["Trying to persuade the client to buy cosmetics","Cleaning and sanitizing hands before starting on a client","Performing a very long hand massage","Always using a metal file"],"c":1,"e":"Hand washing and sanitizing before every client is a basic infection-control requirement in every state board regulation."},
{"t":"Manicure","q":"The primary ingredient in nail bleach products is?","a":["Alcohol solution","Zinc oxide compound","6% Hydrogen Peroxide","Castor oil"],"c":2,"e":"Most nail bleaches use hydrogen peroxide (around 6%) as the active bleaching agent to lighten stains on the natural nail."},
{"t":"Safety and Sanitation","q":"Performing nail surface scrubbing and proper hand washing will help remove which factor?","a":["Remove contaminants/dirt","Remove oily layers on the nail","Remove germs and fungal spores","Remove all of the above factors"],"c":3,"e":"Thorough scrubbing and washing removes dirt, oils, and microorganisms that can interfere with adhesion or cause infection."},
{"t":"Pedicure / Safety","q":"What is the medical term used to refer to fungal infection of the feet?","a":["Blistering phenomenon","Horn scales on the nail","Tinea pedis (athlete's foot causing itching)","Pterygium"],"c":2,"e":"Tinea pedis is the clinical name for athlete's foot. Service should be refused and the client referred to a physician."},
{"t":"Safety and Sanitation","q":"When using Quaternary ammonium for effective disinfection, the most important requirement is?","a":["Must ensure long enough immersion time","Must use a concentration three times higher","Only needs to be immersed for a short time","Must be mixed with soap"],"c":0,"e":"Quats require full contact time (usually 10 minutes) to achieve proper disinfection. Short dips are not effective."},
{"t":"Safety and Sanitation","q":"To prepare 1 gallon of 1,000 p.p.m. Quats disinfectant solution from 15% Quats according to EPA standards, you need to use?","a":["Use 1 1/4 ounces of Quats solution","Use 1 ounce of Quats solution","Use 3/4 ounce of Quats solution","Use 1/2 ounce of Quats solution"],"c":2,"e":"Mixing ratios are critical. For 15% concentrate, 3/4 ounce per gallon yields the correct 1,000 ppm strength."},
{"t":"Manicure","q":"Which item is usually used to cover abnormal white spots on the nail?","a":["Nail whitener","Top coat","Cuticle conditioning oil","Antiseptic alcohol"],"c":0,"e":"Nail whitener (or nail bleach) is applied to camouflage or lighten white spots and stains on the natural nail plate."},
{"t":"Safety and Sanitation","q":"How often should the specialist change the disinfectant solution in the tool soaking tray?","a":["Once a week","Once a day or when the solution becomes contaminated","After every month","When the solution has completely evaporated"],"c":1,"e":"Disinfectant solutions lose effectiveness when contaminated with debris or organic material and should be changed daily or sooner if cloudy."},
{"t":"Nail Enhancements / Safety","q":"Air bubbles appearing under an artificial nail are usually a precursor to?","a":["Fungal growth","Stronger nail adhesion","Faster nail growth","Higher shine"],"c":0,"e":"Moisture trapped under lifting enhancements creates an ideal environment for bacterial or fungal growth. The enhancement should be removed."},
{"t":"Safety and Sanitation / Pedicure","q":"For clients suffering from diabetes, nail technicians need to take special care to?","a":["Not perform vigorous massage","Absolutely not scratch or cut into their skin","Use very hot soaking water","Not use cuticle nippers"],"c":1,"e":"Diabetic clients have reduced healing ability. Even a small cut can lead to serious infection, so extra caution is required."},
{"t":"Safety and Sanitation","q":"Installing an effective ventilation system in the salon is very important because nail chemicals can?","a":["Cause itching symptoms","Be a direct cause of infection","Penetrate through the skin surface","Enter the body through the respiratory tract"],"c":3,"e":"Many nail product vapors are inhaled. Proper ventilation protects both the technician and clients from respiratory exposure."},
{"t":"Safety and Sanitation","q":"The most common disinfection method currently applied in salons is?","a":["Using physical actions","Using moist heat and steam","Using specialized chemical solutions","Using automatic autoclave systems"],"c":2,"e":"Immersion in EPA-registered chemical disinfectants (quats, phenolics, etc.) is the standard method used in most nail salons."},
{"t":"Manicure","q":"A hangnail condition can be corrected by trimming the excess skin and softening the skin with?","a":["Using naphtha soap","Using cuticle oil","Using boric acid solution","Using nail polish remover"],"c":1,"e":"After carefully trimming a hangnail, cuticle oil is applied to soften and condition the surrounding skin and prevent recurrence."},
{"t":"Safety and Sanitation","q":"To ensure absolute safety, the specialist absolutely must not use a product if the container does not have?","a":["A very tight lid","A sign certifying it has been disinfected","Original full capacity","Clear label and product name"],"c":3,"e":"Unlabeled containers are a serious safety and regulatory violation. Every product must be clearly identified."},
{"t":"Nail Enhancements","q":"When decorating nails with metal leaf, the materials usually used are pieces of gold or silver that are?","a":["Extremely thin","Have a large thickness","Cast into blocks","In fiber form"],"c":0,"e":"Metal leaf is sold in extremely thin sheets so it can be applied smoothly and adhere to the nail surface."},
{"t":"Safety and Sanitation","q":"Which of the following activities is extremely dangerous when performed near areas containing nail chemicals?","a":["Idle gossip","Chewing gum","Speaking loudly","Smoking behavior"],"c":3,"e":"Many nail chemicals are flammable. Smoking near open products creates a serious fire and explosion hazard."},
{"t":"Safety and Sanitation","q":"Every solution bottle in the beauty salon must meet which requirement?","a":["Must be made from transparent glass material","Only need labeling when they contain toxic chemicals","Must be labeled according to the correct purpose of use","Labeled fully and accurately, regardless of the solution type"],"c":3,"e":"All containers must be clearly and accurately labeled so technicians and inspectors know exactly what is inside."},
{"t":"Safety and Sanitation","q":"When mixing 1 gallon of disinfectant, if using 10% Quats, the amount needed compared to 12.5% or 15% is?","a":["Less solution is needed","More solution is needed","The same amount is used","Exactly 70% of the previous amount"],"c":1,"e":"A lower-percentage concentrate requires a larger volume of product to reach the same final ppm strength."},
{"t":"Nail Enhancements","q":"To remove artificial nails safely for the natural nail, one should use?","a":["Nail nippers","A high-power electric grinder","Acetone solution to soften the material","Very hot soapy water"],"c":2,"e":"Soaking in acetone dissolves acrylic and most gels, allowing safe removal without force that could damage the natural nail."},
{"t":"Safety and Sanitation","q":"When a fingernail shows signs of serious infection, who is authorized to treat it?","a":["Nail technician","Specialized doctor","Pharmacist","General cosmetologist"],"c":1,"e":"Nail technicians are not licensed to diagnose or treat infections. Clients with infection must be referred to a physician."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
