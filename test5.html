<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 5</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 5</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Safety and Sanitation / Pedicure","q":"Tinea pedis is a contraindication to pedicure because:","a":["The alkaline footbath activates dormant fungal spores, causing them to bloom rapidly across the entire foot within minutes of soaking.","It is a contagious fungal infection spreading to other clients via basins and tools.","It causes pain preventing safe cuticle care.","The condition softens the toenail keratin so completely that files and nippers can no longer shape the plate into any lasting form."],"c":1,"e":"Tinea pedis is contagious — dermatophyte spreads through shared water and implements. Pedicure on an infected client risks transmitting infection to subsequent clients."},
{"t":"Safety and Sanitation","q":"Ventilation at the nail workstation should be arranged so that:","a":["A ceiling fan mounted directly above the station blows air down onto the nail surface, pushing settled monomer vapors back up into the breathing zone.","Source-capture ventilation draws vapors away from both the technician's and client's breathing zones at the nail surface.","Chemical vapors are allowed to disperse evenly through the whole salon so that no single station ever reaches a concentration high enough to need a capture device.","The client is seated facing directly into the ventilation intake so that all chemical vapors are drawn across the client's face first, away from the technician."],"c":1,"e":"Source-capture ventilation positioned at table level captures vapors at the point of generation — before they reach either person's breathing zone. Both technician and client are protected from chemical vapor exposure."},
{"t":"Pedicure / Safety and Sanitation","q":"Razors are prohibited for callus removal in most states because:","a":["Razors cannot achieve effective callus removal, since the thin blade only skips across hardened plantar skin without ever reducing the built-up dead tissue.","They require a separate advanced pedicure endorsement that must be renewed each year through a hands-on blade-safety practical examination.","They are far too costly for routine salon use, since each single-use surgical blade must be individually autoclaved and certified before every callus service.","Razors can cut too deeply creating open wounds — only licensed medical professionals may use blades on skin."],"c":3,"e":"Razor blades for callus removal can cut into living tissue, creating open wounds with high infection risk. Mechanical abrasion is the safe professional alternative."},
{"t":"Nail Enhancements","q":"A gel nail enhancement's durability is most affected by:","a":["The temperature of the UV lamp, since a hotter bulb cures a tougher layer.","The quality of the nail plate preparation before application.","The brand of gel, since premium brands cure cooler and set much harder.","The color of the gel used, since darker pigments cure into a harder film."],"c":1,"e":"Product quality aside, nail plate preparation is the single most influential factor in gel enhancement durability. Even the best products fail on improperly dehydrated, oily, or over-buffed nail plates."},
{"t":"Safety and Sanitation","q":"Contact time in disinfection means:","a":["Period a mixed solution remains effective.","Time a disinfectant product takes to dry after application, once the wet film evaporates.","Total service time a client spends in the salon, from check-in until the last tool is disinfected.","Minimum time an implement must stay in disinfectant to achieve stated efficacy."],"c":3,"e":"Contact time is the minimum exposure duration needed to kill specified organisms per the product's label. Removing implements before this time means disinfection is incomplete."},
{"t":"Safety and Sanitation","q":"Tweezers used in nail art services must be:","a":["Cleaned and disinfected as multi-use metal implements between clients.","Autoclaved weekly to maintain sterility.","Sanitized with hand sanitizer between clients, which is enough for metal tools.","Single-use items discarded after each client, since their hinges trap unreachable debris."],"c":0,"e":"Metal tweezers are non-porous multi-use implements that can be cleaned and disinfected with EPA-registered disinfectants for multi-client use."},
{"t":"Manicure","q":"The correct nail polish application sequence is:","a":["Base coat, color coat, top coat.","Base coat, then top coat, then color coat.","Color coat, base coat, top coat for richer color.","Top coat, color coat, base coat."],"c":0,"e":"The sequence: base coat (adhesion, prevents staining), color coat (one or two thin coats), top coat (seal, shine, chip resistance). Each layer partially sets before the next."},
{"t":"Nail Enhancements","q":"Ethyl methacrylate (EMA) is the professional standard monomer because:","a":["EMA has a lower sensitization rate, is flexible, and is approved for professional nail use.","EMA is completely odorless, removing the need for any salon ventilation even in enclosed treatment rooms.","EMA produces a far harder, more rigid enhancement than MMA and bonds so aggressively that no primer is ever needed on the natural plate.","EMA is chemically interchangeable with MMA at the same concentration and mixing ratio, so the two monomers can be blended together in one dappen dish."],"c":0,"e":"EMA offers a better safety profile: lower allergic sensitization rate, flexibility that reduces nail trauma, and professional industry/regulatory acceptance. It still requires ventilation but is safer than MMA."},
{"t":"Nail Enhancements","q":"Yellowing of acrylic nails can be caused by:","a":["Using a darker tinted base coat under the acrylic, whose pigment leaches upward through the polymer over several weeks and stains the surface yellow.","Normal aging of the PMMA polymer, which oxidizes and turns every acrylic set uniformly yellow within roughly two weeks of application.","UV exposure, chemical contact (cleaners, solvents), certain medications, and some nail polish pigment transfer.","Excessive filing during maintenance appointments, where friction heat scorches the surface and bakes a permanent yellow discoloration into the product."],"c":2,"e":"Acrylic yellowing causes: UV light oxidation, exposure to household chemicals/bleach, certain medications (tetracycline, antimalarials), and dark nail polish pigments migrating into the acrylic. UV-protective top coats reduce photo-yellowing."},
{"t":"Safety and Sanitation","q":"Bacterial spores are especially resistant to infection control because:","a":["They are produced only by the fungi that cause athlete's foot, whose thick outer walls also shrug off the heat of ordinary salon sanitizers.","They are the infectious airborne form of all viruses, released when a viral coat hardens into a shell that shrugs off salon disinfectants.","They cannot survive outside a living host, yet the brief gap between clients is long enough for them to re-enter the skin and reactivate.","They are dormant structures surviving many disinfectants that kill active bacteria."],"c":3,"e":"Bacterial spores (e.g., Clostridium species) are dormant and highly resistant to disinfectants. Sterilization is required to destroy them. Standard disinfectants kill active (vegetative) bacteria."},
{"t":"Manicure","q":"A top coat is applied to:","a":["Condition and rehydrate the nail plate with oils after the color coat is applied.","Provide the primary nail color and full pigment coverage, taking the place of a separate color coat underneath it.","Seal the color coat, add shine, and provide a chip-resistant finish.","Enhance adhesion between the natural nail and the polish by etching the plate so the color coat grips more tightly beneath."],"c":2,"e":"Top coat is the finishing protective layer: seals the color, adds gloss, hardens the surface against chips, and may include UV inhibitors to prevent color fading."},
{"t":"Nail Enhancements","q":"Acrylic nail enhancements should be soaked for removal by:","a":["Filing the top surface of the enhancement to break the seal, then soaking with acetone-saturated cotton wrapped in foil.","Immersing the nails directly in warm acetone with no surface filing first, since unbuffed acrylic dissolves faster when its glossy sealed top layer stays intact.","Prying the enhancement up gently from the free edge with an orangewood stick, rocking it loose section by section until the whole acrylic shell lifts off.","Filing the entire enhancement off down to the bare plate with a coarse abrasive and no acetone at all, the fastest and gentlest removal for the natural nail."],"c":0,"e":"Acrylic removal: file the shine from the top surface (acetone penetrates faster through filed surface), wrap with acetone-soaked cotton under foil, soak 15–20 minutes until soft, then gently push off remaining product. Never pry."},
{"t":"Safety and Sanitation / Blood Spill","q":"A client asks whether HIV transmission is possible during a nail service. The nail technician should explain:","a":["HIV requires direct blood-to-blood or mucous membrane contact to spread.","HIV transmission is the reason latex gloves are required for all services.","HIV cannot survive outside the body so nail salons pose no risk at all.","HIV is transmitted through the air so any service carries risk."],"c":0,"e":"HIV requires specific blood-to-blood or mucous membrane contact. Standard precautions (gloves, single-use items, disinfection) effectively prevent transmission. Neither alarmism nor dismissiveness is appropriate."},
{"t":"Nail Enhancements","q":"Shrinkage during acrylic polymerization can cause:","a":["Enhanced adhesion as the product contracts onto the nail surface, sealing the edges against lifting.","No functional issues.","The enhancement to become more flexible after curing.","Lifting at the nail plate interface as the product pulls away from the nail during curing."],"c":3,"e":"All acrylic polymers shrink slightly as polymerization occurs. This shrinkage can cause lifting at the cuticle or lateral walls if the product was applied too thickly or the nail was not properly prepared."},
{"t":"Safety and Sanitation","q":"The skin and nail analysis during consultation serves to:","a":["Record the client's natural nail color for the service record.","Determine which nail shape the client prefers.","Identify contraindications, serviceable vs non-serviceable conditions, product factors.","Assess whether the client's nails are long enough for enhancement application."],"c":2,"e":"Skin and nail analysis identifies: non-serviceable conditions requiring referral, factors affecting adhesion (oiliness, porosity), skin conditions affecting massage, and overall nail health status."},
{"t":"Safety and Sanitation","q":"A buffer block is:","a":["A metal tool requiring weekly sterilization in the salon autoclave.","A porous single-use implement discarded after each client.","A semi-disposable item disinfected with UV light between clients.","A reusable implement disinfected between clients like a metal pusher."],"c":1,"e":"Buffer blocks are porous foam or fiber — they cannot be reliably disinfected. Single-use per client. After use, they should be discarded or assigned exclusively to that client's personal use."},
{"t":"Safety and Sanitation","q":"A sanitary nail service workstation is characterized by:","a":["Clean surfaces, covered implements, and no cross-contamination.","Maximizing product display for marketing purposes.","Being shared with multiple technicians simultaneously.","Having the most products visible for client selection."],"c":0,"e":"A sanitary workstation: clean disinfected surfaces, implements in labeled covered containers (clean vs soiled separated), products properly labeled and capped, single-use items at hand, and waste containers in place."},
{"t":"Manicure","q":"A French manicure uses:","a":["One single opaque color painted evenly across the entire surface of the nail.","Multiple colors in a gradient.","A natural-looking pink or nude base with a white tip at the free edge.","Glossy top coat over bare natural nails."],"c":2,"e":"A French manicure uses a sheer pink or nude base on the entire nail and white polish on the free edge — mimicking the look of a natural, healthy nail."},
{"t":"Nail Enhancements","q":"The proper ratio of monomer to powder in the working bead is described as:","a":["Variable based on the zone being applied.","As dry as possible to minimize odor and sensitization risk.","As wet as possible for maximum plasticity during application.","Always precisely 1:1 by weight for all applications."],"c":0,"e":"Optimal ratio varies by application zone: wet beads for extension areas (more workable), medium-wet for the structural zone 2 (strongest cure), and dry beads for the cuticle zone 3 (precise, quick-setting). No single ratio suits all zones."},
{"t":"Safety and Sanitation","q":"Used single-use items (cotton, files, orangewood sticks) from a nail service should be:","a":["Saved for the client's next visit, since reusing personal items carries no contamination risk.","Returned to the supply storage area for future single-use items after a quick alcohol wipe.","Sanitized for potential reuse in future services.","Discarded immediately in the appropriate waste container after the service."],"c":3,"e":"Single-use items are discarded immediately after service — they are contaminated and cannot be reused. Prompt disposal prevents contaminated items from accumulating at the workstation."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
