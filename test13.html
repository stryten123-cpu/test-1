<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 13</title>
<style>
:root{--ink:#241815;--muted:#766b66;--paper:#fbf7f4;--card:#fff;--line:#e7ddd7;--rose:#bf214d;--pink:#f8dce4;--green:#587654;--greenbg:#edf3ec;--red:#c81e4b;--redbg:#fff0f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{border-bottom:1px solid var(--line);background:#fff;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between}.brand{font:700 24px Georgia,serif}.brand b{display:inline-grid;place-items:center;background:var(--rose);color:#fff;border-radius:7px;width:30px;height:30px;margin-right:10px}.wrap{max-width:1040px;margin:36px auto;padding:0 18px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-size:12px;font-weight:700}.title{font:700 clamp(34px,5vw,54px)/1.05 Georgia,serif;margin:10px 0 8px}.subtitle{color:var(--muted);margin-bottom:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,42px);box-shadow:0 8px 30px #3d241208}.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.tag{background:var(--pink);color:#8f1233;padding:8px 14px;border-radius:999px}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,serif;margin:0 0 24px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fcf8f6;border-radius:15px;padding:17px 20px;font-size:17px;cursor:pointer;display:flex;gap:14px;align-items:center}.choice:hover{border-color:#c9aaa2}.letter{flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:700}.choice.correct{background:var(--greenbg);border-color:var(--green)}.choice.correct .letter{background:var(--green);color:#fff}.choice.wrong{background:var(--redbg);border-color:var(--red)}.choice.wrong .letter{background:var(--red);color:#fff}.choice:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:18px;padding:20px 22px;border-left:3px solid var(--green);background:#f6f8f5;border-radius:14px;line-height:1.5}.feedback.bad{border-color:var(--red);background:#fff7f9}.feedback h3{margin:0 0 8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 22px;font-weight:700;cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}.progress{font-size:12px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.result{text-align:center;padding:20px 0}.score{font:700 70px Georgia,serif;color:var(--rose);margin:15px 0}.hidden{display:none}@media(max-width:650px){.top{padding:14px 18px}.nav{flex-wrap:wrap}.progress{order:-1;width:100%;text-align:center}.choice{font-size:15px;padding:14px}}
</style>
</head><body>
<header class="top"><div class="brand"><b>N</b>NailPrep</div><div>Practice Test 13</div></header>
<main class="wrap"><div class="eyebrow">Nail Technology • 20 Questions</div><h1 class="title">Practice Test 13</h1><div class="subtitle">Select an answer for immediate feedback. Use Previous and Next to review the test.</div>
<section class="card" id="quiz"><div class="meta"><span id="counter"></span><span class="tag" id="category"></span></div><h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback"><h3 id="feedbackTitle"></h3><div id="rationale"></div></div><div class="nav"><button class="btn" id="prev">← Previous</button><span class="progress" id="progress"></span><button class="btn primary" id="next">Next →</button></div></section>
<section class="card hidden" id="results"><div class="result"><div class="eyebrow">Test complete</div><h2 class="title">Your score</h2><div class="score" id="score"></div><p id="scoreText"></p><button class="btn primary" id="restart">Restart test</button></div></section></main>
<script>
const qs=[
['Safety and Sanitation','Phenolic disinfectants are described as broad-spectrum because they are effective against:',['Bacterial spores only, and no other class of microbe.','Only non-enveloped viruses and nothing else.','Bacteria, fungi, and some viruses.','Gram-positive bacteria exclusively.'],2,'Phenols are broad-spectrum intermediate-level disinfectants. They require ventilation and gloves because of their toxicity.'],
['Nail Enhancements','The dipping container used for powder dip services must be:',['Reused without decontamination because powder is self-sanitizing.','Heated to 140°F between clients to sterilize.','Replaced daily regardless of use.','Kept covered when not in use to prevent cross-contamination.'],3,'Keep powder sealed when not in use. Dispense an individual portion for each client and never allow shared dipping.'],
['Pedicure','The lower-leg massage during a pedicure covers:',['Knee to ankle.','Ankle to midfoot only.','From the hip down to the ankle.','From the knee up to the hip joint.'],0,'Pedicure massage covers the lower leg from just below the knee to the ankle, as well as the foot.'],
['Nail Enhancements','Nail extension length should be matched to:',['The current fashion trend only.','Client lifestyle, natural nail strength, and structural balance.','The client’s dominant hand preference.','The length the technician can apply most easily.'],1,'Length depends on activity level, nail-plate strength, and maintaining a properly balanced apex and C-curve.'],
['Safety and Sanitation','The hepatitis B vaccine is recommended for nail technicians primarily because:',['State boards require it for licensure.','HBV causes onychomycosis.','Vaccination also prevents HCV and HIV.','HBV can survive on surfaces for up to 7 days and is transmissible through blood contact.'],3,'Blood contact during nail services creates an exposure risk, and HBV can remain infectious on surfaces for days.'],
['Pedicure','Petrissage performed on the calf during a pedicure primarily:',['Pushes product deeper into the nail plate.','Begins before effleurage to cool the tissue.','Kneads the calf to ease tension and increase local circulation.','Stimulates only superficial nerve endings.'],2,'Petrissage is a kneading movement used to relax muscle tension and encourage circulation.'],
['Nail Enhancements','Powder dip removal uses:',['Water soaking.','UV neutralization.','Filing only because acetone is ineffective.','Acetone soaking because cyanoacrylate dip dissolves in acetone.'],3,'Acetone softens the cyanoacrylate-based dip product so it can be removed gently.'],
['Safety and Sanitation','An N95 mask during nail filing services protects against:',['Client allergies affecting the technician.','State-board rules mandating masks.','Chemical vapors from liquid products.','Airborne particulates such as nail dust.'],3,'N95 respirators filter airborne particles, including nail dust, but do not protect against chemical vapors.'],
['Pedicure','Buffing toenails to a shine during a pedicure uses:',['An electric file at its lowest speed.','A fine-grit, multi-directional buffer.','A chamois buffer applied with oil.','A coarse-grit file for quick smoothing.'],1,'Progressively finer grits smooth ridges and polish the nail surface to a natural shine.'],
['Nail Enhancements','The chemical process that hardens acrylic nails is called:',['Oxidation.','Photopolymerization requiring UV/LED.','Crystallization.','Polymerization by a free-radical reaction initiated from the powder.'],3,'The initiator in acrylic powder generates free radicals that start monomer chain reactions and form solid polymer.'],
['Safety and Sanitation','Which implement requires single-use handling because it cannot be reliably disinfected?',['A stainless-steel nail nipper.','An orangewood stick used for cuticle work.','A metal cuticle pusher.','A stainless-steel nail clipper.'],1,'Orangewood is porous and cannot be reliably disinfected. Nonporous metal implements can be cleaned and disinfected.'],
['Nail Enhancements','After tip-and-overlay application, the nail is shaped using:',['Files: coarse to shape, medium to refine, and fine to smooth.','Only a fine-grit buffer.','UV gel cured soft so it can be carved.','Wet adhesive while molding the tip by hand.'],0,'Progressive grits remove bulk, refine the contour, and smooth the finished surface while preserving the apex and C-curve.'],
['Manicure','Shellac-type gel polish is described as a hybrid because:',['It applies as polish but removes like gel.','It combines conventional-polish application with gel UV/LED curing.','It requires both UV and LED lamps.','It combines acrylic and gel chemistry.'],1,'It brushes on in thin layers like traditional polish but polymerizes under UV/LED light like gel.'],
['Safety and Sanitation','Safe use of a UV/LED nail lamp requires the technician to:',['Have the client sign a radiation waiver.','Avoid direct viewing and minimize unnecessary skin and eye exposure.','Replace the lamp annually regardless of condition.','Use a lead-lined cabinet.'],1,'Avoid staring into curing lights, follow manufacturer directions, and limit unnecessary exposure of skin and eyes.'],
['Nail Enhancements','Cross-contamination risk specific to powder dip services comes from:',['Applying activator directly to the powder jar.','Clients dipping fingers into a shared powder container.','Activator heat activating pathogens.','The base-coat brush touching the cuticle.'],1,'Shared dipping containers can transfer organisms. Use individual client portions and never return used powder to the jar.'],
['Pedicure','After a pedicure, standard home-care advice includes:',['Apply foot cream once per week only.','Soak feet in warm water daily.','Trim deeply into nail corners each week.','Apply moisturizer daily, protect feet during wet work, and return every 3–4 weeks.'],3,'Daily moisturizing, protection from prolonged wet exposure, and regular maintenance help preserve results.'],
['Nail Enhancements','When a nail tip separates from the natural nail plate during service, the technician should:',['Wait 24 hours for it to reset.','Apply overlay over the gap.','Re-glue it with extra adhesive.','Remove it, inspect the natural nail, prepare properly, and apply a new tip.'],3,'Separation signals adhesion failure. Remove the tip, identify damage or contamination, prepare correctly, and replace it.'],
['Blood Spill','Post-exposure protocol after a needle-stick or cut involves:',['Washing with soap and water, reporting the exposure, and following the post-exposure plan.','Applying a bandage and continuing service.','Putting implement disinfectant in the wound.','Stopping all work for 24 hours.'],0,'Immediately wash the site, report the incident, and follow the exposure-control plan, including medical evaluation when indicated.'],
['Pedicure','A waterless pedicure format:',['Is reserved for active fungal infections.','Is prohibited because it skips soaking.','Requires no cuticle care.','Uses sprays, gels, or foams instead of water soaking.'],3,'Waterless pedicures use product-based softening rather than a basin soak.'],
['Nail Enhancements','Forms used for sculpted nail services are placed:',['Over the top of the natural nail.','At the side of the nail.','On an existing enhancement during a fill.','Under the free edge of the natural nail to provide a scaffold for the extension.'],3,'A form slides under the free edge, follows the nail’s natural line, and provides the surface on which the extension is sculpted.']
];
let i=0,answers=Array(qs.length).fill(null);const $=id=>document.getElementById(id);
function render(){const q=qs[i];$('counter').textContent=`Question ${i+1} of ${qs.length}`;$('category').textContent=q[0];$('question').textContent=q[1];$('choices').innerHTML='';q[2].forEach((x,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="letter">${'ABCD'[n]}</span><span>${x}</span>`;b.onclick=()=>answer(n);if(answers[i]!=null){b.disabled=true;if(n===q[3])b.classList.add('correct');if(n===answers[i]&&n!==q[3])b.classList.add('wrong')} $('choices').appendChild(b)});const answered=answers[i]!=null;$('feedback').style.display=answered?'block':'none';if(answered){const ok=answers[i]===q[3];$('feedback').className='feedback'+(ok?'':' bad');$('feedbackTitle').textContent=ok?'Correct · Rationale':`Incorrect · Correct answer: ${'ABCD'[q[3]]}`;$('rationale').textContent=q[4]}$('prev').disabled=i===0;$('next').disabled=!answered;$('next').textContent=i===qs.length-1?'View score →':'Next →';$('progress').textContent=`${answers.filter(x=>x!==null).length} answered`}
function answer(n){if(answers[i]!=null)return;answers[i]=n;render()}
$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};
function finish(){const n=answers.reduce((s,a,j)=>s+(a===qs[j][3]),0);$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`${n}/${qs.length}`;$('scoreText').textContent=`You answered ${n} of ${qs.length} questions correctly (${Math.round(n/qs.length*100)}%).`}
$('restart').onclick=()=>{i=0;answers=Array(qs.length).fill(null);$('results').classList.add('hidden');$('quiz').classList.remove('hidden');render();scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
