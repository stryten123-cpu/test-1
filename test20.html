<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 20</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 20</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Manicure","q":"Ethyl acetate in non-acetone nail polish remover is effective because:","a":["It is an enzyme that digests the protein bonds in the polish film, breaking the lacquer into soluble bits.","It physically abrades the polish layer off the nail surface through a fine grit suspended in the liquid.","It is a solvent that dissolves the film-forming polymers (nitrocellulose) in nail lacquer.","It is a strong alkali that neutralizes and breaks apart the acidic resins holding the lacquer film together."],"c":2,"e":"Ethyl acetate is a solvent that dissolves nitrocellulose and other film-forming agents in nail polish. It is gentler than acetone, more pleasant-smelling, but requires more product and effort to fully remove lacquer."},
{"t":"Nail Enhancements","q":"After enhancement removal, the nail plate should be treated with:","a":["Another full layer of enhancement product right away, since re-coating the thinned plate immediately is what rebuilds its lost strength.","Cuticle oil and a strengthening base coat or nail strengthener — allowing the natural nail to rehydrate and recover.","A second acetone soak applied right after removal to strip off remaining product residue and reopen the plate surface for the next set.","Heavy filing across the whole plate with a coarse grit to grind off the roughened top layer and leave a smooth, even surface behind."],"c":1,"e":"Post-removal care: apply cuticle oil (rehydrates the dehydrated plate), allow recovery time before immediate re-application, and use a strengthening product if the plate shows thinning. The natural nail needs recovery time between enhancement cycles."},
{"t":"Safety and Sanitation","q":"NIOSH-approved respirators for chemical vapor protection in nail salons must contain:","a":["Organic vapor cartridges appropriate for the specific chemicals present.","Activated charcoal inserts swapped once a year, as the carbon keeps adsorbing vapor for months.","Standard pleated-paper dust filters, the same media used for filing dust, trapping the vapors.","N95 particulate filter cartridges that block all chemical vapor hazards in the salon."],"c":0,"e":"N95 filters capture particulates (dust), not vapors. Vapors require organic vapor cartridges matched to the specific chemicals. Cartridges must be replaced per manufacturer schedule — not annually regardless."},
{"t":"Nail Enhancements","q":"Nail wraps as add-on involve:","a":["Wrapping each nail in aluminum foil for enhancement removal only, since the term 'nail wrap' refers strictly to the acetone-soak foil packet.","Applying a peel-off protective plastic film over finished nail art, a temporary laminate that shields the design and is removed before the client leaves.","Wrapping the entire hand and each nail in warm paraffin so the wax coating hardens into a reinforcing shell that strengthens the nails as it cools.","Applying a thin fabric such as silk, fiberglass, or linen over the nail and bonding it with adhesive to repair or strengthen it."],"c":3,"e":"Nail wraps use thin fabric adhered to the nail plate with resin or adhesive. They reinforce cracked or weak nails, repair breaks, and add overlay strength."},
{"t":"Nail Enhancements","q":"Hard gel must be filed for removal because:","a":["State boards prohibit acetone for hard gel, whose fumes react with the resin.","Hard gel dissolves in water rather than acetone.","Its dense cross-linked polymer network prevents acetone penetration.","Filing is faster than soaking for every gel type, so all removal is done by hand."],"c":2,"e":"Hard gel's dense cross-linking creates a solvent-resistant network acetone cannot penetrate. Mechanical filing is the only effective removal method."},
{"t":"Safety and Sanitation","q":"Persistent headaches and nausea in nail technicians after their shifts indicate:","a":["Inadequate ventilation with chemical vapors exceeding safe concentrations.","An allergic reaction to nail polish pigments absorbed through the skin during application.","Work stress rather than chemical exposure.","A normal adjustment to chemical odors that new technicians experience in the work environment."],"c":0,"e":"Recurring post-shift headaches and nausea are classic overexposure symptoms. They indicate chemical vapor concentrations are excessive — a ventilation assessment is required."},
{"t":"Manicure","q":"A client complains that cuticle remover 'burned' when applied to the surrounding skin. This occurred because:","a":["The client is allergic to the active ingredient in every cuticle remover, so none can be used.","Cuticle remover's alkaline pH (8–9) disrupts the acid mantle and irritates living skin.","The technician applied cuticle remover at too low a temperature.","The cuticle remover was contaminated with a pathogen."],"c":1,"e":"Cuticle remover's alkaline pH disrupts the acid mantle and irritates living skin tissue. It is designed for dead cuticle tissue on the nail plate, not for the surrounding living skin. Precise application is required."},
{"t":"Safety and Sanitation / Manicure","q":"A contraindication to paraffin treatment during a manicure is:","a":["Mild dryness of the hands, since the heat of paraffin only makes already dry skin worse.","Client preference for a different finishing treatment, like choosing a mask over paraffin.","Any previous pedicure service on the same day.","Open wounds, broken skin, rash, or poor circulation in the treatment area."],"c":3,"e":"Paraffin is contraindicated for open wounds/broken skin (heat on broken skin causes pain and infection risk), rashes (heat worsens inflammation), and poor circulation (impaired ability to dissipate heat risks burns)."},
{"t":"Manicure","q":"Top coat in a nail polish service:","a":["Seals the color layer, adds shine, and provides chip resistance.","Contains the keratin proteins that strengthen and rebuild the natural nail plate.","Is applied before color as a primer equivalent to grip the bare plate.","Provides the primary adhesion layer that bonds the color coat to the bare nail plate."],"c":0,"e":"Top coat is the final layer: it seals the color coat, adds shine, protects against chips and UV fading, and extends the wear time of the polish."},
{"t":"Safety and Sanitation","q":"Supplies replenished during or between services must be taken from:","a":["Any container in the storage area without checking labels, since salon stock is shared.","Bulk open containers shared across several service stations without any covers.","The client's personal product bag if available.","Original product containers with properly functioning dispensing systems."],"c":3,"e":"Products must be dispensed from original containers with pumps or dispensers — never dipping used implements or fingers directly into product containers (contamination). Bulk shared containers without covers risk cross-contamination."},
{"t":"Pedicure","q":"Massage oil applied during pedicure service should be:","a":["Replaced with dry massage technique to prevent nail plate contamination.","Only applied to the foot.","Applied generously for maximum moisturizing effect.","Enough for smooth massage; excess removed from nail plates before polish."],"c":3,"e":"Massage oil facilitates smooth technique. Enough is applied for glide; excess is removed from nail plates before polish to prevent adhesion failure."},
{"t":"Nail Enhancements","q":"A crack from the free edge toward the apex of a gel enhancement requires:","a":["Removing the enhancement from that nail and rebuilding.","Filing the crack smooth and applying top coat.","Applying gel top coat over the crack in order to seal and stabilize it.","Soaking in acetone for two minutes, then reshaping the softened gel."],"c":0,"e":"A structural crack through the enhancement indicates load-bearing failure. Cosmetic sealing with top coat temporarily hides but does not repair the failure. Full removal and rebuild required."},
{"t":"Safety and Sanitation","q":"The nail technician's handwashing after removing gloves at the end of a service is necessary because:","a":["Gloves fully eliminate the need for handwashing, the nitrile blocking every organism from the hands.","It is required between every service regardless of glove use, mainly to warm the hands first.","Microscopic pores or unnoticed tears in gloves may have allowed organism transfer.","It cleans the glove exterior residue from hands."],"c":2,"e":"Post-service handwashing even after gloves: microscopic pores, pinhole tears, or improper removal technique can transfer organisms to hands. Handwashing provides a second layer of protection beyond glove use."},
{"t":"Nail Enhancements","q":"The electric file is used in enhancement removal to:","a":["Apply heat to soften the enhancement before chemical removal.","File the bulk down to a thin layer before removal, reducing acetone soak time.","Create a rough surface for the new enhancement to adhere to during fill.","Replace acetone soaking entirely."],"c":1,"e":"Electric file in removal: for hard gel, removes bulk by filing before hand finishing. For acrylic, filing the top surface with an electric file breaks the seal, allowing acetone faster penetration and reducing soak time."},
{"t":"Manicure / Nail Enhancements","q":"Chrome powder nail finish is applied:","a":["Over a specific cured gel color, rubbed into the tacky inhibition layer before top coat.","Over the top coat as final step.","Under base coat for depth.","Mixed directly into the gel before brushing, so the pigment spreads through the layer."],"c":0,"e":"Chrome powder application: apply over a specific cured gel color without cleansing the inhibition layer (tackiness helps adhesion), rub in with a silicone applicator, seal with no-wipe top coat."},
{"t":"Safety and Sanitation","q":"Low-level disinfection is appropriate for:","a":["Multi-use implements contacting intact skin during nail services.","Non-critical surfaces like countertops, not in direct client contact.","Implements penetrating skin or contacting mucous membranes.","Any implement used on clients with known immunosuppression."],"c":1,"e":"Per Spaulding classification, low-level disinfection is appropriate for non-critical environmental surfaces. Multi-use implements contacting intact skin require intermediate-level (typically tuberculocidal) disinfection in most state boards."},
{"t":"Nail Enhancements","q":"The reason monomer liquid has a strong odor in nail salons is:","a":["Volatile EMA (ethyl methacrylate) evaporating readily at room temperature.","The pigments in the polymer powder releasing aromatic compounds.","The benzoyl peroxide catalyst producing sulfur compounds during polymerization.","UV light breaking down cross-linkers into small, odor-producing fragments during curing."],"c":0,"e":"EMA is a volatile liquid that evaporates at room temperature, producing airborne vapor with a characteristic pungent odor. This vapor represents inhalation exposure — the primary reason source-capture ventilation is required at acrylic stations."},
{"t":"Nail Enhancements","q":"The C-curve of a gel nail enhancement provides structural rigidity by:","a":["Reducing the surface area exposed to impact forces.","Creating a cross-sectional arch that distributes mechanical loads across the nail width.","Directing mechanical stress toward the free edge and away from the nail plate attachment point.","Increasing product thickness at the center of the nail."],"c":1,"e":"The C-curve arch distributes lateral bending forces across the nail width. Without a proper C-curve, flat gel nails cannot resist lateral flexion — they crack from concentrated stress."},
{"t":"Manicure / Pedicure","q":"Thermal warm towel treatments differ from paraffin in that warm towels:","a":["Are more therapeutic for arthritic joints.","Provide deeper moisturization than paraffin as fibers push lotion in.","Last longer in maintaining heat.","Provide moist heat — warm towels also gently cleanse the skin surface."],"c":3,"e":"Warm towels provide moist heat — moisture helps product absorption and gently cleanses the skin. Paraffin provides insulated dry heat. Both increase circulation through different mechanisms."},
{"t":"Manicure","q":"The purpose of a nail strengthener/ridge filler is:","a":["To initiate curing of gel products on ridged nail plates.","To replace primer in gel enhancement systems.","To fill surface ridges and strengthen the nail as a base coat.","To provide adhesion for nail tips."],"c":2,"e":"Ridge fillers are thickened base coat formulations that fill longitudinal ridges, creating a smooth surface for polish and providing some strengthening effect."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
