<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 12</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Nail Enhancements","q":"Powder dip product thickness is controlled by:","a":["The length of time the nail remains in the powder.","The number of dip-and-activator cycles repeated.","The temperature of the activator.","The grit of the finishing file."],"c":1,"e":"Each dip-and-activator cycle adds another cured layer, increasing thickness and strength."},
{"t":"Nail Enhancements","q":"Gel nail extensions are typically stronger than gel polish in terms of:","a":["Color saturation and shine.","Structural integrity — thicker and cross-linked.","Removal speed and flexibility.","Resistance to every type of solvent."],"c":1,"e":"Builder gel creates structural thickness and an arch, while gel polish is only a thin decorative coating."},
{"t":"Pedicure","q":"Essential oils added to a pedicure soak:","a":["Sterilize the foot basin during the service.","Replace all required cleaning procedures.","Kill every type of infectious organism.","Give aromatherapy benefits but don't replace EPA-registered disinfection."],"c":3,"e":"Essential oils may provide fragrance and conditioning benefits, but they do not disinfect the basin."},
{"t":"Safety and Sanitation","q":"An ultrasonic cleaner in implement decontamination serves as:","a":["A sanitization device reducing but not eliminating pathogens.","Pre-cleaning that removes debris with sound waves before disinfection.","A sterilization method equivalent to an autoclave.","The final disinfection step replacing chemical immersion."],"c":1,"e":"Ultrasonic cleaners loosen debris, especially from hinged implements, but chemical disinfection must follow."},
{"t":"Nail Enhancements","q":"Gel enhancements can be refreshed without full removal by:","a":["Lightly file the surface (180–220 grit), cleanse, and apply gel over the cured base.","Soak in acetone for five minutes and apply new gel.","Apply new gel directly over the existing enhancement without preparation.","File the entire enhancement to the bare nail before refreshing."],"c":0,"e":"Light filing removes shine and creates texture so fresh gel can adhere to the existing cured structure."},
{"t":"Pedicure","q":"The pedicure massage sequence follows:","a":["Deep tissue first, then lighter strokes.","Tapotement first, then deeper kneading.","Only effleurage.","Effleurage → petrissage → friction → tapotement → effleurage."],"c":3,"e":"The sequence warms, kneads, applies deeper friction, stimulates, and then closes with soothing strokes."},
{"t":"Safety and Sanitation","q":"EMA (ethyl methacrylate) is preferred over MMA because:","a":["EMA has lower sensitization risk and is flexible enough to prevent nail damage.","EMA produces no odor and requires no ventilation.","EMA bonds without any nail-plate preparation.","EMA is the only EPA-approved monomer."],"c":0,"e":"EMA has a safer professional-use profile and greater flexibility than MMA, although ventilation is still required."},
{"t":"Nail Enhancements","q":"Acrylic nails are a two-component system because:","a":["A liquid monomer (EMA) and powder polymer (PMMA) are combined.","A gel base and acrylic powder are mixed.","Two primers are applied sequentially.","They cure under two separate UV lamps."],"c":0,"e":"Combining liquid monomer and polymer powder begins the chemical reaction that hardens acrylic without UV light."},
{"t":"Manicure","q":"An exfoliating scrub as a manicure add-on:","a":["Replaces the soaking step in an express service.","Disinfects the skin before service.","Prepares the nail plate for enhancement product.","Removes dead skin, aiding texture and absorption."],"c":3,"e":"Exfoliation removes dead surface cells, improves texture, and helps later massage products absorb effectively."},
{"t":"Safety and Sanitation","q":"Which product used in nail services requires EPA registration?","a":["Hand soap for client handwashing.","Cuticle remover used during a manicure.","Disinfectants used to decontaminate implements and surfaces.","Nail dehydrator applied before enhancement."],"c":2,"e":"Products claiming to kill microorganisms on nonliving surfaces require EPA registration."},
{"t":"Nail Enhancements","q":"Compared to acrylic, powder dip has the following advantage:","a":["It provides more extension length without a form.","It is always easier to remove than acrylic.","No strong monomer odor (EMA is absent) and no UV lamp is required.","It is stronger than acrylic for every nail length."],"c":2,"e":"Powder dip uses no liquid EMA or MMA monomer and hardens with an activator rather than a UV lamp."},
{"t":"Pedicure","q":"A client with active tinea pedis presenting for a pedicure:","a":["Service is declined.","Service is performed using disposable liners only.","Nail care is performed without soaking.","Service proceeds with a fungicidal soak."],"c":0,"e":"Tinea pedis is an active fungal infection that can spread through basins, implements, and towels."},
{"t":"Nail Enhancements","q":"A gel enhancement that shows white discoloration (cloudiness) after curing indicates:","a":["Full polymerization and complete cross-linking.","Incomplete curing or moisture contamination.","Normal variation in clear builder gel.","An especially thick inhibition layer."],"c":1,"e":"Properly cured clear gel should remain transparent; cloudiness can signal under-curing or moisture interference."},
{"t":"Blood Spill","q":"When a client's skin is nicked and bleeds during a nail service, the first action is:","a":["Refer the client immediately to a physician.","Apologize and continue the service.","Apply a bandage and resume without further action.","Stop actions that could spread blood, apply styptic, and follow blood-exposure protocol."],"c":3,"e":"Stop the service, control the bleeding, and follow blood-exposure procedures for all contaminated items and surfaces."},
{"t":"Pedicure","q":"Thermal warm towel treatment as a pedicure add-on:","a":["Disinfects the foot surface.","Moist heat relaxes muscles, boosts circulation, and softens skin.","Removes dead cells through heat exfoliation.","Hardens the nail plate for polish adhesion."],"c":1,"e":"A warm towel wrap provides moist heat that relaxes muscles and prepares skin to absorb massage products."},
{"t":"Nail Enhancements","q":"Gel nail extension length options include:","a":["Various lengths, short to extra-long, limited by nail strength and skill.","Only lengths achievable with the natural nail plate.","Only the length achievable with one bead of builder gel.","Only natural-looking short lengths."],"c":0,"e":"Safe length depends on lifestyle, natural-nail strength, and the technician's ability to build proper structure."},
{"t":"Safety and Sanitation","q":"Source-capture ventilation in a nail salon works by:","a":["Drawing vapors away from the breathing zone at the point of generation.","Increasing overall room air turnover to dilute vapors.","Filtering return air before recirculating it.","Maintaining positive room pressure."],"c":0,"e":"Source capture removes vapors at the work surface before they reach the client or technician's breathing zone."},
{"t":"Pedicure","q":"Cracked pedicure basin surfaces must be removed from service because:","a":["They indicate excessive disinfectant concentration.","They change water temperature faster.","Cracks harbor biofilm that cleaning and disinfection can't remove.","They are aesthetically unpleasant."],"c":2,"e":"Cracks create inaccessible spaces where microorganisms and biofilm can remain despite proper decontamination."},
{"t":"Nail Enhancements","q":"The stress zone (zone 2) of a nail tip-and-overlay enhancement is located:","a":["At the highest point of the C-curve.","At the cuticle area.","At the junction of the natural nail and the nail tip overlay.","At the enhancement's free edge."],"c":2,"e":"The natural-nail and tip junction receives the greatest flexion stress and requires sufficient strength."},
{"t":"Manicure","q":"A gel overlay on natural nails is:","a":["A gel base coat with UV protection.","A thick builder gel used only to create an extension.","A thin layer of UV/LED gel over the natural nail plate for strength and shine without added length.","A full extension that adds substantial length beyond the free edge."],"c":2,"e":"A gel overlay reinforces and protects the natural nail while maintaining its existing length."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
