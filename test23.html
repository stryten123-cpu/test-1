<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice — Blood Spill Test 3</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Blood Spill Test 3</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Blood Spill","q":"Kansas blood-exposure steps for an actual injury during the exam begin with:","a":["File the free edge first","Stop the service immediately","Apply top coat to seal the cut","Call the next client over"],"c":1,"e":"KAR 28-24-3 / exam CIB: stop immediately, then glove, treat the wound, disinfect tools and station, bag waste, and only then continue."},
{"t":"Blood Spill","q":"\"Don protective gloves\" means:","a":["Wash gloves and hang them to dry","Put gloves on before you touch blood or the wound","Give your gloves to the client","Wear gloves only after cleanup is finished"],"c":1,"e":"Don = put on. Gloves go on before cleaning a client injury or handling contaminated items."},
{"t":"Blood Spill","q":"The sterile bandage is used to:","a":["Decorate the finger","Prevent further blood exposure after the area is cleaned","Replace disinfectant on the table","Hold a nail form in place"],"c":1,"e":"Once antiseptic is applied, the bandage covers the wound so blood does not keep contaminating the service."},
{"t":"Blood Spill","q":"Which disinfectant claim is missing if a bottle only says \"kills 99.9% of germs\"?","a":["A pretty label","The required EPA-registered, bactericidal, fungicidal, and virucidal wording examiners look for","The price","The salon name"],"c":1,"e":"Marketing language is not enough. The exam wants those specific hospital-grade claims on the label."},
{"t":"Blood Spill","q":"Household disinfectant wipes such as everyday Clorox or Lysol daily wipes are:","a":["Approved for Kansas blood-exposure cleanup","Not accepted for the blood-exposure portion of the exam","Required in every kit","Better than bleach solution"],"c":1,"e":"Kansas materials specifically reject those daily wipes for blood exposure. Use bleach solution or true hospital-grade product."},
{"t":"Blood Spill","q":"If blood splatters onto the nail table, you must:","a":["Cover it with a magazine","Clean and disinfect the station after the wound is controlled","Wait until the next day","Wipe it with the client's shirt"],"c":1,"e":"The station itself is part of the required cleanup, not just the finger."},
{"t":"Blood Spill","q":"Contaminated gloves are removed:","a":["First, so your hands can work faster","Last, then they go into the sealed double bag","Never; keep them on all day","And stored with clean files"],"c":1,"e":"Removing gloves last keeps bare skin off soiled items. Those gloves are waste, not clean inventory."},
{"t":"Blood Spill","q":"A candidate who arrives with an existing cut on their own hand should:","a":["Hide it and hope the examiner does not notice","Cover that hand with a single-use disposable glove before continuing services","Dip it in acrylic liquid","Refuse to sanitize"],"c":1,"e":"KBOC: an existing or new candidate-hand injury requires a disposable glove on that hand, changed whenever it is contaminated."},
{"t":"Blood Spill","q":"Biohazard bags after sealing should be:","a":["Opened again for the next client","Placed in the waste receptacle","Taped to the mannequin","Washed and reused"],"c":1,"e":"Seal completely, then put the bags in the trash receptacle. Do not keep them on the clean station."},
{"t":"Blood Spill","q":"Which situation is still a blood spill even if you did not mean to cause it?","a":["A hangnail that bleeds while you trim","Polish that chips","A dry cuticle that is only white","Dust from filing acrylic"],"c":0,"e":"Intent does not matter. Visible blood starts the full procedure."},
{"t":"Blood Spill","q":"You should refuse to keep working on an uncovered bleeding injury because:","a":["It slows down tips","Blood can infect the wound and expose you and the client to pathogens","The polish will not dry","The lamp will overheat"],"c":1,"e":"An open bleed is both an infection risk for the person who is cut and an exposure risk for everyone at the table."},
{"t":"Blood Spill","q":"Cotton used to clean a bleeding cut is:","a":["Rinsed and put back in the cotton jar","A contaminated single-use item","Sterilized in the UV cabinet","Given to the client as a souvenir"],"c":1,"e":"Once it touches blood or skin at the wound, that cotton is biohazard waste."},
{"t":"Blood Spill","q":"The clean (sanitary maintenance) area of the station should hold:","a":["The bag of bloody cotton","Only unused or already disinfected items","The first pair of soiled gloves","The client's used tissue"],"c":1,"e":"Never mix contaminated waste into the clean setup zone."},
{"t":"Blood Spill","q":"If you do not have enough remaining supplies to treat a real spill during the Kansas exam:","a":["Borrow from a stranger in the hallway after blood is already on the table","You can be dismissed from the exam","The examiner must finish the service for you","You may skip disinfection"],"c":1,"e":"That is why two kits or one oversized kit is required. Running out of legal supplies is an automatic safety fail."},
{"t":"Blood Spill","q":"Liquid styptic is preferred over an old alum block because:","a":["It is cheaper","The block can transfer blood back into the product and to the next wound","It smells like flowers","Boards ban all astringents"],"c":1,"e":"A solid block that touches one wound contaminates the whole stick. Liquid on a fresh applicator avoids that."},
{"t":"Blood Spill","q":"After cleanup, hand hygiene is done with:","a":["Only hand cream","Antimicrobial cleanser or soap and water","Nail oil","Acrylic monomer"],"c":1,"e":"Wash or use antimicrobial cleanser after gloves come off and before you touch clean tools or the client again."},
{"t":"Blood Spill","q":"Blood on a disposable nail file means that file should be:","a":["Disinfected 10 minutes and reused","Thrown away; it is porous and single-use","Washed in the pedicure basin","Stored in the client's file folder"],"c":1,"e":"Emery boards and other porous files cannot be properly disinfected after blood contact. Discard them."},
{"t":"Blood Spill","q":"The mock blood-exposure demonstration on the Kansas practical is performed:","a":["At home the night before only","As a required exam task on the mannequin/station during the timed setup and procedure","Only if someone actually bleeds","By the examiner while you watch"],"c":1,"e":"Candidates must demonstrate the full safe, sanitary procedure, not just talk about it."},
{"t":"Blood Spill","q":"Which sequence is correct for a client cut?","a":["Disinfect table → keep filing → bandage later","Stop → glove → clean wound → bandage → disinfect tools and station → bag waste (gloves last) → clean hands → resume if safe","Bandage first with bare hands → then glove","Pour antiseptic on the floor"],"c":1,"e":"Memorize that order. Skipping or reversing major steps is how people fail this section."},
{"t":"Blood Spill","q":"Treating every client's blood as infectious, even when they look healthy, is called:","a":["Sales technique","Universal / standard precautions","Dry sanitizing","A French manicure"],"c":1,"e":"You cannot see viruses. Universal precautions assume blood is a risk every time."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
