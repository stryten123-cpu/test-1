<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 7</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Nail Enhancements","q":"Using too wet an acrylic bead throughout the entire service causes:","a":["Stronger enhancements from higher monomer content.","Heat spikes, longer cure times, incomplete cure, and sensitization risk.","Better adhesion to the nail plate from higher monomer saturation.","More flexible enhancements that resist breakage."],"c":1,"e":"Excess monomer can cause heat spikes, extended curing, uncured monomer, sensitization risk, and a weaker final product."},{"t":"Nail Enhancements","q":"The recommendation to schedule the next fill appointment at checkout is considered:","a":["A professional service standard supporting nail health.","An aggressive sales tactic to be avoided.","Optional.","Required only for acrylic clients, not for gel."],"c":0,"e":"Scheduling the next fill supports nail health and maintains the enhancement before growth creates a structural imbalance."},{"t":"Safety and Sanitation","q":"The correct decontamination hierarchy from lowest to highest is:","a":["Sanitization, disinfection, sterilization.","Sterilization, disinfection, sanitization.","Disinfection, sanitization, sterilization.","Sanitization, sterilization, disinfection."],"c":0,"e":"Sanitization reduces microbial counts, disinfection destroys most surface pathogens, and sterilization destroys all microbial life including spores."},{"t":"Nail Enhancements","q":"Acrylic maintenance (fill) appointments are typically scheduled every:","a":["1 week.","6–8 weeks.","2–3 weeks.","Once per month."],"c":2,"e":"Two to three weeks of nail growth creates a visible regrowth gap and begins to shift the enhancement’s structural balance."},{"t":"Manicure","q":"Quick-dry drops applied to fresh polish accelerate drying by:","a":["Using fast-evaporating solvents that help draw out slower solvents and speed surface-film formation.","Physically hardening the polish through crystallization.","Immediately sealing the top coat with a waterproof film.","Chemically curing the polish like UV gel."],"c":0,"e":"Quick-dry drops speed solvent evaporation and surface-film formation; they do not chemically cure regular polish."},{"t":"Manicure","q":"The correct technique for using a cuticle pusher on the nail plate is:","a":["Gentle circular pushing to loosen dead cuticle without injuring the eponychium.","A vigorous back-and-forth motion to remove as much cuticle as possible.","Pressing firmly into the proximal fold to remove the mantle.","Firm scraping with the metal edge to remove all cuticle tissue quickly."],"c":0,"e":"Gentle, controlled motion removes dead cuticle while protecting the living eponychium and proximal nail fold."},{"t":"Safety and Sanitation","q":"Sodium hypochlorite (bleach) as a salon disinfectant:","a":["Is the only EPA-registered product for pedicure basins.","Requires heating to activate its disinfecting properties.","Is corrosive, can damage metal implements, and is often replaced by quats in professional settings.","Is preferred for all implements because of its low cost."],"c":2,"e":"Bleach is effective but corrosive and irritating; many salons use appropriate quaternary ammonium disinfectants instead."},{"t":"Nail Enhancements","q":"When applying a nail tip, the angle of application is:","a":["90 degrees perpendicular to the nail plate.","45 degrees.","Flat and parallel to the nail plate from the beginning.","As low as possible to minimize contact."],"c":1,"e":"Position the contact zone at about 45 degrees, then rock the tip flat to press out trapped air."},{"t":"Safety and Sanitation","q":"During consultation, a client mentions a latex allergy. The nail technician should:","a":["Switch to nitrile gloves, verify that service supplies are latex-free, and document the allergy.","Decline every nail service because gloves are required.","Proceed normally because nail-service supplies never contain latex.","Require the client to bring personal gloves."],"c":0,"e":"Nitrile gloves and verified latex-free supplies reduce exposure risk, and the allergy should be documented."},{"t":"Pedicure / Safety","q":"Safe pedicure technique for a client with diabetes includes:","a":["Declining all pedicure services for every diabetic client.","Proceeding with standard technique.","Gentle technique, warm—not hot—water, extra care to prevent skin breaks, and monitoring.","Providing nail polish only."],"c":2,"e":"Reduced sensation and circulation require gentle work, careful temperature control, and close monitoring."},{"t":"Nail Enhancements / Safety","q":"A client has a cyanoacrylate (nail glue or superglue) allergy. Powder-dip services for this client are:","a":["Contraindicated because powder-dip systems are cyanoacrylate-based.","Safe because powder dip contains no cyanoacrylate.","Possible if an acid-free primer replaces the activator.","Appropriate if the client takes an antihistamine first."],"c":0,"e":"Cyanoacrylate allergy directly contraindicates powder-dip systems that use cyanoacrylate-based resin."},{"t":"Blood Spill / Safety","q":"After blood contacts the technician's hands, the technician should:","a":["Put on gloves immediately without washing.","Use hand sanitizer only.","Wash immediately with soap and water for at least 20 seconds.","Wipe the hands with a dry cloth and continue."],"c":2,"e":"Soap-and-water handwashing for at least 20 seconds is required after potential blood contact; sanitizer alone is insufficient for visible contamination."},{"t":"Manicure","q":"A squoval nail shape combines:","a":["Angular tapered sidewalls ending in a point.","A very elongated oval with a narrow, flat tip.","The strength of a square nail with slightly softened corners.","Sharp square corners with the full length of an oval nail."],"c":2,"e":"Squoval keeps the structural benefits of a square shape while softening corners that might catch or break."},{"t":"Safety and Sanitation","q":"Wooden implements such as orangewood sticks should be:","a":["Rinsed and air-dried for reuse.","Discarded after use because porous materials cannot be reliably disinfected.","Disinfected in an EPA-registered solution for reuse.","Boiled for 10 minutes to sterilize them."],"c":1,"e":"Porous wood can harbor organisms and cannot be reliably disinfected, so wooden implements are single-use."},{"t":"Safety and Sanitation","q":"Products transferred from original containers to smaller dispensing containers must:","a":["Be mixed with other products and topped off.","Retain proper labeling that identifies the product and its hazards.","Be stored without labeling.","Be discarded at the end of every day."],"c":1,"e":"Secondary containers must be labeled with the product identity and required hazard information."},{"t":"Nail Enhancements","q":"When applying builder gel in multiple layers, each layer is:","a":["Applied wet-on-wet and all layers cured at the end.","Applied at maximum thickness so one coat cures through.","Applied dry and brushed smooth before any curing.","Individually cured before the next layer is applied."],"c":3,"e":"Curing each layer separately prevents buried, incompletely cured gel and resulting structural weakness."},{"t":"Pedicure","q":"Proper toenail length after a pedicure is:","a":["Several millimeters beyond the toe.","Even with or slightly beyond the tip of the toe—not so short that the nail bed is exposed.","As short as possible.","Any length requested, even below the toe tip."],"c":1,"e":"Keeping toenails even with or slightly beyond the toe helps protect the nail bed and reduce problems as they grow."},{"t":"Safety and Sanitation","q":"For reusable nail-salon implements, the required decontamination level between clients is:","a":["Sterilization using an autoclave.","Sanitization with antimicrobial soap only.","Disinfection using an EPA-registered hospital-level disinfectant.","Rinsing with 70% isopropyl alcohol."],"c":2,"e":"Reusable implements must be cleaned and then disinfected with an appropriate EPA-registered hospital-level disinfectant."},{"t":"Nail Enhancements","q":"Which step must be completed before applying new acrylic over a fill gap?","a":["Blend the product edges, clean and dehydrate the exposed natural nail, and prime only that natural nail.","Apply gel top coat to the fill area.","Soak the regrowth area in warm water.","Apply cuticle oil before primer."],"c":0,"e":"Proper fill preparation blends existing product and prepares only the exposed natural nail for adhesion."},{"t":"Manicure","q":"Compared with a glossy top coat, a matte top coat:","a":["Requires a special base coat to flatten the reflection.","Can only be used over gel polish.","Contains no UV protection and always fades within days.","Produces a non-shiny finish and typically chips faster."],"c":3,"e":"Matte top coats scatter light to create a flat finish and may have less chip resistance than glossy finishes."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
