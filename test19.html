<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 19</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 19</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Pedicure","q":"Hot stone massage add-on uses:","a":["Heated ceramic stones that cool rapidly.","Heated basalt stones.","Cooled quartz crystals.","Room-temperature gemstones."],"c":1,"e":"Basalt is volcanic rock with high heat-retention capacity — it stays warm long enough for a complete massage sequence, transferring therapeutic warmth to soft tissues."},
{"t":"Safety and Sanitation","q":"The infectious dose refers to:","a":["The concentration of disinfectant required to kill a pathogen on a contaminated surface.","The minimum number of pathogenic organisms needed to establish infection.","The prescribed antibiotic dose for treating a nail infection.","The volume of blood needed to transmit a pathogen, in milliliters per exposure."],"c":1,"e":"Infectious dose is the minimum quantity of pathogens required to establish infection in a host. Pathogens with low infectious doses are more easily transmitted — relevant to understanding infection risk in nail salons."},
{"t":"Nail Enhancements","q":"Isopropyl alcohol (IPA) in nail technology is primarily used as:","a":["A primer to improve adhesion.","A surface cleanser — removing oils, residue, and the inhibition layer after gel curing.","A disinfectant for client skin before service.","A nail polish remover equivalent to acetone, dissolving lacquer just as quickly from the plate."],"c":1,"e":"IPA (typically 90–99% concentration in nail products) is used as a surface cleanser: removing the gel inhibition layer, preparing the nail plate during fills, and cleaning product residue from brushes and surfaces. Not a disinfectant for implements."},
{"t":"Nail Enhancements","q":"Acrylic nail dust from filing is managed by:","a":["A fabric dust mask sufficient to filter the particles.","Wetting the enhancement with water before filing, which prevents any dust from becoming airborne at all.","No management needed — cured acrylic dust is inert.","Source-capture ventilation, N95 respiratory protection, and prompt dust collection into waste."],"c":3,"e":"Acrylic dust management: source-capture ventilation, N95 respirator (filters fine particles), and prompt waste collection. Cured acrylic dust is a respiratory irritant with chronic health implications."},
{"t":"Manicure","q":"The correct way to clean a nail polish brush between colors during a nail art service is:","a":["Wipe on a dry paper towel, then wipe in a drop of new color.","Soak in nail polish thinner until color is released.","Wipe on a dry paper towel only.","Dip in acetone between each color."],"c":0,"e":"Between colors in nail art: wipe the brush thoroughly on a dry paper towel, then wipe in the edge of the new color before applying to the nail. This removes previous color contamination without solvent."},
{"t":"Safety and Sanitation","q":"After a manicure that included massage with oil, the workstation requires:","a":["Only the arm cushion cover changed.","Disinfection of all client-contact surfaces.","Only a standard surface wipe.","No special post-massage disinfection."],"c":1,"e":"All workstation surfaces contacting the client must be cleaned and disinfected — including surfaces that contacted massage oil. Client skin oils carry organisms and must be removed as part of standard post-service disinfection."},
{"t":"Safety and Sanitation","q":"Acrylic nail dust during filing is a health concern because:","a":["It triggers allergic reactions in all clients immediately.","Inhaled particles can cause respiratory irritation and cumulative lung damage.","It reacts with workstation disinfectants to release toxic fumes throughout the salon air.","It damages salon flooring requiring special cleaners."],"c":1,"e":"Fine acrylic dust is a respiratory hazard. Chronic inhalation can cause airway inflammation and occupational asthma. Ventilation and appropriate respiratory protection are protective measures."},
{"t":"Nail Enhancements","q":"The total acetone soak time for complete acrylic removal is typically:","a":["15–25 minutes — enough for acetone to fully soften the acrylic.","5 minutes.","2–3 minutes — acetone works quickly.","48 hours — acetone works very slowly on cured acrylic."],"c":0,"e":"Typical acrylic soak time: 15–25 minutes depending on enhancement thickness, product formulation, and acetone concentration. Thick enhancements may require longer; pre-filing the surface to break the seal reduces soak time."},
{"t":"Manicure","q":"Base coat in a traditional nail polish service:","a":["Provides a UV-blocking shield that keeps the curing lamp from yellowing the natural nail plate during service.","Seals over the color coat as the final layer, locking in shine and shielding the polish from everyday chips.","Promotes adhesion of nail polish to the nail plate and prevents staining of the natural nail.","Provides the color pigmentation layer."],"c":2,"e":"Base coat is the first layer applied in a polish service. It promotes polish adhesion and prevents staining of the natural nail plate from pigments in colored polish."},
{"t":"Safety and Sanitation","q":"The appropriate response when a contraindication is identified during pre-service assessment is:","a":["Proceed with a quietly modified service and keep the finding out of the record, so the client is not alarmed by a manageable condition.","Ask the client whether they wish to proceed anyway, and if they sign a waiver accepting the risk, carry out the full contraindicated service.","Explain the finding to the client, document it, decline the contraindicated service, and provide a referral if appropriate.","Always decline all services and refer the client to a physician."],"c":2,"e":"When a contraindication is found: explain it to the client professionally, document the finding, decline the specific contraindicated service, and suggest appropriate referral. Clear communication and documentation protect both client and technician."},
{"t":"Manicure","q":"Primary contraindication to massage during a nail service:","a":["Any skin condition, including simple dry skin, which rules out massage entirely.","Mild muscle soreness from exercise.","Active inflammation, phlebitis, or clotting disorder in the area.","The client's stated preference for minimal physical contact during the service."],"c":2,"e":"Absolute massage contraindications: active phlebitis (clot dislodgement risk), acute inflammation, fractures, and open wounds in the area."},
{"t":"Safety and Sanitation","q":"Acetone's effect on skin with repeated exposure is:","a":["Increased suppleness of the surrounding skin and nail plate, as the solvent draws in moisture and leaves the tissue more flexible and better hydrated.","Permanent skin sensitization after a single exposure.","Defatting (removing natural skin lipids) causing dryness, irritation, and compromised skin barrier with prolonged or repeated contact.","No lasting effect, because acetone flashes off so fast that it evaporates before it can pull any oils from the skin or reach the living cell layers."],"c":2,"e":"Acetone dissolves lipids — including the skin's natural sebum. Repeated exposure removes the skin's protective lipid layer, causing dryness, irritation, and compromised barrier function. Protective gloves during removal services reduce this risk."},
{"t":"Nail Enhancements","q":"The nail technician adjusts the acrylic bead consistency for different application zones by:","a":["Working at different speeds for different zones.","Changing the brand of monomer between zones.","Controlling the brush saturation level.","Using different powder sizes for different zones."],"c":2,"e":"Bead consistency control: adjust brush saturation level for each zone. Wetter for zone 1 (workability for extension), medium for zone 2 (strength at apex), drier for zone 3 (precise placement near cuticle)."},
{"t":"Safety and Sanitation","q":"Chemical sensitization to nail products differs from irritation in that sensitization:","a":["Affects only skin without immune system involvement.","Causes immediate redness the very first time the skin is exposed.","Is reversible once exposure stops.","Produces an acquired immune hypersensitivity."],"c":3,"e":"Sensitization is immune-mediated: first exposure primes the immune system; subsequent exposures trigger allergic reactions. Once sensitized, a technician may need to leave enhancement work permanently."},
{"t":"Safety and Sanitation","q":"The proper sequence for workstation preparation before a new client is seated:","a":["Complete workstation disinfection, fresh linen/table cover, clean implements from covered storage, and new single-use supplies positioned.","Have the client inspect and sign off on the workstation's cleanliness first, since their written approval transfers sanitation responsibility to them.","Set up the implements during the consultation while the client waits, laying everything out so the disinfected tools air-dry fully on the open table.","Client sits, then workstation is set up while client waits."],"c":0,"e":"Workstation prep occurs before the client is seated: disinfect all surfaces, change the table/arm cover, position clean implements, and set out new single-use supplies. Efficient setup allows uninterrupted service from the start."},
{"t":"Pedicure","q":"Callus treatment as pedicure add-on addresses:","a":["Dry, peeling cuticles along the toenail folds, which the add-on smooths away by buffing the eponychium back with the coarse foot paddle.","Fungal infections beneath thickened toenails, which the add-on clears by soaking the foot in antifungal callus solution to kill the spores.","Ingrown toenails, which the add-on corrects by cutting a channel down the side of the plate with a specialized ingrown file to free the edge.","Excessive stratum corneum buildup, softened with a chemical callus remover and reduced with a foot file, rasp, or paddle."],"c":3,"e":"Callus treatment add-ons use more intensive products and more thorough mechanical reduction than the standard pedicure callus step."},
{"t":"Nail Enhancements","q":"The primary technical quality marker in French acrylic work is:","a":["The thickness uniformity throughout the service.","The crispness and symmetry of the smile line.","Apex height, which must be precisely measured.","The speed of completion relative to client satisfaction."],"c":1,"e":"French nail quality standard: the smile line's crispness and bilateral symmetry are the most visible indicators of technical skill. Proper product control is demonstrated by the ability to create a precise, symmetrical C-curve."},
{"t":"Safety and Sanitation","q":"Direct contact transmission in a nail salon occurs when:","a":["A pathogen is carried by insects between clients.","The technician's ungloved hand touches an infected area, then a second client's skin.","A client inhales chemical vapors that carry pathogens from the products.","A pathogen travels through the air from one client to another across the salon room."],"c":1,"e":"Direct contact transmission is person-to-person physical transfer — e.g., the technician's ungloved hands touching an infected area and then the next client's skin. Transfer through a contaminated implement or surface is indirect (fomite) transmission."},
{"t":"Manicure","q":"Cuticle remover is an alkaline product that:","a":["Bleaches the nail plate for a cleaner appearance.","Softens dead keratinized cuticle tissue through alkaline action, making it easier to push back or remove.","Disinfects the cuticle area before the service, killing bacteria in the nail fold so no separate sanitizer is needed.","Stimulates circulation in the nail fold area."],"c":1,"e":"Cuticle remover (alkaline pH 9–12) softens dead cuticle by disrupting keratin bonds. Limited contact time is essential — extended contact irritates living tissue."},
{"t":"Manicure","q":"After massage lotion, excess is removed from nail plates by:","a":["Buffing each nail plate with a coarse abrasive block until the lotion film is ground off.","Rinsing the hands under warm running water, which floats the lotion film off the plates.","Wiping each plate with a dry terry towel whose looped fibers soak up the lotion oils.","Cleansing nail plates with non-acetone polish remover or IPA wipe."],"c":3,"e":"Massage lotion on the nail plate prevents base coat adhesion. A quick cleanse with non-acetone remover or IPA wipe removes oil specifically from the nail plates while leaving skin moisturized."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
