<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minh Test</title>
  <style>
    :root{
      --ink:#241b1a;
      --muted:#756a66;
      --paper:#fffdfa;
      --rose:#b51f46;
      --rose2:#f8dce4;
      --shadow:0 22px 70px rgba(63,37,30,.14);
    }
    *{box-sizing:border-box} 
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .shell{
      width:min(1100px,calc(100% - 28px));
      margin:0 auto;
      padding:40px 0 60px;
    }
    .header{
      text-align:center;
      margin-bottom:30px;
    }
    .mark{
      display:inline-grid;
      place-items:center;
      width:270px;
      height:162px;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:14px;
      box-shadow:0 10px 25px rgba(0,0,0,0.18);
    }
    .mark img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    h1{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(32px,5vw,48px);
      margin:10px 0;
    }
    p{
      color:var(--muted);
      font-size:18px;
      max-width:600px;
      margin:0 auto;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(93px,1fr));
      gap:12px;
      margin-top:36px;
    }
    .card{
      background:rgba(255,253,250,.96);
      border:1px solid rgba(255,255,255,.8);
      border-radius:12px;
      box-shadow:var(--shadow);
      padding:10px;
      text-decoration:none;
      color:var(--ink);
      transition:transform .2s ease, box-shadow .2s ease;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 30px rgba(63,37,30,.2);
    }
    .card-head{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:6px;
    }
    .card-icon{
      width:15px;
      height:15px;
      border-radius:4px;
      background:var(--rose2);
      color:var(--rose);
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:8px;
      flex-shrink:0;
    }
    .card-title{
      font-family:Georgia,serif;
      font-size:11px;
      font-weight:700;
      margin:0;
      line-height:1.2;
    }
    .card-desc{
      color:var(--muted);
      font-size:10px;
      line-height:1.2;
      margin-bottom:10px;
    }
    .btn{
      background:var(--ink);
      color:#fff;
      border:0;
      border-radius:8px;
      padding:6px 8px;
      font-weight:800;
      text-align:center;
      font-size:10px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <div class="mark">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Obverse_of_the_series_2009_%24100_Federal_Reserve_Note.jpg" alt="$100 Bill">
      </div>
      <h1>Cố Lên</h1>
      <p>Chọn một trong những bài Test này.</p>
    </div>

    <div id="quizGrid" class="grid"></div>
  </main>

<script>
// Automatically generates cards for Test 1 through Test 25
const totalTests = 25;
const grid = document.getElementById("quizGrid");

for (let i = 1; i <= totalTests; i++) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = `test${i}.html`;
  card.setAttribute("data-title", `Practice Test ${i}`);
  card.innerHTML = `
    <div>
      <div class="card-head">
        <div class="card-icon">${i}</div>
        <h2 class="card-title">Test ${i}</h2>
      </div>
      <div class="card-desc">Practice exam #${i}.</div>
    </div>
    <div class="btn">Start →</div>
  `;
  grid.appendChild(card);
}
</script>
</body>
</html>
