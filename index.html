<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nail Technology Practice Exam Portal</title>
  <style>
    :root{
      --ink:#241b1a;
      --muted:#756a66;
      --paper:#fffdfa;
      --rose:#b51f46;
      --rose2:#f8dce4;
      --shadow:0 22px 70px rgba(63,37,30,.14);
    }
    *{box-sizing:border-box} 
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .shell{
      width:min(1100px,calc(100% - 28px));
      margin:0 auto;
      padding:40px 0 60px;
    }
    .header{
      text-align:center;
      margin-bottom:40px;
    }
    .mark{
      display:inline-grid;
      place-items:center;
      width:56px;
      height:56px;
      border-radius:18px;
      background:var(--rose);
      color:#fff;
      font-family:Georgia,serif;
      font-size:32px;
      margin-bottom:14px;
      box-shadow:0 10px 25px rgba(181,31,70,0.3);
    }
    h1{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(32px,5vw,48px);
      margin:10px 0;
    }
    p{
      color:var(--muted);
      font-size:18px;
      max-width:600px;
      margin:0 auto;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:20px;
      margin-top:36px;
    }
    .card{
      background:rgba(255,253,250,.96);
      border:1px solid rgba(255,255,255,.8);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:24px;
      text-decoration:none;
      color:var(--ink);
      transition:transform .2s ease, box-shadow .2s ease;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 28px 80px rgba(63,37,30,.2);
    }
    .card-head{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:12px;
    }
    .card-icon{
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--rose2);
      color:var(--rose);
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:18px;
      flex-shrink:0;
    }
    .card-title{
      font-family:Georgia,serif;
      font-size:20px;
      font-weight:700;
      margin:0;
    }
    .card-desc{
      color:var(--muted);
      font-size:14px;
      line-height:1.4;
      margin-bottom:20px;
    }
    .btn{
      background:var(--ink);
      color:#fff;
      border:0;
      border-radius:12px;
      padding:12px 16px;
      font-weight:800;
      text-align:center;
      font-size:14px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <span class="mark">N</span>
      <h1>Nail Technology Practice Exams</h1>
      <p>Select a practice quiz below to test your knowledge for state board licensing.</p>
    </div>

    <div id="quizGrid" class="grid"></div>
  </main>

<script>
const testList = [
  { id: 1, file: "test1.html", title: "Practice Test 1", desc: "20 questions covering blood spills, manicures, and safety." },
  { id: 2, file: "test2.html", title: "Practice Test 2", desc: "20 questions covering cuticle care, acrylics, and sanitation." },
  { id: 3, file: "test3.html", title: "Practice Test 3", desc: "20 questions covering nail diseases and disorders." },
  { id: 4, file: "test4.html", title: "Practice Test 4", desc: "20 questions covering monomer liquid and polymer powder." },
  { id: 5, file: "test5.html", title: "Practice Test 5", desc: "20 questions covering UV/LED gel enhancements." },
  { id: 6, file: "test6.html", title: "Practice Test 6", desc: "20 questions covering electric filing and nail tips." },
  { id: 7, file: "test7.html", title: "Practice Test 7", desc: "20 questions covering pedicures and reflexology." },
  { id: 8, file: "test8.html", title: "Practice Test 8", desc: "20 questions covering chemistry and salon safety." },
  { id: 9, file: "test9.html", title: "Practice Test 9", desc: "20 questions covering state laws and licensing rules." },
  { id: 10, file: "test10.html", title: "Practice Test 10", desc: "Comprehensive 20-question final review exam." }
];

const grid = document.getElementById("quizGrid");
testList.forEach(item => {
  const card = document.createElement("a");
  card.className = "card";
  card.href = item.file;
  card.innerHTML = `
    <div>
      <div class="card-head">
        <div class="card-icon">${item.id}</div>
        <h2 class="card-title">${item.title}</h2>
      </div>
      <div class="card-desc">${item.desc}</div>
    </div>
    <div class="btn">Start Test ${item.id} →</div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
