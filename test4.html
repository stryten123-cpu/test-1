<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 4</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 4</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Manicure / Pedicure","q":"After applying final top coat, drying can be accelerated by:","a":["Applying hand cream immediately to seal the polish and lock out surface moisture.","Using a nail dryer lamp, quick-dry drops, or cool air across the nails.","Placing hands in cool water.","Buffing the top coat lightly, which sets the finish through the warmth of friction."],"c":1,"e":"Approved drying acceleration: UV/LED quick-dry lamps, commercial quick-dry drops, or cool air. Water risks bubbling. Buffing removes the top coat."},
{"t":"Nail Enhancements","q":"Methyl methacrylate (MMA) was prohibited in nail products because:","a":["It is more expensive than EMA reducing salon profits.","MMA requires autoclave sterilization unlike EMA.","MMA produces more dust than EMA creating a greater respiratory hazard.","Severely sensitizing, too rigid (tears nails), and not skin-approved."],"c":3,"e":"MMA's prohibition stems from multiple safety issues: severe contact dermatitis/sensitization, extreme rigidity causing nail plate avulsion when enhancement catches, and its lack of FDA/state board approval for direct nail use."},
{"t":"Nail Enhancements","q":"The smile line in a French acrylic service should be:","a":["Perfectly symmetrical and placed at the natural free edge regardless of enhancement length.","Created by applying white product all the way to the cuticle.","A clean, crisp curved line at the pink/white junction, following the natural C-curve.","Always placed at exactly the center of the enhancement length."],"c":2,"e":"The smile line position defines the visual proportion of the French nail. It follows the natural C-curve of the nail at the free edge/nail bed junction. Clean, symmetrical curves on both sides are the hallmark of quality French work."},
{"t":"Safety and Sanitation","q":"A nail technician with an open cut should:","a":["Stop all services until the cut heals, as boards demand a skin-break leave.","Avoid chemical services only.","Cover it with a bandage and wear gloves during all services.","Continue without modification, since salon disinfectants make gloves unnecessary."],"c":2,"e":"An open cut is a portal of entry and exit for pathogens. Cover the wound and wear gloves to protect both technician and client. Complete work cessation is unnecessary for a minor covered cut."},
{"t":"Manicure","q":"The manicure massage is performed:","a":["After base coat application, so the oils help the polish spread evenly.","During the fingerbath soak, worked underwater to combine two steps.","Before cuticle work, to soften the skin and loosen tissue for pushing.","After nail care steps and before polish application."],"c":3,"e":"Massage is performed after nail care (cuticle work, nail cleansing) and before polish. Starting polish requires clean, oil-free nails — nails are re-cleansed with polish remover before base coat after massage."},
{"t":"Nail Enhancements","q":"The 'backfill' technique using an electric file during enhancement maintenance:","a":["Refers to applying product to the back of the nail tip.","Removes all enhancement product for a complete replacement service.","Uses the e-file to remove the old smile line and reshape the stress area.","Describes filing from the back of the nail plate toward the free edge."],"c":2,"e":"Backfill uses the electric file to remove product from the zone 2 stress area (the smile line of a French enhancement) to create a fresh, even product depth for the new product application during fill."},
{"t":"Safety and Sanitation","q":"Product containers on the workstation must be:","a":["Stored directly on the work surface without secondary containment.","Left open for easy access during service.","Capped to prevent contamination, evaporation, fire (flammable solvents).","Discarded daily and replaced with fresh product."],"c":2,"e":"Capping products when not in use: prevents contamination (dust, debris), reduces evaporation of volatile components (monomers, solvents), and for flammable products (acetone, monomer) reduces fire hazard from vapor accumulation."},
{"t":"Nail Enhancements","q":"The 'balance point' of an enhancement nail refers to:","a":["The lowest point of the enhancement's C-curve, measured across the free-edge underside.","The point where the enhancement's weight and structure create optimal balance.","The midpoint of the extension length beyond the free edge, where the sidewalls are thinned most.","The midpoint of the nail plate length."],"c":1,"e":"Balance point is where the nail's structural arc creates optimal weight distribution. Proper apex placement at the balance point (zone 2) ensures the nail doesn't lever backward or forward with applied force."},
{"t":"Pedicure","q":"Pedicure foot soak water temperature should be:","a":["Comfortably warm (~100–105°F) tested on the technician's inner wrist before the client's feet are placed in.","Room temperature.","Cool to prevent heavy bleeding during cuticle work, because cold water constricts vessels and firms the skin.","As hot as possible to maximize softening."],"c":0,"e":"Water should be comfortably warm — tested by the technician's inner wrist before client contact. Hot water risks burns, especially for diabetics and those with neuropathy."},
{"t":"Nail Enhancements","q":"Catalysts in acrylic nail systems typically take the form of:","a":["Acetone added to thin the monomer for workability.","Benzoyl peroxide in powder, initiating free-radical polymerization.","Metal oxides in the powder that accelerate setting time.","UV light energy activating photo-initiators in the polymer."],"c":1,"e":"Benzoyl peroxide in the polymer powder acts as the initiator/catalyst. When combined with the amine activator in the monomer, it decomposes to produce free radicals that start the polymerization chain reaction."},
{"t":"Nail Enhancements","q":"The purpose of the backfill technique during acrylic maintenance is:","a":["Filing off the stress zone and smile line for a fresh application base.","Adding additional layers over the existing enhancement.","Removing all old product for a complete reapplication.","Applying new product to the entire nail including existing enhancement."],"c":0,"e":"Backfill: during French acrylic maintenance, the electric file removes the stress zone and existing smile line, creating a level surface. New product is applied over this fresh base, maintaining proper apex height and smile line placement."},
{"t":"Manicure","q":"Back-and-forth sawing during filing should be avoided because:","a":["It takes longer than one-directional filing.","It prevents achieving the desired shape.","It removes more nail length than intended.","Heat and delamination of nail layers cause splitting."],"c":3,"e":"Back-and-forth filing generates heat and creates micro-tears at nail plate edges, causing delamination of the layered keratin structure. One-directional filing prevents this."},
{"t":"Safety and Sanitation","q":"Multi-use implements (metal nippers, pushers) after a nail service must be:","a":["Sprayed with disinfectant and returned to the clean storage container immediately.","Placed in a soiled implement container and run through the clean-disinfect-store sequence.","Soaked in acetone to remove product residue, then stored.","Rinsed with water and returned to the clean implement storage."],"c":1,"e":"Used implements are contaminated. They go into the soiled implement container, are cleaned (remove debris), then disinfected (EPA-registered disinfectant, full contact time), then stored clean. This sequence must complete before reuse."},
{"t":"Safety and Sanitation","q":"Which pathogen causes the 'greenies' under nail enhancements?","a":["Pseudomonas aeruginosa (bacterium producing green pigment).","Trichophyton rubrum, a fungal dermatophyte that stains the nail plate green.","Candida albicans (yeast).","Herpes simplex virus, which colonizes the moist space beneath the enhancement."],"c":0,"e":"Green discoloration under lifting enhancements is Pseudomonas aeruginosa — a bacterium, not mold. This is a frequently tested distinction. The bacteria thrives in the warm moist pocket of a lifting enhancement."},
{"t":"Nail Enhancements","q":"When sculpting a nail extension using a form, the product is applied:","a":["Randomly.","Over the entire form area from cuticle to free edge tip in one large bead, then pinched flat and cured for a full ten minutes before the form is peeled away and the tip reshaped.","Starting at the cuticle and working toward the free edge, laying the thickest bead directly over the matrix so the apex forms at the cuticle line and the tip tapers thin.","In zone 1 (free edge/extension area) first, then zone 2 (stress/apex), then zone 3 (cuticle area) using appropriate bead consistencies for each."],"c":3,"e":"Sculptured nail sequence: zone 1 (extension area on the form) first to establish the length, zone 2 (stress/apex area) second with the peak bead, zone 3 (cuticle zone) last with a drier precise bead. This order builds optimal structure."},
{"t":"Manicure","q":"Metal nail clippers are used for:","a":["Trimming the nail plate length before filing — especially for significantly longer nails.","Buffing the nail plate to a shine.","Removing cured acrylic product during fills by clipping the old enhancement off the plate in small sections before the new balance is built.","Applying and spreading bead-form nail products across the plate, using the flat lever edge to press the acrylic down into the surface for adhesion."],"c":0,"e":"Metal nail clippers trim nail length quickly before fine shaping with a file. They are multi-use metal implements that must be cleaned and disinfected between clients."},
{"t":"Safety and Sanitation","q":"Paronychia on the middle finger of the hand to be serviced requires:","a":["Declining service on that digit and referring for medical treatment.","No modification, since paronychia is non-contagious and clears within a day.","Modification to avoid the affected digit during massage, then polishing that nail anyway.","Service with extra antiseptic applied to the affected area."],"c":0,"e":"Paronychia is bacterial infection of the nail fold — a contraindication to service on the affected digit. While not contagious to other clients via intact skin, service would worsen the infection. Medical treatment is required."},
{"t":"Manicure","q":"The purpose of a base coat is:","a":["To provide the primary nail color.","To seal the finished service for chip resistance and add a final high-gloss shine.","To protect the nail plate from staining and improve polish adhesion.","To condition the cuticle and soften the eponychium during polish application."],"c":2,"e":"Base coat: forms a bonding layer improving polish adhesion and provides a barrier protecting the natural nail plate from staining by dark polishes."},
{"t":"Nail Enhancements","q":"The exothermic reaction during acrylic application means:","a":["Cold is produced, which sets the acrylic quickly.","Heat is produced as monomer and polymer react.","The chemical reaction requires external heat to proceed.","The product shrinks as it cools after application."],"c":1,"e":"Polymerization is exothermic — it releases heat. Clients may feel warmth during acrylic application, especially if the bead is too wet (more monomer = more exothermic reaction). Excessive heat can damage the nail bed."},
{"t":"Nail Enhancements","q":"The correct response when a client reports burning during acrylic application:","a":["Apply cool water immediately to neutralize the reaction and stop the monomer from curing.","Remove the hand from the work surface, check for heat spike, and reduce product thickness.","Proceed — heat indicates proper curing is occurring.","Reassure the client it is normal and apply more product."],"c":1,"e":"Burning during acrylic application signals excessive exothermic heat — typically from overly wet bead, too-thick application, or excessive primer. Remove from heat source, assess, reduce product layer thickness before continuing."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
