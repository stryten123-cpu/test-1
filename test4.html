<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 4</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 4</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Nail Enhancements","q":"Which material is usually used to create a sparkling and shimmering effect in nail art?","a":["Shimmering colored stone pieces (rhinestones)","Using metallic paints","Attached jewelry","Using a fine buffer block"],"c":0,"e":"Rhinestones are the most common decorative material used to add sparkle and shimmer to finished nail art."},
{"t":"Pedicure","q":"What is the standard time for soaking a client's feet in an antiseptic basin during a pedicure?","a":["About 5 minutes","About 10 minutes","About 15 minutes","Minimum of 2 minutes"],"c":0,"e":"A short soak of approximately 5 minutes softens the skin and cuticles without over-hydrating the feet."},
{"t":"Safety and Sanitation","q":"Which type of solution is effective for disinfecting nail tools?","a":["6% Hydrogen peroxide","60% concentration alcohol","Alum compound","1,000 p.p.m. Quats solution"],"c":3,"e":"Quaternary ammonium compounds mixed to 1,000 ppm are a standard EPA-registered disinfectant used for multi-use nail implements."},
{"t":"Manicure","q":"Wavy ridges on fingernails can be treated by buffing with?","a":["Boric acid solution","70% alcohol","Specialized pumice powder","Nail oil"],"c":2,"e":"Light buffing with pumice powder or a fine buffer helps smooth ridges and creates a more even surface for polish."},
{"t":"Safety and Sanitation","q":"A nail specialist can be fined or have their license revoked if they?","a":["Use prohibited chemicals (such as MMA)","Seriously violate hygiene regulations","Work while suffering from an infectious disease","All of the above reasons"],"c":3,"e":"Using banned chemicals, major hygiene violations, and working while infectious are all grounds for disciplinary action by the state board."},
{"t":"Safety and Sanitation","q":"What is the most hygienic way to dry the hands of the technician and client?","a":["Using a shared cloth towel","Using disposable paper towels or freshly laundered cloth towels","Letting hands dry naturally","Using a blow dryer"],"c":1,"e":"Disposable paper towels or clean, freshly laundered cloth towels prevent cross-contamination between clients."},
{"t":"Safety and Sanitation","q":"Which of the following nail conditions is a nail technician NOT permitted to treat directly?","a":["Hangnail issues","Redness, inflammation, or swelling of tissue around the nail","The client's habit of nail biting","Pterygium growing onto the nail plate"],"c":1,"e":"Signs of infection or inflammation require referral to a physician. Technicians must not work on infected or inflamed tissue."},
{"t":"Safety and Sanitation","q":"70% concentration Ethyl alcohol has the same disinfecting capacity as what concentration of Isopropyl alcohol?","a":["70% concentration","90% concentration","99% concentration","120% concentration"],"c":2,"e":"70% ethyl alcohol and approximately 99% isopropyl alcohol provide comparable antimicrobial effectiveness for surface and tool disinfection."},
{"t":"Pedicure","q":"What is the intensive care process for legs, feet, and toenails called?","a":["Pedicure","Thick nail condition","Hand care process","Perionychium infection"],"c":0,"e":"A pedicure is the professional service that includes care of the feet, toenails, and lower legs."},
{"t":"Nail Enhancements","q":"What is the advantage of fiberglass nail wrap compared to other types?","a":["Provides superior strength and is thin and light","Is the cheapest price","Easily peels off on its own","Does not need maintenance"],"c":0,"e":"Fiberglass wraps add strength while remaining thin and lightweight, making them a popular choice for natural-looking reinforcement."},
{"t":"Safety and Sanitation","q":"The use of uncleaned tools can lead to which disease?","a":["White nail disease due to fungus","Nail mold phenomenon","Infection and inflammation around the nail","Congenital birthmarks"],"c":2,"e":"Dirty implements can transfer bacteria or fungi that cause infection and inflammation of the nail and surrounding tissue."},
{"t":"Safety and Sanitation","q":"To ensure disinfecting chemical concentrations always meet standards, specialists should store them in?","a":["Large capacity containers","Small, compact bottles","Near windows with direct light","Inside the refrigerator"],"c":1,"e":"Storing disinfectant concentrates in smaller, tightly closed bottles helps maintain proper strength and reduces contamination risk."},
{"t":"Nail Enhancements","q":"What is the technique called when decorating nails with ultra-thin gold or silver sheets?","a":["Gem setting technique","French nail painting","Metal leaf decoration (gold/silver leaf)","Striping tape technique"],"c":2,"e":"Applying ultra-thin metal leaf (gold or silver) is a specialized nail art technique that creates a luxurious metallic finish."},
{"t":"Nail Enhancements","q":"Removing artificial nails incorrectly can damage natural nails because of?","a":["Using a metal pusher too hard","Using force to pull or twist the artificial nail off","Using acetone to soften the nail","Using cuticle softeners"],"c":1,"e":"Forcing or twisting enhancements off can peel layers of the natural nail plate. Proper soaking or filing is required for safe removal."},
{"t":"Safety and Sanitation","q":"Each individual nail technician needs to maintain personal hygiene to?","a":["Protect the health of the community","Enhance the city's reputation","Protect their own health","Build an image for society"],"c":2,"e":"Good personal hygiene protects the technician from infection and also sets a professional standard that safeguards clients."},
{"t":"Pedicure / Safety","q":"The appearance of blisters and thick white patches between the toes is a sign of which disease?","a":["Athlete's foot (Tinea pedis)","Infection of the nail matrix area","Skin growing onto the nail surface (pterygium)"],"c":0,"e":"Athlete's foot presents as itching, blisters, and white macerated skin between the toes. Service should be refused and the client referred to a physician."},
{"t":"Nail Enhancements","q":"The artificial nail application technique brings practical benefits for people with unattractive natural nails by?","a":["Making nails look longer and stronger","Increasing the high gloss of the nail","Supporting natural nails to grow faster","Making fingernails smooth immediately"],"c":0,"e":"Enhancements improve the appearance and durability of short, weak, or damaged natural nails by adding length and strength."},
{"t":"Manicure","q":"Top coat products are specifically designed for the purpose of?","a":["Increasing shine and protecting the color polish layer","Used to remove old color layers","Making natural nails grow faster","Supporting the softening of the cuticle area"],"c":0,"e":"Top coat seals the color, adds gloss, and protects the manicure from chipping and fading."},
{"t":"Nail Enhancements","q":"After sanitizing the nail and pushing the cuticle, what is the next step when doing gel nails?","a":["Apply the first gel layer to the nail","Attach artificial nail tips","Attach nail forms for shaping","Buff lightly to remove surface oil"],"c":3,"e":"Light buffing removes residual oils and creates a slightly textured surface so the gel base adheres properly."},
{"t":"Blood Spill / Safety and Sanitation","q":"In case of a risk of minor cut to the client while doing nails, you should treat the cut with?","a":["Astringents (acting to close pores)","Specialized styptic pencil","Using pumice stone to lightly grind the wound","Lysol disinfectant chemical"],"c":0,"e":"For minor nicks, an astringent or styptic product is applied to stop bleeding and clean the area before continuing or referring the client."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
