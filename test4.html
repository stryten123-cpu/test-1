<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 4</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{t:"Nail Enhancements",q:"When sculpting a nail extension using a form, the product is applied:",a:["To zone 3 first, then zone 2, then zone 1.","Only to zone 2 until the apex is complete.","In one large bead over all three zones.","To zone 1 first, then zone 2, then zone 3, using the appropriate bead consistency for each zone."],c:3,e:"Build the free edge in zone 1, establish structure and the apex in zone 2, then carefully blend zone 3 near the cuticle."},
{t:"Manicure",q:"Metal nail clippers are used for:",a:["Trimming nail plate length before filing, especially on long nails.","Removing living cuticle tissue.","Smoothing the surface of the nail plate.","Removing acrylic enhancement product."],c:0,e:"Clippers safely reduce excess natural-nail length before the nail is refined with a file."},
{t:"Safety and Sanitation",q:"A client has paronychia on the middle finger. The nail technician should:",a:["Decline service on the affected digit and recommend medical treatment.","Drain the area and continue the service.","Cover it with enhancement product.","Perform the service normally after applying alcohol."],c:0,e:"Paronychia may be an infection. Do not work on the affected digit; refer the client to a medical professional."},
{t:"Manicure",q:"The purpose of a base coat is to:",a:["Add the final shine and prevent chipping.","Dry the color coat more quickly.","Protect the nail plate from staining and improve polish adhesion.","Soften the cuticle before polishing."],c:2,e:"Base coat creates a protective layer that reduces staining and helps color adhere."},
{t:"Nail Enhancements / Safety",q:"A client reports a burning sensation during acrylic application. What is the correct response?",a:["Continue because warmth is always harmless.","Remove the hand, check for a heat spike, and reduce product thickness.","Place the hand under a stronger lamp.","Apply another thick bead over the area."],c:1,e:"Excessively thick product can generate uncomfortable heat. Stop, assess the client, and correct the application."},
{t:"Pedicure / Safety",q:"Tinea pedis is a contraindication to a pedicure because:",a:["It makes the toenails grow too quickly.","It is a contagious fungal infection that may spread through basins and tools.","It permanently prevents polish adhesion.","It is caused only by dry skin."],c:1,e:"Tinea pedis is contagious and can spread through contaminated surfaces, tools, and footbaths."},
{t:"Safety and Sanitation",q:"Ventilation at a nail workstation should be arranged so that:",a:["Air blows product vapors toward the technician.","Source-capture ventilation draws vapors away from both breathing zones at the nail surface.","A fan spreads vapors throughout the salon.","Windows remain closed during every service."],c:1,e:"Source-capture ventilation removes vapors and dust close to where they are produced."},
{t:"Pedicure / Safety",q:"Razors are prohibited for callus removal because:",a:["They make the skin too smooth for lotion.","They cannot remove enough dead skin.","They disinfect poorly but cannot injure skin.","They can cut too deeply and create wounds; blades on skin are restricted to licensed medical professionals."],c:3,e:"Razors can remove living tissue and cause bleeding or infection, so nail technicians must not use them on clients."},
{t:"Nail Enhancements",q:"The durability of a gel enhancement is most affected by:",a:["The color selected by the client.","The quality of nail plate preparation.","The shape of the polish bottle.","The temperature of the hand lotion."],c:1,e:"Thorough preparation removes surface contaminants and is essential for proper adhesion and durability."},
{t:"Safety and Sanitation",q:"In disinfection, contact time means:",a:["The time a client touches an implement.","The time needed to clean visible debris.","The time between two appointments.","The minimum time an implement or surface must remain wet with disinfectant for the product to work."],c:3,e:"A disinfectant is effective only when the surface remains visibly wet for the label's required contact time."},
{t:"Safety and Sanitation",q:"Tweezers used in nail-art services must be:",a:["Cleaned and disinfected as reusable metal implements.","Wiped on a towel and returned to storage.","Discarded after every client even when metal.","Soaked only in acetone."],c:0,e:"Reusable, nonporous metal tools must be cleaned and properly disinfected between clients."},
{t:"Manicure",q:"What is the correct sequence for nail polish application?",a:["Base coat, color coat, top coat.","Top coat, base coat, color coat.","Color coat, base coat, top coat.","Base coat, top coat, color coat."],c:0,e:"Base coat protects and improves adhesion, color provides pigment, and top coat seals the service."},
{t:"Safety and Sanitation",q:"EMA is the professional-standard monomer because it:",a:["Has lower sensitization potential, remains flexible, and is approved for professional nail use.","Creates the hardest possible enhancement regardless of safety.","Requires no ventilation or protective practices.","Is identical to MMA in rigidity and risk."],c:0,e:"Ethyl methacrylate is the accepted professional monomer and is safer and more flexible than MMA when used properly."},
{t:"Nail Enhancements",q:"Yellowing of acrylic nails can be caused by:",a:["Only an incorrect nail shape.","Using a fine-grit file.","UV exposure, chemicals, certain medications, or pigment transfer from polish.","Applying cuticle oil after the service."],c:2,e:"Several external and internal factors can discolor enhancement product, including UV light and chemical or pigment exposure."},
{t:"Safety and Sanitation",q:"Bacterial spores are especially resistant to infection control because:",a:["They are produced only by fungi.","They are the airborne form of all viruses.","They cannot survive outside a living host.","They are dormant structures that can survive many disinfectants that kill active bacteria."],c:3,e:"Bacterial spores are dormant, highly resistant structures; ordinary disinfection may not destroy them."},
{t:"Manicure",q:"A top coat is applied to:",a:["Condition the nail plate with oils after color.","Provide the primary nail color.","Seal the color coat, add shine, and provide a chip-resistant finish.","Etch the natural nail so polish grips it."],c:2,e:"Top coat is the finishing protective layer that seals color, adds gloss, and helps resist chipping."},
{t:"Nail Enhancements",q:"Acrylic nail enhancements should be soaked for removal by:",a:["Filing the top surface to break the seal, then wrapping with acetone-saturated cotton and foil.","Immersing unfiled glossy nails in warm acetone.","Prying the product from the free edge.","Filing all product to the bare natural nail with a coarse abrasive."],c:0,e:"File away the shine, wrap with acetone-soaked cotton, allow the product to soften, and gently remove it—never pry."},
{t:"Blood Spill / Safety",q:"A client asks whether HIV transmission is possible during a nail service. The nail technician should explain:",a:["HIV requires infected blood or certain body fluids to contact the bloodstream or a mucous membrane.","Latex gloves are required for every service solely because of HIV.","Nail salons pose no risk under any circumstances.","HIV is transmitted through the air."],c:0,e:"Standard precautions prevent exposure to blood and body fluids that could transmit HIV through broken skin or mucous membranes."},
{t:"Safety and Sanitation",q:"A buffer block is:",a:["A metal tool requiring weekly sterilization.","A porous single-use implement discarded after each client.","A reusable item disinfected with UV light.","A reusable implement disinfected like a metal pusher."],c:1,e:"Porous buffer blocks cannot be reliably disinfected and must be discarded or assigned exclusively to one client."},
{t:"Safety and Sanitation",q:"A sanitary nail-service workstation is characterized by:",a:["Clean surfaces, covered implements, and prevention of cross-contamination.","Maximum product display for marketing.","Simultaneous use by multiple technicians.","Keeping the most products visible for client selection."],c:0,e:"A sanitary station has clean, disinfected surfaces; properly covered and separated implements; capped products; and controls that prevent cross-contamination."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
