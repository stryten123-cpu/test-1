<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 2</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 2</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Nail Enhancements","q":"A polymer is:","a":["A single reactive molecule that evaporates once the enhancement sets.","A long chain of repeating monomer units formed through polymerization.","A solvent used to dissolve acrylic enhancements","A photo-initiator that starts the curing reaction."],"c":1,"e":"Polymers are large molecules made of repeating monomer units. In nail technology, acrylic powder is pre-formed polymer (PMMA). When monomer contacts polymer, polymerization creates the enhancement."},
{"t":"Nail Enhancements","q":"A medium-wet acrylic bead consistency is preferred for the stress zone (zone 2) because:","a":["Medium-wet reduces the exothermic heat spike in this area.","Medium-wet gives optimal working time and the densest, strongest product.","Medium-wet sets fastest, securing the stress zone quickly.","Medium-wet contains the highest ratio of initiator for superior cure."],"c":1,"e":"Medium-wet bead consistency provides the ideal balance: enough monomer for complete polymerization, enough powder for structural strength, and optimal working time to shape the stress arch before setting."},
{"t":"Safety and Sanitation","q":"A thorough nail consultation should include discussion of:","a":["Length, shape, service type, lifestyle, allergies, nail health.","The client's relationship status and lifestyle only.","Financial considerations before any clinical assessment.","Only the products to be used during the service."],"c":0,"e":"Complete consultation covers: desired outcome (shape, length, style), service selection, lifestyle factors (water exposure, manual work), allergies/sensitivities, medical history relevant to nails, and current nail/skin condition."},
{"t":"Manicure","q":"The purpose of soaking fingernails in warm water during a manicure is:","a":["To disinfect the nail surface, since warm water alone destroys surface germs.","To activate the base coat adhesion layer beneath the softened keratin surface.","To soften the cuticle and skin tissue making cuticle care easier.","To open the nail plate's pores so conditioning oils and solvents absorb inward."],"c":2,"e":"Soaking softens the cuticle (dead tissue on the nail plate) and the eponychium tissue, making cuticle removal easier, less traumatic, and more comfortable."},
{"t":"Safety and Sanitation","q":"A nail brush used for scrubbing during pedicure:","a":["Must be single-use or thoroughly cleaned and disinfected between clients.","Is a permanent reusable tool needing no special decontamination between clients.","Can be sanitized with alcohol spray between clients.","Requires autoclave sterilization after each pedicure service."],"c":0,"e":"Nail brushes that contact client skin and nails must be properly decontaminated. If the brush has stiff bristles (non-porous nylon), it can be cleaned and disinfected. Natural-bristle brushes should be single-use."},
{"t":"Nail Enhancements","q":"Product applied too close to the cuticle during acrylic application causes:","a":["Chemical burns from monomer contact with the eponychium that scar the matrix and halt growth.","Lifting as skin oils migrate under the enhancement, breaking the adhesion bond.","Faster cure from body heat at the proximal fold.","Enhanced adhesion, as natural cuticle moisture bonds chemically with the monomer film."],"c":1,"e":"Skin contact with enhancement provides a pathway for skin oils to migrate under the product. As the skin flexes and the nail grows, this separation propagates inward causing lifting. Maintain 1/16 inch from the cuticle."},
{"t":"Safety and Sanitation","q":"Viruses differ from bacteria in that viruses:","a":["Require a living host cell to reproduce and cannot replicate independently.","Are always visible under standard light microscopy.","Can be treated with the antibiotics used for bacterial infections to break the viral wall.","Are larger, so standard disinfectants dissolve their protein coat within the contact time."],"c":0,"e":"Viruses are obligate intracellular parasites that cannot replicate outside a living host cell. This explains why antibiotics are ineffective against viral infections."},
{"t":"Manicure","q":"Capping the free edge during a manicure means:","a":["Filing the free edge flat at 90 degrees.","Applying a nail tip over the free edge.","Applying cuticle oil along the free edge.","Sealing the free edge with base and top coat."],"c":3,"e":"Capping seals the nail tip with base coat and top coat, preventing lifting and chipping that typically starts at the unsupported free edge."},
{"t":"Safety and Sanitation","q":"After completing a nail service, the nail technician should document:","a":["Only items required by state board regulation.","General appointment notes without specific product details.","Only the price charged and payment received.","Services, product formulas, nail/skin notes, reactions, home care."],"c":3,"e":"Service records should include: services performed, product formulas (brand, product name for gel/acrylic/dip), nail/skin conditions observed, any reactions, and home care instructions. These records support consistent future services."},
{"t":"Nail Enhancements","q":"A monomer is defined as:","a":["A long chain of repeating chemical units that forms once the product fully hardens.","A solvent that dissolves polymer chains by breaking their cross-links during removal.","A hardened nail product after UV curing.","A single molecule capable of bonding with other monomers to form a polymer."],"c":3,"e":"A monomer is a single reactive molecule. When monomers chemically bond together in a chain reaction, they form a polymer. In nail products, liquid monomer (EMA) combines with powder polymer (PMMA) to form the acrylic nail."},
{"t":"Nail Enhancements","q":"A drier bead consistency near the cuticle area (zone 3) is used because:","a":["Drier beads are stronger than wet beads.","Drier beads have less odor near the client's face.","Precise placement near the cuticle without flooding skin; sets quickly.","Drier beads contain less monomer reducing sensitization risk."],"c":2,"e":"Zone 3 (proximal, near cuticle): a drier bead sets quickly in place without spreading and can be placed precisely at the desired distance from the cuticle. The quick set prevents product from migrating toward skin."},
{"t":"Safety and Sanitation","q":"Standard precautions in a nail salon are applied:","a":["Only when a client discloses a known infectious condition on the intake form.","Only for pedicure services, where cracked heels and open skin raise the risk.","To every client on every service, regardless of visible signs.","Only when the technician has open cuts or abrasions present on their own hands."],"c":2,"e":"Standard precautions treat all clients as potentially infectious because pathogens may be present without visible signs. Selective application based on appearance is inadequate."},
{"t":"Manicure","q":"During a manicure, the nail technician should NEVER:","a":["Apply cuticle remover to the cuticle area, then gently push the cuticle back.","Push back the cuticle after soaking, once the softened tissue loosens from the plate.","File nails in one direction from corner to center with smooth, even strokes.","Cut living tissue — the living eponychium or lateral nail folds."],"c":3,"e":"Living tissue must never be cut during nail services. Only dead tissue tags (hangnails, dead cuticle) may be removed. Cutting living skin creates wounds and infection risk."},
{"t":"Nail Enhancements","q":"After completing acrylic application and before filing, the enhancement should be:","a":["Soaked in monomer to soften slightly for filing.","Covered with gel top coat to protect during filing.","Allowed to fully cure/harden.","Filed immediately while still slightly soft for easier shaping."],"c":2,"e":"Full cure before filing: the polymerization reaction must complete before filing pressure is applied. Filing partially-set product creates internal stress, distorts the shape, and may leave uncured product beneath the filed surface."},
{"t":"Manicure","q":"A metal cuticle pusher is used to:","a":["Mix acrylic monomer with polymer powder","File the free edge of the nail.","Cut away excess cuticle tissue.","Push back the eponychium; remove dead cuticle."],"c":3,"e":"The metal cuticle pusher (spoon pusher) gently pushes back the eponychium and can help loosen dead cuticle from the nail plate. It is a multi-use metal implement requiring cleaning and disinfection between clients."},
{"t":"Safety and Sanitation","q":"The three labeled waste containers standard for a nail workstation are:","a":["Chemical waste, biological waste, and general waste, each in a red biohazard bag.","Acetone waste, paper waste, and implement waste.","To be disinfected (used implements awaiting decontamination), soiled linens, and trash.","Product waste, paper waste, and implement waste."],"c":2,"e":"The standard three-container workstation system: container for used implements awaiting disinfection, soiled linen bag, and general trash. This organized separation streamlines sanitation workflow and infection control."},
{"t":"Manicure","q":"After cuticle care, the nail plate is cleansed to:","a":["Begin the massage step","Initiate the exfoliation component","Apply the base coat, a cleanser step that etches the plate for polish.","Remove cuticle remover residue and oils before polish application."],"c":3,"e":"After cuticle work, cleansing removes cuticle remover residue (alkaline product that prevents polish adhesion), skin oils, and debris. A clean nail plate ensures optimal polish adhesion."},
{"t":"Safety and Sanitation","q":"Paronychia caused by Staphylococcus aureus is:","a":["A viral condition affecting the nail matrix at the base of the nail.","A bacterial infection of the tissue surrounding the nail.","A parasitic infestation of the nail fold, spread by mites along the groove.","A fungal infection of the nail plate spreading from the free edge inward."],"c":1,"e":"Paronychia is bacterial inflammation of the nail fold tissue. It is a non-serviceable condition requiring medical referral rather than nail service on the affected digit."},
{"t":"Nail Enhancements","q":"Polymerization in nail enhancement chemistry refers to:","a":["The evaporation of liquid monomer during application.","The dissolution of hardened acrylic during removal.","The simple physical mixing of the monomer liquid and the polymer powder into a workable paste.","The chemical reaction in which monomers bond together to form a solid polymer chain."],"c":3,"e":"Polymerization is the chemical reaction converting monomers into a polymer. It is exothermic (produces heat) and irreversible — the cured enhancement cannot revert to monomer and powder without a solvent like acetone."},
{"t":"Nail Enhancements","q":"The apex of an acrylic nail enhancement is the:","a":["Highest structural point — the arch over zone 2 — that provides the nail's structural strength.","Thinnest part of the enhancement near the free edge.","The nail's smile line in a French service.","The proximal zone where enhancement meets the natural nail, the flattest area bearing the greatest stress."],"c":0,"e":"The apex is the highest point of the nail's arch, positioned over zone 2 (the stress zone). Proper apex placement distributes mechanical stress across the nail's length, preventing stress fractures and breakage."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
