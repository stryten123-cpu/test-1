<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 2</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 2</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Nail Enhancements","q":"When performing acrylic application, what is the most important role of the Primer layer?","a":["Creating a strong bond between the powder and the natural nail","Used to mend cracks","Helping to completely remove stains","Increasing the mechanical durability of the nail"],"c":0,"e":"Primer prepares the natural nail surface and creates a strong chemical bond between the nail plate and the acrylic product, which is essential for adhesion and longevity."},
{"t":"Nail Enhancements","q":"When performing acrylic application, if the humidity in the room is too high, the acrylic powder will?","a":["Dry faster","Dry slower than normal","Become shinier","Crack immediately"],"c":1,"e":"High humidity slows the evaporation of the monomer liquid, causing the acrylic to set more slowly than normal."},
{"t":"Nail Enhancements","q":"The adhesive used for attaching nail tips and wraps is usually which type?","a":["Wood glue","Iron glue","Cyanoacrylate resin","White school glue"],"c":2,"e":"Cyanoacrylate (super glue type) resin is the standard adhesive used for bonding nail tips and fabric wraps to the natural nail."},
{"t":"Nail Enhancements","q":"Which type of nail polish remover is safest for clients wearing artificial nails?","a":["Pure Acetone","Non-Acetone solution","High concentration medical alcohol","Hydrogen peroxide compound"],"c":1,"e":"Non-acetone remover is gentler on artificial nails (especially acrylic and gel) and is less likely to damage or soften the enhancement."},
{"t":"Safety and Sanitation","q":"The key factor to maintaining a professional appearance for a nail technician is?","a":["Always using expensive perfume","Cleanliness and daily personal hygiene","Having extremely long nails","Talking a lot with clients"],"c":1,"e":"Daily personal hygiene and overall cleanliness are the foundation of a professional image in the nail industry and help prevent the spread of infection."},
{"t":"Safety and Sanitation","q":"Which of the following terms refers to a substance capable of destroying germs (germicide)?","a":["Disinfectant","Antiseptic","Deodorant compound","Substance with anesthetic effect"],"c":0,"e":"A disinfectant is a chemical agent that destroys or inactivates microorganisms on non-living surfaces and implements."},
{"t":"Safety and Sanitation","q":"Most antiseptic liquids in nail salons have which main ingredient?","a":["Distilled water","Isopropyl or Ethyl Alcohol","Acetone solvent","Glycerin"],"c":1,"e":"Isopropyl or ethyl alcohol is the primary active ingredient in most salon antiseptics used for skin and surface preparation."},
{"t":"Safety and Sanitation","q":"Which of the following is considered a contagious condition or infestation that a nail technician should recognize?","a":["Head lice condition","Ringworm (fungal infection) on hands or feet","Scabies","All three of the above"],"c":3,"e":"Head lice, ringworm, and scabies are all contagious. A technician must recognize them and refuse service to prevent spread."},
{"t":"Safety and Sanitation","q":"Salons currently prefer using which of the following disinfection methods?","a":["Using a heat source","Using an oven","Using chemicals","Using steam pressure equipment"],"c":2,"e":"Chemical disinfection with EPA-registered products is the standard and most practical method used in modern nail salons."},
{"t":"Safety and Sanitation","q":"Before placing tools in a UV cabinet, which area must be cleaned especially thoroughly?","a":["Only cleaning the outer surface","Combining with disinfectant solution","Cleaning hidden pockets and small crevices on tools","Used for components that can be discarded"],"c":2,"e":"UV cabinets only store already-disinfected tools. All debris and residue, especially in crevices, must be removed first or the UV light will not be effective."},
{"t":"Safety and Sanitation","q":"Which of the following actions is strictly prohibited in cosmetology schools or salons?","a":["Using chewing gum","Reading professional books/magazines","Smoking behavior","Communicating with colleagues"],"c":2,"e":"Smoking is strictly prohibited in salons and schools for fire safety, air quality, and professional standards."},
{"t":"Manicure","q":"Why is it necessary to wipe the nail surface with antiseptic solution before painting the client's nails?","a":["To keep the nail cool","To remove oil and dirt so the polish adheres more durably","To soften the nail","To help the nail dry quickly"],"c":1,"e":"Removing natural oils and residual dirt from the nail plate allows the polish to adhere properly and last longer."},
{"t":"Nail Enhancements / Safety","q":"If a client's nails are found to have mold or fungus, the specialist is only allowed to perform which action?","a":["Performing the removal of the artificial nail layer","Proceeding with a regular fill-in","Painting a very dark color layer to cover it","Using specialized medicine to treat it"],"c":0,"e":"When mold or fungus is present under an enhancement, the only permitted action is complete removal. The client must then be referred to a physician; technicians do not treat infections."},
{"t":"Nail Enhancements","q":"To achieve aesthetics and durability, acrylic nails should be applied by?","a":["Applying individual small and even powder beads","Using circular brush motions","Maintaining the powder mixture in an extremely wet state","Applying when the powder is in a dry state"],"c":0,"e":"Small, even beads of the correct consistency allow precise placement, proper curing, and a smooth, durable finished product."},
{"t":"Nail Enhancements","q":"Why is buffing the natural nail surface before applying acrylic powder important?","a":["To remove the natural oil layer and increase adhesion","To make the nail thinner","To make the nail bright white","To reduce the heat when the powder dries"],"c":0,"e":"Light buffing removes surface oils and creates microscopic texture so the primer and acrylic can form a strong mechanical and chemical bond."},
{"t":"Nail Enhancements","q":"To remove nail polish on artificial nails without damaging the material, the technician must use?","a":["Non-acetone nail polish remover","High-acetone nail polish remover","Specialized nail softening product","High-concentration medical alcohol"],"c":0,"e":"Non-acetone remover dissolves polish while being much gentler on acrylic, gel, and tip enhancements."},
{"t":"Nail Enhancements","q":"Some types of solvents containing Acetone have the ability to make acrylic nails become?","a":["Soft","Harder","Thinner","Thicker"],"c":0,"e":"Acetone dissolves the polymer structure of acrylic, softening and eventually breaking it down so the enhancement can be removed."},
{"t":"Nail Enhancements","q":"Striping tape should be cut away from the cuticle and free edge by a distance of?","a":["About 1/8 inch","About 1/16 inch","About 1/32 inch","Pasted completely flush"],"c":1,"e":"Leaving a small gap (approximately 1/16 inch) prevents the tape from lifting at the cuticle or free edge and keeps the design clean."},
{"t":"Manicure","q":"The effect of soaking fingernails in warm soapy water is to?","a":["Make nails shinier","Clean and soften the cuticle area around the nails","Make nails stronger","Deodorize the hands"],"c":1,"e":"Warm soapy water cleans the nail and softens the cuticle and surrounding skin so they can be safely pushed back or trimmed."},
{"t":"Safety and Sanitation","q":"What concentration of alcohol is suitable for disinfecting sharp metal tools?","a":["50% alcohol","65% alcohol","70% alcohol","100% alcohol (pure)"],"c":2,"e":"70% isopropyl or ethyl alcohol is the most effective concentration for disinfection. Pure (100%) alcohol evaporates too quickly and is less effective against microbes."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
