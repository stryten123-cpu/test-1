<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 9</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Blood Spill / Safety","q":"After a blood-exposure incident during a service, the nail technician should:","a":["Stop, apply styptic, cover the wound, and disinfect blood-contacted items.","Refer the client to an emergency room for any blood exposure.","Apply styptic and continue without special decontamination.","Apply pressure only."],"c":0,"e":"Stop the service, control and cover the wound, and properly decontaminate every item or surface that contacted blood."},{"t":"Manicure","q":"A client requests a gel manicure. The additional step compared with a regular manicure is:","a":["Using a stronger cuticle remover.","Applying an extra coat of base coat to seal the color.","Applying disposable nail forms to build a sculpted extension.","Curing each gel layer under a UV/LED lamp."],"c":3,"e":"Gel manicures require the base, color, and top-coat layers to be cured under the appropriate UV/LED lamp."},{"t":"Nail Enhancements","q":"An acrylic nail that has a visible 'shadow' under the product is most likely:","a":["Separation (lifting) between the enhancement and nail plate, forming a void.","Caused by excess primer application in that area.","Caused by the nail plate’s natural pink color showing through.","Normal for thick acrylic applications in zone 2."],"c":0,"e":"A dark shadow usually indicates lifting and a void that can trap moisture and microorganisms."},{"t":"Nail Enhancements","q":"Which technique reduces heat spike when curing thick builder gel layers?","a":["Increasing lamp wattage to cure faster.","Applying the gel thicker so more product absorbs the heat.","Flash curing with a brief 3–5 second initial cure before the full cure.","Curing several thick builder layers at once."],"c":2,"e":"Flash curing begins polymerization gradually and spreads the exothermic heat release across two stages."},{"t":"Pedicure","q":"Exfoliation during a pedicure:","a":["Removes dead skin cells, improving texture and product absorption.","Disinfects the foot surface.","Replaces the foot soak in a waterless pedicure.","Permanently removes dead skin cells."],"c":0,"e":"Exfoliation removes dead surface cells, improves texture, and helps moisturizing products absorb more effectively."},{"t":"Safety and Sanitation","q":"Before an implement can be effectively disinfected, it must first be:","a":["Soaked in acetone to dissolve all residue.","Heated to 140°F to activate the disinfectant.","Cleaned to remove all visible debris and organic material.","Dried completely before any cleaning."],"c":2,"e":"Debris and organic matter can protect microorganisms and interfere with disinfectant action, so cleaning must come first."},{"t":"Nail Enhancements","q":"Slip solution used with polygel during application is:","a":["An accelerator that initiates the UV cure reaction.","A primer applied before polygel to improve adhesion.","A liquid that lubricates the brush so polygel can be shaped.","An adhesive that bonds polygel to the nail plate."],"c":2,"e":"Slip solution prevents sticky polygel from adhering to the brush while it is smoothed and shaped."},{"t":"Manicure / Nail Enhancements","q":"Nail shape affects enhancement longevity because:","a":["Shapes with sharp corners are more prone to catching, stress fractures, and breakage than rounded shapes.","Pointed shapes are always stronger because they channel stress into the tip.","Shape has no effect on how long enhancements last.","Rounded shapes grow out faster and require more frequent fills."],"c":0,"e":"Sharp corners catch easily and concentrate stress, while rounded shapes distribute stress more evenly."},{"t":"Blood Spill / Safety","q":"Blood-contaminated single-use items must be:","a":["Disinfected and placed in the regular trash.","Discarded in a biohazard waste bag or appropriate container.","Autoclaved before disposal.","Rinsed under running water and placed in the regular trash."],"c":1,"e":"Blood-contaminated disposables are biohazardous waste and require an appropriate designated container."},{"t":"Nail Enhancements","q":"The powder dip system cures through:","a":["A two-component liquid-and-powder reaction activated by heat.","Air drying through solvent evaporation like nail polish.","UV/LED photopolymerization like gel systems.","Chemical polymerization involving the cyanoacrylate-based resin and activator."],"c":3,"e":"Powder dip uses cyanoacrylate chemistry and hardens through a chemical reaction at room temperature without a lamp."},{"t":"Pedicure","q":"Foot and nail inspection before a pedicure is documented because:","a":["It is required by every state board for pedicures only.","Documentation is always optional.","It helps calculate service pricing.","It records pre-existing conditions and protects against later claims."],"c":3,"e":"Recording wounds, infections, or other pre-existing conditions supports safe decisions and protects the technician professionally."},{"t":"Safety and Sanitation","q":"Quaternary ammonium (quat) disinfectants are effective against:","a":["All bacterial spores at standard salon dilution.","Mycobacterium tuberculosis at every standard dilution.","Most bacteria, fungi, and enveloped viruses at the labeled concentration.","Only gram-positive bacteria."],"c":2,"e":"Quats work against many bacteria, fungi, and enveloped viruses but generally do not destroy bacterial spores."},{"t":"Nail Enhancements","q":"The inhibition layer on cured builder gel is:","a":["The bonding surface between two gel layers only.","An air bubble trapped during application.","A sign of incomplete cure requiring more lamp time.","The normal oxygen-inhibited tacky surface layer that is removed with cleanser."],"c":3,"e":"Oxygen inhibits polymerization at the outer surface, leaving a normal tacky layer that is wiped from the final layer."},{"t":"Pedicure / Safety","q":"A paraffin pedicure add-on is contraindicated for clients with:","a":["Ticklish feet.","Toenail enhancements.","Open wounds, rashes, poor circulation, or an active infection on the feet.","Extremely dry skin without any lesions."],"c":2,"e":"Heat and wax can worsen inflammation or infection and can cause burns when circulation or heat sensation is impaired."},{"t":"Nail Enhancements","q":"In a powder dip service, the steps include:","a":["Primer, dip, monomer rinse, and UV cure.","Base coat, dip, and a required UV cure.","Base coat, stamp powder on, air cure, and top coat.","Base coat, dip into powder, activator, repeat layers, shape and buff, then top coat."],"c":3,"e":"The standard system layers resin and powder, uses activator to harden it, then is shaped, buffed, and finished."},{"t":"Safety and Sanitation","q":"An SDS must be accessible in the nail salon:","a":["At all times during work shifts when hazardous chemicals are present.","Only once per year during the annual safety review.","Only for products with the highest hazard rating.","Only when requested by a state board inspector."],"c":0,"e":"Safety Data Sheets must be immediately accessible during every work shift when hazardous chemicals are present."},{"t":"Pedicure / Manicure","q":"Gel polish applied to toenails is:","a":["Applied like fingernail gel polish—base, color, and top gel are each cured under UV/LED.","Cured longer because toenails absorb more lamp light.","Not recommended.","Applied with a separate layering method because toenails are curved."],"c":0,"e":"The same base, color, and top-coat system is used on toenails, with every layer cured under the appropriate lamp."},{"t":"Nail Enhancements","q":"Gel nail enhancement maintenance (fill) is scheduled approximately:","a":["Every 2–3 weeks as new growth creates a gap at the proximal end.","Every 6–8 weeks.","Exactly once per month.","Every week because gel grows out faster than acrylic."],"c":0,"e":"Natural nail growth creates a regrowth gap and shifts structural balance, so fills are generally needed every two to three weeks."},{"t":"Safety and Sanitation","q":"After disinfecting implements, they should be stored:","a":["In a clean, closed container or drawer to prevent recontamination.","In disinfectant solution until needed.","On the open workstation to air-dry.","In a UV cabinet that continues disinfecting them."],"c":0,"e":"Clean, dry implements must be protected in a closed storage area; open storage can recontaminate them."},{"t":"Pedicure / Safety","q":"The first pedicure step after seating the client is:","a":["Inspecting the feet and nails for contraindications before any contact or service step.","Removing old polish before inspection.","Soaking the feet immediately.","Applying callus softener first."],"c":0,"e":"The technician must inspect for wounds, infections, and contagious conditions before water, products, or implements contact the feet."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
