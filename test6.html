<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 6</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 6</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Pedicure","q":"Toenails should be cut or filed:","a":["Rounded to match toe contour.","Straight across with gently rounded corners — not too short — to prevent ingrown toenail development.","Pointed for optimal appearance.","Only from the free edge inward toward the base, to thin the plate and keep the toenail from thickening."],"c":1,"e":"Straight across with gently rounded corners prevents ingrown toenails. Cutting too short or deeply rounded at the sides leaves sharp edges that grow into the nail fold."},
{"t":"Safety and Sanitation / Blood Spill","q":"Hepatitis B vaccination is recommended for nail technicians because:","a":["HBV is transmissible through blood contact and is preventable by vaccination.","HBV causes the onychomycosis in nail clients and spreads through shared files.","It also prevents HCV and HIV infection.","OSHA mandates it for cosmetology workers."],"c":0,"e":"HBV vaccination provides effective protection against a genuine blood-contact transmission risk in nail services. HCV and HIV have no approved vaccines."},
{"t":"Nail Enhancements","q":"Which statement about acrylic removal with acetone is most accurate?","a":["Acetone swells and softens the polymer network without breaking polymer bonds.","Acetone only removes the top layer of acrylic, requiring manual filing for the rest.","Acetone dissolves the nail plate along with the acrylic enhancement.","Acetone breaks the polymer chains through a chemical reaction."],"c":0,"e":"Acetone is a solvent that swells the polymer network by penetrating between polymer chains, breaking the non-covalent interactions holding them together. The product softens and can be gently scraped off. The polymer chains themselves are not chemically broken."},
{"t":"Nail Enhancements","q":"Over-filing of the natural nail during enhancement preparation can cause:","a":["Improved adhesion from a rougher surface that grips primer better.","Permanent thinning and weakening of the nail plate.","No harm — filing the natural nail before enhancement is always beneficial.","Faster primer absorption into the nail plate for a stronger bond."],"c":1,"e":"Over-filing the natural nail removes nail plate layers permanently. Nail plate thinning: increases sensitivity and flexibility, reduces structural integrity, and increases the risk of onycholysis from product pressure."},
{"t":"Manicure","q":"Residual gel polish from a previous service must be:","a":["Completely removed before the new service begins.","Only removed if it is more than 50% chipped off the nail.","Filed smooth so that fresh gel can be applied on top of it.","Left on, since fresh gel bonds directly to the old cured layer."],"c":0,"e":"Residual gel must be fully removed before a new service. Applying new gel over old creates uneven thickness, poor adhesion, and potential lifting."},
{"t":"Manicure","q":"The purpose of a nail cleaner brush (small stiff brush):","a":["To apply nail primer evenly, its stiff bristles spreading a thin acidic layer.","To spread acrylic powder across the nail plate.","To apply gel product to small areas.","To clean debris from under the free edge and around the nail fold."],"c":3,"e":"Small nail cleaner brushes clean debris from under the free edge and around the nail fold. They may be used dry or with soapy water during nail prep. Single-use is recommended for brushes contacting skin and subungual area."},
{"t":"Safety and Sanitation","q":"Disinfectant solution in a wet sanitizer jar must be changed:","a":["Once per week during the scheduled cleaning, or sooner if left uncovered.","When visibly dirty or per manufacturer instructions.","Only once the jar has run completely empty and needs a full refill.","Monthly regardless of use, as the active ingredients last a month."],"c":1,"e":"Solution must be changed when visibly soiled, turbid, or per manufacturer schedule — daily or more frequently with heavy use. Contaminated solution loses efficacy."},
{"t":"Nail Enhancements","q":"An acrylic nail that is too thin at the stress zone is at risk of:","a":["Stress fracture or breakage from inability to resist flexion.","Excessive heat during wear.","Yellowing from insufficient product depth.","Lifting at the cuticle due to reduced adhesion surface."],"c":0,"e":"The stress zone (zone 2) bears the greatest flexion load. Insufficient product depth at the apex means the enhancement lacks the structural mass to resist bending forces, leading to stress fractures."},
{"t":"Manicure","q":"Clients are advised to apply cuticle oil daily after a manicure because:","a":["Cuticle oil helps nail polish dry faster.","Cuticle oil maintains moisture, preventing brittleness.","Cuticle oil provides UV protection for polish.","Cuticle oil prevents nail growth."],"c":1,"e":"Daily cuticle oil maintains nail plate moisture and flexibility, conditions the periungual skin, and prolongs nail service wear by keeping the skin supple."},
{"t":"Safety and Sanitation","q":"Between clients, the nail technician should change the workstation cushion/pad cover:","a":["Only when visibly soiled.","Once per day at the start of the shift.","After each client.","Only for pedicure services."],"c":2,"e":"Workstation cushions/table covers contact each client's hands or feet. Disposable paper is replaced after each client. Washable covers are replaced with a fresh laundered cover after each client."},
{"t":"Nail Enhancements","q":"Free radical polymerization, the mechanism in acrylic nail systems, involves:","a":["Chain-reaction of free radicals adding monomers until termination.","An acid-base reaction between primer and nail plate.","UV light directly breaking monomer bonds to reform as polymer.","Ionic bonding between monomer and polymer powder particles."],"c":0,"e":"Free radical polymerization: initiator creates free radicals, which react with monomer (initiation), chain propagates as radicals pass between monomers (propagation), until two radicals combine (termination). This entire process occurs in seconds in nail application."},
{"t":"Nail Enhancements","q":"The CIB-standard term for the dip nail system is:","a":["Powder dip.","SNS nails or dip nails.","Chrome powder system.","Acrylic dip system."],"c":0,"e":"The NIC CIB uses the term 'powder dip' (not 'dip nails,' 'SNS,' or 'dip powder'). Terminology locking requires using the CIB-standard term on the licensing examination."},
{"t":"Safety and Sanitation","q":"When a client declines to complete an intake form, the nail technician should:","a":["Decline the service.","Skip consultation and proceed with a standard basic service.","Proceed with service.","Explain its purpose, offer verbal completion, and document responses."],"c":3,"e":"Intake forms serve safety purposes. If a client declines, the technician explains the importance, offers a verbal consultation, and documents the verbal responses. Service safety requires this information regardless of format."},
{"t":"Manicure","q":"A basic manicure includes all of the following EXCEPT:","a":["Cuticle care to gently push back and tidy the eponychium.","Hand massage, a step that boosts circulation in the hands.","Nail tip extension with artificial product.","Nail shaping and filing of the free edge to length."],"c":2,"e":"A basic manicure: polish removal, nail filing/shaping, soaking, cuticle care, massage, and polish application. Nail tip extension is an enhancement service — not a basic manicure component."},
{"t":"Nail Enhancements","q":"Nail tip adhesive (nail glue) is used to:","a":["Apply gel product to the nail plate.","Seal the free edge of finished enhancements.","Disinfect the nail plate before enhancement application.","Bond the plastic nail tip to the natural nail plate."],"c":3,"e":"Nail tip adhesive (cyanoacrylate-based nail glue) bonds the plastic tip to the natural nail. It is applied in a thin coat to the tip's contact area before pressing firmly at a 45-degree angle."},
{"t":"Nail Enhancements","q":"Lifting at the proximal edge of an acrylic enhancement most commonly indicates:","a":["The acrylic powder was expired.","Product was applied too close to or touching the skin/cuticle.","The primer application was insufficient.","The client is not using cuticle oil frequently enough."],"c":1,"e":"Proximal lifting is almost always caused by product placement errors: touching the skin, not allowing primer to fully dry, or incomplete cuticle pushback leaving dead tissue under the enhancement."},
{"t":"Safety and Sanitation","q":"A client with diabetes requires extra infection-control awareness because:","a":["Diabetes hides early infection signs by increasing nail thickness.","Impaired circulation and immune response increase infection risk from minor skin breaks.","Diabetes accelerates nail growth, thickening the plate faster than instruments can file.","Diabetic medication reacts with acrylic monomer."],"c":1,"e":"Diabetes impairs peripheral circulation and immune function. Even minor skin breaks can become serious infections. Gentle technique and prompt referral of any infection signs are essential."},
{"t":"Manicure","q":"Standard number of color coats in a manicure:","a":["One coat for sheer, multiple for opaque only.","Two thin coats.","One thick coat for maximum coverage.","Three or more coats for all colors."],"c":1,"e":"Two thin coats of color is standard. First coat provides initial coverage and adhesion; second builds full opacity. Two thin coats outperform one thick coat in adhesion and wear."},
{"t":"Safety and Sanitation / Manicure","q":"Home care instructions provided to the client after a nail service include:","a":["Cuticle oil, gloves for wet work, warning signs, and next appointment.","Only the price and timing of the next recommended appointment.","Only the timing of the fill or maintenance appointment.","Only the product brand used so the client can purchase at home."],"c":0,"e":"Complete home care education: cuticle oil use, protecting enhancements from water/chemicals (gloves), avoiding using nails as tools, what to report (lifting, infection signs), and scheduling the next maintenance appointment."},
{"t":"Nail Enhancements","q":"The three zones used in zone-method acrylic application are:","a":["Dehydration zone, adhesion zone, and extension zone, worked from base to tip.","Base, mid, and tip, referring to three equal thirds of the nail length from the cuticle.","Free edge (zone 1), stress area/apex (zone 2), cuticle area (zone 3).","Primer zone, application zone, finishing zone."],"c":2,"e":"Zone method: Zone 1 = free edge (thin, defines shape), Zone 2 = stress area/apex (thickest, provides strength), Zone 3 = cuticle area (thinnest, tapers to natural nail). Each zone uses different bead consistency."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
