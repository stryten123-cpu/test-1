<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 6</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Manicure / Nail Enhancements","q":"Home care instructions provided to the client after a nail service include:","a":["Using cuticle oil, wearing gloves for wet work, watching for warning signs, and scheduling the next appointment.","Soaking the nails in hot water every evening.","Removing enhancements at home when they begin growing out.","Avoiding all hand washing for 24 hours."],"c":0,"e":"Good home care includes daily cuticle oil, protection during wet work, awareness of warning signs, and timely maintenance."},{"t":"Nail Enhancements","q":"The three zones used in the zone-method acrylic application are:","a":["Cuticle, sidewall, and hyponychium.","Nail bed, lunula, and matrix.","Free edge, stress area or apex, and cuticle area.","Proximal fold, nail plate, and free edge."],"c":2,"e":"Zone 1 is the free edge, zone 2 is the stress area or apex, and zone 3 is the cuticle area."},{"t":"Nail Enhancements","q":"When completing an acrylic full set, the nail technician applies top coat to:","a":["Only the natural nail.","The entire nail surface, including the free edge.","Only the acrylic near the cuticle.","The underside of the extension only."],"c":1,"e":"Top coat covers the full enhancement and caps the free edge for protection and durability."},{"t":"Safety and Sanitation","q":"For implement disinfection, 70% isopropyl alcohol is considered:","a":["A sterilant suitable for all implements.","A surface disinfectant, not a substitute for an EPA-registered hospital-grade implement disinfectant.","A detergent that removes visible debris only.","A sporicidal solution for porous tools."],"c":1,"e":"Reusable implements require an appropriate EPA-registered hospital-grade disinfectant after cleaning."},{"t":"Pedicure","q":"The pedicure foot soak primarily:","a":["Hardens the toenails before filing.","Disinfects all implements during the service.","Removes every callus without filing.","Softens the skin and nails for easier cuticle care, trimming, and callus reduction."],"c":3,"e":"Soaking softens the feet and toenails so the remaining pedicure steps can be performed more safely and comfortably."},{"t":"Nail Enhancements","q":"After an acrylic enhancement has fully cured, the correct filing sequence uses:","a":["Fine, medium, then coarse abrasives.","Coarse to shape, medium to refine, then fine or a buffer to smooth.","Only a coarse file for every step.","A buffer first, followed by a coarse file."],"c":1,"e":"Progressing from coarse to medium to fine shapes the enhancement efficiently and produces a smooth finish."},{"t":"Safety and Sanitation","q":"Stainless-steel implements are preferred for professional nail services because they are:","a":["Porous and absorb disinfectant quickly.","Disposable after one use.","Nonporous and can be reliably cleaned and disinfected for reuse.","Safe to reuse without cleaning."],"c":2,"e":"Nonporous stainless steel can undergo proper cleaning and disinfection between clients."},{"t":"Safety and Sanitation","q":"The nail technician’s workstation must allow for:","a":["Easy access to supplies, proper waste disposal, and effective infection-control procedures.","Open food and drinks beside the service area.","Storage of clean and used implements together.","Carpeted surfaces beneath all working products."],"c":0,"e":"An organized workstation supports safe service flow, correct waste handling, and prevention of cross-contamination."},{"t":"Manicure","q":"Before applying fresh polish after a hand massage, the nail technician should:","a":["Apply additional massage lotion to the nail plate.","Buff oil into the nail plate.","Cleanse the nail plate to remove oil and lotion.","Soak the nails again in warm water."],"c":2,"e":"Removing oil and lotion allows polish to adhere properly and reduces premature chipping."},{"t":"Safety and Sanitation","q":"Onychomycosis is primarily caused by:","a":["A viral infection.","An allergic reaction to polish.","Dermatophyte fungi such as Trichophyton rubrum.","A bruise beneath the nail plate."],"c":2,"e":"Onychomycosis is a fungal nail infection and should be referred to a medical professional rather than serviced."},{"t":"Nail Enhancements","q":"Builder gel for a nail extension differs from gel polish because builder gel:","a":["Is thinner and provides no structure.","Air-dries without a lamp.","Can only be used as a color coat.","Is thicker, self-leveling, and provides structural strength for an extension."],"c":3,"e":"Builder gel has the viscosity and strength needed to create an apex and support an extension."},{"t":"Manicure / Safety","q":"After removing polish at the start of a manicure, the nail technician should:","a":["Immediately apply base coat.","Begin massage without examining the nails.","File every nail with a coarse abrasive.","Visually inspect each nail before proceeding."],"c":3,"e":"Inspection helps identify conditions, injuries, or signs of infection that may affect whether the service can continue."},{"t":"Nail Enhancements","q":"Natural nail growth creates a gap at the proximal end of an enhancement called the:","a":["Stress zone.","Free-edge zone.","Regrowth or fill zone.","Sidewall zone."],"c":2,"e":"The exposed natural nail near the cuticle is the regrowth area addressed during a fill or rebalance."},{"t":"Blood Spill / Safety","q":"Gloves must be changed during a service when they are:","a":["Torn, contaminated, or when changing tasks creates a cross-contamination risk.","Still intact after contact with contaminated material.","The same color as the previous pair.","Worn for less than one hour."],"c":0,"e":"Damaged or contaminated gloves no longer provide safe protection and must be replaced before continuing."},{"t":"Pedicure / Safety","q":"Foam toe separators used during a pedicure are:","a":["Disinfected and stored for the same client.","Single-use items that are discarded after each client.","Sterilized in an autoclave after use.","Cleaned only when visibly soiled."],"c":1,"e":"Porous foam toe separators cannot be reliably disinfected and must be discarded after one use."},{"t":"Manicure","q":"Nail shape selection during a client consultation is based on:","a":["The technician’s favorite current trend only.","The natural nail shape, nail-bed length, and the client’s lifestyle.","The darkest polish color available.","The client’s age alone."],"c":1,"e":"A suitable shape complements the natural nail while meeting the client’s practical lifestyle needs."},{"t":"Nail Enhancements","q":"After applying builder gel to a nail form for an extension, the product is cured:","a":["For the manufacturer’s specified cure time for each layer.","For exactly 10 seconds regardless of the product.","Only once at the end after all layers are applied.","Immediately for the maximum possible time."],"c":0,"e":"Each layer must be cured according to the product and compatible lamp manufacturer’s directions."},{"t":"Pedicure / Safety and Sanitation","q":"Tinea pedis is caused by:","a":["A parasite burrowing into foot skin.","A virus multiplying between the toes.","Pseudomonas aeruginosa bacteria.","A dermatophyte fungus spread through contaminated surfaces and shared footwear."],"c":3,"e":"Tinea pedis, or athlete’s foot, is a contagious fungal infection and is a contraindication to service on the affected area."},{"t":"Safety and Sanitation","q":"A workstation lamp or UV/LED curing lamp that contacts client skin should be:","a":["Replaced monthly because it cannot be disinfected.","Cleaned only when product buildup is visible.","Covered permanently with the same protective sleeve.","Cleaned and disinfected between clients on all skin-contact surfaces."],"c":3,"e":"Every nonporous surface that contacts a client must be properly cleaned and disinfected between clients."},{"t":"Pedicure","q":"Paraffin treatment on the feet is applied by:","a":["Applying a thick spatula layer that becomes a peel-off mask.","Dipping the feet into warm paraffin several times, then wrapping them in plastic and a towel to retain heat.","Soaking the feet in a paraffin-infused water bath.","Brushing paraffin onto the skin beneath a heat lamp."],"c":1,"e":"Repeated dipping builds insulating wax layers; wrapping retains warmth and supports deep moisturization."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
