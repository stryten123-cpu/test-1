<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 1</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 1</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Manicure","q":"Which nail shape is the most optimal choice for clients who frequently work with computers or on assembly lines?","a":["Square nail shape","Pointed nail shape","Oval nail shape","Round nail shape"],"c":3,"e":"Round nails are less likely to snag or break during frequent typing or assembly work because the free edge has no sharp corners."},
{"t":"Blood Spill / Safety and Sanitation","q":"How must you handle tools that have come into contact with blood after an accident to ensure safety?","a":["Wash thoroughly with water and soap","Use medical alcohol to wipe clean","Use Formalin disinfectant","Use a hospital-grade disinfectant, double-bag, and label as hazardous waste"],"c":3,"e":"Blood-contaminated implements must be treated as biohazardous. Use hospital-grade (tuberculocidal) disinfectant, then double-bag and label as hazardous waste according to universal precautions."},
{"t":"Manicure","q":"Using a nail brush and soaking bowl correctly will effectively support the removal of?","a":["Uneven ridges on the nail surface","Dead skin and excess skin around the nail","Stubborn stains on the nail","Dry nail condition"],"c":1,"e":"Soaking softens the cuticle and surrounding skin; the nail brush then gently removes loosened dead skin and excess cuticle tissue."},
{"t":"Safety and Sanitation","q":"Which product is recommended for the most effective cleaning of the nail table surface?","a":["Specialized disinfectant solution","Regular soapy water","Medical alcohol","Clean water"],"c":0,"e":"A specialized EPA-registered disinfectant is required to properly sanitize and disinfect the nail table between clients."},
{"t":"Safety and Sanitation","q":"Why is it not permitted to use hospital-grade disinfectants for washing hands?","a":["Because they are too expensive","Because they contain strong chemicals that damage living skin tissue","Because they don't kill germs on hands","Because they have a foul odor"],"c":1,"e":"Hospital-grade disinfectants contain strong chemicals designed for hard surfaces and implements, not living skin. They can cause irritation and damage to skin tissue."},
{"t":"Manicure","q":"To effectively remove stains on fingernails, a specialist should use?","a":["Nail polish remover solution","Cuticle oil","Nail whitening cream product","Specialized nail bleach or 6% hydrogen peroxide"],"c":3,"e":"Specialized nail bleach or a dilute (6%) hydrogen peroxide solution is the standard professional method for lifting surface stains from the natural nail."},
{"t":"Manicure","q":"For the nails to look most natural after service, the technician needs to shape the nails to match the characteristics of?","a":["The shape of the fingertips","The overall size of the hand","The natural color of the skin","The health condition of the skin"],"c":0,"e":"Matching the free-edge shape to the natural contour of the fingertip creates the most balanced and natural-looking result."},
{"t":"Pedicure","q":"A foot file (paddle) is used to remove?","a":["Warts on the foot","Hangnails around the nail","Thick skin or calluses","Fungal infections"],"c":2,"e":"A foot file or paddle is designed to gently abrade and reduce thick skin and calluses on the heels and balls of the feet during a pedicure."},
{"t":"Nail Enhancements","q":"When decorating nails with the striping technique, the stripes should be cut away from the skin and free edge by a distance of?","a":["A distance of 1/4 inch","A distance of 1/8 inch","A distance of 1/6 inch","A distance of 1/32 inch"],"c":2,"e":"Leaving approximately 1/6 inch clearance from the skin and free edge prevents the stripe from lifting or contacting the cuticle area."},
{"t":"Nail Enhancements","q":"What preparation steps are mandatory before proceeding with artificial nail services for a client?","a":["Direct communication and consultation with the client","Recording information in the client's file","Cleaning and arranging the workbench neatly","Performing all of the steps above"],"c":3,"e":"Proper preparation includes consultation, documentation, and a clean, organized workstation before any artificial nail service begins."},
{"t":"Nail Enhancements","q":"Before starting acrylic application, what should a technician do to the natural nail surface?","a":["Use cream to soften the skin","Buff to remove the natural shine","Soak the nail in a warm oil basin","Soak hands in soap for about 10 minutes"],"c":1,"e":"Lightly buffing removes the natural oils and shine from the nail plate, creating a better surface for primer and acrylic adhesion."},
{"t":"Manicure","q":"Why do technical documents recommend using a cuticle pusher on a moist nail bed?","a":["To prevent scratching the nail surface","To help the process of increasing blood circulation","To avoid negatively affecting the skin surrounding the nail root","To see the white lunula on the nail surface more clearly"],"c":0,"e":"A moist nail bed and cuticle are softer and more pliable, reducing the risk of scratching or damaging the nail plate with the pusher."},
{"t":"Blood Spill / Safety and Sanitation","q":"When realizing a tool is contaminated with blood, what should the technician do immediately?","a":["Wipe clean with a paper towel","Rinse the tool with clean water","Disinfect with a tuberculocidal solution","Continue using it for the client"],"c":2,"e":"Blood-contaminated tools must be cleaned and then fully immersed in an EPA-registered tuberculocidal disinfectant before any further use or storage."},
{"t":"Safety and Sanitation","q":"What is the minimum strength of Quaternary ammonium solution for effective disinfection?","a":["Ratio 1:1,000 or reaching 1,000 p.p.m","Ratio 1:2,000 or reaching 2,000 p.p.m","Ratio 1:3,000 or reaching 3,000 p.p.m","Ratio 1:4,000 or reaching 4,000 p.p.m"],"c":0,"e":"Most state boards and manufacturers require quaternary ammonium compounds to be mixed to at least 1:1,000 (1,000 ppm) for effective intermediate-level disinfection."},
{"t":"Safety and Sanitation","q":"In the nail industry, how is 'Sanitation' defined?","a":["A science of health and life","Keeping tools clean","Room cleaning activities","A study of biology"],"c":0,"e":"Sanitation is broadly defined as the science of preserving health and preventing disease through cleanliness and hygienic practices."},
{"t":"Nail Enhancements","q":"Which type of artificial nail is typically removed by soaking in Acetone solution?","a":["Fabric wraps","Acrylics","Nail tips","Hard gel nails"],"c":1,"e":"Acrylic (EMA-based) enhancements dissolve in acetone. Hard gel does not and must be filed off; fabric wraps are usually soaked or gently filed."},
{"t":"Manicure","q":"Lanolin (sheep wool fat) is commonly found in which of the following cosmetics?","a":["Nail and cuticle conditioning creams","Quats disinfectant compound","Nail polish remover","Nail bonding agent (Primer)"],"c":0,"e":"Lanolin is an excellent emollient and is frequently used in cuticle oils, creams, and conditioning products to soften and moisturize the skin around the nails."},
{"t":"Manicure","q":"Cuticle nippers are used most safely when?","a":["Cutting off the entire cuticle layer","Only trimming away excess hangnails and dead skin","Shortening the natural nail","Using them to pry off artificial nails"],"c":1,"e":"Safe use of cuticle nippers is limited to carefully trimming only excess hangnails and already-detached dead skin. Cutting living tissue increases infection risk."},
{"t":"Manicure","q":"In the nail painting procedure, the purpose of the base coat is to?","a":["Make the polish color shinier","Prevent the nail from being stained by the main color polish","Help the color polish dry faster","Hide scratches on the nail"],"c":1,"e":"Base coat creates a protective barrier that prevents highly pigmented color polishes from staining the natural nail plate."},
{"t":"Safety and Sanitation","q":"Which of the following conditions is advised NOT to be served at a nail salon?","a":["Callused areas","Healed scars","Open sores or lesions","Wavy nail ridges"],"c":2,"e":"Open sores or lesions are a clear contraindication. Performing services on broken skin risks blood exposure and transmission of infection to both client and technician."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
