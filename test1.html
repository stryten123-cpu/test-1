<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 1</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice — Test 1</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[
{"t":"Safety and Sanitation","q":"Porous implements like nail files must be:","a":["Soaked in a phenolic disinfectant for 30 minutes, then rinsed and reused on the next client.","Sterilized in an autoclave after each client.","Wiped with a 70% alcohol pad between clients, since alcohol soaks into the grit to kill germs.","Used once per client then discarded or assigned exclusively to that client."],"c":3,"e":"Porous surfaces harbor organisms in microscopic pits that disinfectants cannot reach. Files and buffers are single-use items — cannot be reliably disinfected for multi-client use."},
{"t":"Nail Enhancements","q":"Product lifting at the nail plate is most commonly caused by:","a":["Applying too thin a product layer in zone 1.","Over-filing, creating a rough surface that traps air.","Inadequate nail preparation.","Using too much primer, which prevents adhesion."],"c":2,"e":"Lifting results from adhesion failure — most often from oil, moisture, cuticle residue, or product residue on the nail plate that prevents the enhancement from bonding. Thorough dehydration and cleansing before application is the primary prevention."},
{"t":"Safety and Sanitation","q":"A client who receives regular acrylics mentions she has been experiencing itching around her nails between appointments. The nail technician should:","a":["Apply extra cuticle oil at each visit to reduce the itching.","Note the symptom, ask about new products used, and discuss whether she may be developing a sensitivity.","Reassure her this is normal — itching is common with acrylics.","Switch to a different acrylic brand, since a fresh monomer clears any developing allergy at once."],"c":1,"e":"Periungual itching between appointments can signal developing sensitization to acrylate components. Early recognition and discussion — possibly referral for patch testing — can prevent progression to severe allergic contact dermatitis."},
{"t":"Nail Enhancements","q":"Before using an electric file on a new client, the nail technician should:","a":["Proceed immediately.","Have the client sign a liability waiver specific to electric file services.","Perform the service at the lowest possible speed regardless of application.","Explain process, check vibration comfort, assess nail, and note prior sensitivity."],"c":3,"e":"Electric file consultation: explain the process, assess client comfort with sensation, evaluate nail condition (thin/sensitive nails require extra caution), and note any previous adverse reactions to electric file use."},
{"t":"Blood Spill","q":"The correct procedure when a client's nail bleeds during cuticle work is:","a":["Stop work, apply styptic, cover wound, decontaminate blood-contacted items.","Inform the client and reschedule the entire service.","Continue the service.","Apply nail product over the bleeding area to seal it."],"c":0,"e":"Any bleeding triggers blood-exposure protocol: stop work on that digit, apply styptic, cover the wound. All implements and surfaces contacting blood require decontamination. Service continues on other digits."},
{"t":"Pedicure","q":"A client with peripheral arterial disease (PAD) in her legs should be assessed before pedicure because:","a":["PAD causes increased callus formation requiring more aggressive reduction.","Poor arterial flow impairs wound healing, so any skin break is a serious risk.","PAD contraindicates all nail services.","PAD increases the risk of ingrown toenails."],"c":1,"e":"PAD severely impairs blood flow to the lower leg and feet. Even minor skin breaks can become serious non-healing wounds. Extremely gentle technique, no skin breaks, and referral for any wound are required."},
{"t":"Nail Enhancements","q":"Acrylic product that floods onto the skin during application should be:","a":["Removed immediately with a dry brush while wet.","Left to cure and filed away after hardening.","Covered with more product to blend it in.","Dissolved with acetone before it cures."],"c":0,"e":"Wet product on skin must be removed immediately using a dry brush or orangewood stick to lift it cleanly away. Once cured, product bonded to skin causes: pain during removal, skin damage, and almost certain lifting."},
{"t":"Safety and Sanitation","q":"A client should be advised to return for professional evaluation if they observe:","a":["Any change in nail growth rate between appointments.","Only slight edge lifting.","Green discoloration, marked lifting, pain, swelling, redness.","Normal nail growth creating a visible regrowth line."],"c":2,"e":"Warning signs requiring professional follow-up: green discoloration (Pseudomonas), significant or unexpected lifting, pain, swelling, or redness at the nail fold. These indicate infection or structural problems requiring prompt attention."},
{"t":"Nail Enhancements","q":"The nail technician picks up an acrylic bead by:","a":["Loading the brush with powder first, then adding monomer drops on top.","Dipping the brush in monomer, then touching it to the powder to draw up a bead.","Mixing monomer and powder on a palette with a spatula.","Dipping the dry brush directly into the powder."],"c":1,"e":"Bead pickup: dip the brush in monomer, wipe excess on the container rim, then touch the wet brush tip lightly to the powder surface. The liquid draws up powder creating a workable bead. Bead size and consistency are controlled by brush saturation."},
{"t":"Manicure","q":"Proper polish application technique starts:","a":["1–2 mm away from the cuticle, sweeping toward it without touching skin, then down to the free edge.","At the cuticle, pushing the brush into the fold so pigment seeps beneath the eponychium.","At the free edge working toward the cuticle.","Directly from the bottle without wiping excess."],"c":0,"e":"Proper application: place brush 1–2 mm from cuticle, press to fan bristles, sweep toward cuticle (without touching skin) and down to free edge. This prevents flooding the cuticle area."},
{"t":"Safety and Sanitation","q":"EPA registration of a disinfectant confirms:","a":["It is safe for direct contact with skin and cuticle tissue during application.","It is the most cost-effective option among the disinfectants that were tested.","Its stated efficacy claims have been reviewed and approved.","It can sterilize as well as disinfect, destroying all bacterial spores on tools."],"c":2,"e":"EPA registration confirms the agency reviewed and accepted the product's efficacy claims (bactericidal, virucidal, fungicidal). It does not indicate skin safety or sterilization capability."},
{"t":"Nail Enhancements","q":"The difference between acrylic (L&P) and UV gel nail systems is primarily:","a":["Acrylics use EMA monomer while gels use MMA — making gels safer.","Acrylics cure by chemical initiation; UV gels need UV/LED light to cure.","Acrylics require UV curing while gels self-cure through chemical reaction.","UV gels are always harder than acrylics and never removable with acetone."],"c":1,"e":"The fundamental difference is the curing mechanism. L&P (acrylic) uses chemical initiation (benzoyl peroxide/amine redox). UV/LED gel uses photo-initiators activated by light. This distinction affects removal, hardness, and application technique."},
{"t":"Nail Enhancements","q":"Hard gel nail enhancements differ from soft/soak-off gel in that hard gel:","a":["Is always thicker than soft gel.","Has a denser cross-linked polymer network that acetone cannot penetrate.","Cures faster than soft gel and comes in more colors because of its heavier pigment load.","Requires a stronger UV lamp because its denser pigment blocks light at normal lamp wattage."],"c":1,"e":"Hard gel's dense cross-linking resists acetone penetration. Removal requires filing off the bulk of the product down to a thin layer over the natural nail, then carefully buffing the remainder. Acetone soaking has no effect."},
{"t":"Manicure","q":"Nails are filed during a manicure:","a":["At any point","After the base coat, since the hardened coating protects the plate from cracks.","After soaking, since water-swollen nail plates file more smoothly and evenly.","Before soaking — wet nails split more easily during filing."],"c":3,"e":"Nails are filed before soaking while dry and firm. Wet, hydrated nail plates are softer and more prone to splitting and delamination when filed. File dry, then soak."},
{"t":"Nail Enhancements","q":"The RPM (rotations per minute) setting on an electric file should be:","a":["Adjusted to the application — low for nails, high for removal.","Selected based on client preference for noise level.","Always at maximum for most efficient service.","Fixed at a single speed."],"c":0,"e":"Lower RPMs (5,000–15,000) for natural nails and cuticle work (reduces heat and injury risk); higher RPMs (15,000–35,000) for product removal on enhancements. Inappropriate speed for the application risks heat damage and injury."},
{"t":"Safety and Sanitation","q":"The primary route of pathogen transmission in a nail salon is:","a":["Airborne droplets from coughing clients","Direct contact with contaminated implements, surfaces, or products.","Ingestion of improperly stored nail products.","Indirect contact through climate control systems that spread live pathogens."],"c":1,"e":"Most nail salon infections spread via direct contact with contaminated files, nippers, or surfaces. Airborne transmission is a secondary concern for chemical vapors, not pathogens."},
{"t":"Nail Enhancements","q":"The two-component acrylic nail system consists of:","a":["Two separate UV lamps for dual curing","A gel base and an acrylic powder mixed together.","Two different primers applied in sequence, one etching and one bonding the powder.","Liquid monomer (EMA) and powdered polymer (PMMA) that chemically react when mixed."],"c":3,"e":"Traditional acrylic uses liquid EMA monomer and PMMA polymer powder. Mixing initiates free-radical polymerization, hardening the product. No UV lamp required — chemical reaction provides cure."},
{"t":"Manicure","q":"The correct first step in a basic manicure is:","a":["Removing old nail polish.","Soaking the nails to soften the plate first.","Applying a smooth base coat first of all.","Filing to shape before removing old polish."],"c":0,"e":"Old polish is removed first so the technician can assess the natural nail plate, identify any conditions, and proceed with preparation. Filing before polish removal risks shaping through product residue."},
{"t":"Safety and Sanitation","q":"Nail supplies and products should be labeled in English because:","a":["State board practical exam requirements specify English labeling for supply identification.","Most nail product manufacturers are US-based and use English.","It improves the aesthetics of the workstation setup.","OSHA's Hazard Communication Standard requires containers labeled in a language employees can read."],"c":3,"e":"OSHA HazCom requires chemical containers to be labeled for hazard identification. For US workplaces, English labels ensure all employees can read hazard information. Custom containers must maintain proper labeling."},
{"t":"Safety and Sanitation","q":"Bacteria are classified as pathogens when they:","a":["Remain dormant within a sealed, sterilized environment.","Are found on intact skin without causing symptoms.","Perform beneficial functions such as decomposition.","Cause infection or disease in a host organism."],"c":3,"e":"Pathogenic bacteria cause disease. Non-pathogenic bacteria are harmless or beneficial. Only pathogenic organisms require active infection-control strategies in the salon."}
];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
