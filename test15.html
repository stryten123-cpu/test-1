<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 15</title>
<style>
:root{--ink:#241b1a;--rose:#b51f46;--pink:#f8dce4;--green:#2f6b46;--green-bg:#e5f3e9;--red:#a21f36;--red-bg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:#fff;font:23px Georgia,serif}.test,.counter{font-size:14px;color:#756a66;font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:width .25s}.card{background:#fffdfa;border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px #3f251e24;padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--pink);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(21px,2.7vw,31px)/1.28 Georgia,serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid #eadfda;border-radius:16px;background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-size:16px;line-height:1.42}.answer:not(:disabled):hover{border-color:#c9aaa2;background:#fffaf7}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--green-bg)}.answer.correct .letter{background:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--red-bg)}.answer.wrong .letter{background:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.good{background:var(--green-bg);border-color:var(--green)}.bad{background:var(--red-bg);border-color:var(--red)}.controls{margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer;font:inherit}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center;padding:60px}.score{font:800 76px Georgia,serif;color:var(--rose)}@media(max-width:620px){.top{align-items:flex-start;flex-wrap:wrap}.counter{margin-left:auto}.question{font-size:23px}.answer{font-size:15px}.controls .btn{padding:12px 15px}}
</style>
<main class="shell">
  <div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><span class="test">Test 15</span><span id="counter" class="counter"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
  <section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="result-title"></h1><p id="result-text"></p><button id="restart" class="btn primary">Take it again</button></section>
</main>
<script id="question-data" type="application/json">
[
{"topic":"Manicure","question":"The coffin/ballerina nail shape has:","choices":["An elongated pointed free edge.","A completely round free edge","Tapered sides narrowing toward the free edge with a flat, squared-off tip.","A square shape with no corner rounding and perfectly straight, parallel side walls."],"answer":2,"rationale":"Coffin/ballerina nails taper on the sides narrowing toward the free edge, with a flat, blunt squared-off tip — resembling a coffin or ballet pointe shoe."},
{"topic":"Safety and Sanitation","question":"LED curing lamps compared to UV lamps:","choices":["Cure compatible formulas faster and emit less total UV radiation.","Are more expensive and produce inferior gel adhesion.","Emit more radiation requiring greater eye protection.","Are suitable for all gel formulations without verification."],"answer":0,"rationale":"LED lamps use narrow-wavelength LEDs for rapid curing. They emit less total UV radiation than broad-spectrum UV lamps. LED compatibility must be verified per product — not all gel systems are LED-curable."},
{"topic":"Nail Enhancements","question":"After acrylic removal, the natural nail plate may appear:","choices":["Temporarily thin, dehydrated, and slightly sensitive from the soaking process.","Thicker and noticeably stronger, thanks to a conditioning effect left behind by the monomer.","Permanently damaged and unusable for future enhancement.","Perfectly normal and unchanged, because acetone evaporates without affecting the natural nail."],"answer":0,"rationale":"Post-removal nail appearance: acetone dehydrates the nail plate temporarily, and repeated soaking can cause surface dehydration. Cuticle oil and moisturizer help the plate recover. True nail damage from removal itself indicates improper technique."},
{"topic":"Manicure","question":"Almond nail shape is characterized by:","choices":["A square shape with very rounded corners that taper toward a flat tip.","Identical to stiletto but less pointed, with the same tapered sidewalls.","Slim on the sides with a wide apex and rounded peak at the tip.","Wide flat shape with angled corners."],"answer":2,"rationale":"Almond nails are slender on the sides, widest at the apex, narrowing to a rounded peak. The shape elongates the finger visually while being more practical than stiletto."},
{"topic":"Blood Spill","question":"Work practice controls reducing blood-exposure risk include:","choices":["Using PPE instead of proper technique.","Washing implements only when visible blood is present, since clear residue carries no risk.","Never recapping sharps; disposing in sharps containers immediately after use.","Performing cuticle work as rapidly as possible to minimize the technician's exposure time."],"answer":2,"rationale":"Work practice controls are behavioral: safe sharps handling (no recapping, immediate disposal), proper handwashing, using single-use items. They reduce exposure by changing how tasks are performed."},
{"topic":"Nail Enhancements","question":"After adhering a nail tip, the contact zone is blended using:","choices":["A file or e-file to reduce thickness at the tip/nail junction.","UV gel to fill and seal the junction line.","Acetone applied at the seam to dissolve and blend the tip edge.","Additional adhesive applied over the seam."],"answer":0,"rationale":"Blending: the tip's contact zone step (raised edge) is filed smooth using a medium-grit file or electric file, reducing the thickness until the transition from natural nail to tip is imperceptible. This must be smooth before overlay application."},
{"topic":"Manicure","question":"Gel polish on nail biters can be effective because:","choices":["Gel can be applied to extremely short nails without enhancement.","Gel contains bitter agents discouraging biting.","Gel is fragile on nail biters and fails quickly.","Harder surface resists biting, and the investment discourages the habit."],"answer":3,"rationale":"Gel polish on nail biters: the harder cured surface resists biting, creates psychological investment in the nails, and the thickness adds a tactile reminder that may reduce habitual biting."},
{"topic":"Safety and Sanitation","question":"Prolonged electric file use can contribute to:","choices":["Hand-arm vibration syndrome (HAVS) over time.","Acute hand injury from electric current exposure.","Carpal tunnel syndrome from pinch grip alone, not from vibration.","No occupational health concerns of any kind for the technician."],"answer":0,"rationale":"Prolonged vibrating-tool use (electric files) contributes to HAVS — affecting circulation, sensation, and strength in hands and arms. Proper technique and exposure limits reduce risk."},
{"topic":"Nail Enhancements","question":"Hard gel enhancements cannot be removed with acetone soaking because:","choices":["State boards prohibit acetone removal of hard gel, requiring it to be filed off instead.","Hard gel is too valuable to dissolve with acetone.","Hard gel dissolves far faster in acetone than soft gel, so soaking would ruin the natural nail.","Hard gel's dense cross-linked polymer network prevents acetone penetration."],"answer":3,"rationale":"The dense cross-linking in hard gel creates a solvent-resistant network. Acetone can penetrate soft (soak-off) gel's less-dense network, but hard gel's cross-link density prevents this, requiring mechanical removal (filing)."},
{"topic":"Pedicure","question":"After a pedicure, clients are advised to apply foot cream daily because:","choices":["Daily foot cream hardens calluses making future pedicures easier.","Foot cream makes nail polish last longer.","Foot cream prevents fungal infections","Maintains softness, prevents fissures, and prolongs service benefits."],"answer":3,"rationale":"Daily moisturization maintains the softness achieved during pedicure, prevents hard callus rebuilding, reduces fissure formation, and keeps feet in better condition between services."},
{"topic":"Nail Enhancements","question":"The nail tip is cut to rough length before overlay application to:","choices":["Prevent the tip from bending during overlay application.","Prevent the UV lamp from curing the adhesive before overlay is applied.","Allow the adhesive to cure at the correct nail length.","Reduce the tip near final length, making overlay application more manageable."],"answer":3,"rationale":"Tips are cut to approximate length after bonding — close to but slightly longer than the final desired length. This reduces the amount of overlay product needed to shape the extension and makes handling the extended nail easier."},
{"topic":"Safety and Sanitation","question":"An SDS contains how many standardized sections per OSHA GHS requirements?","choices":["8","24","16.","It varies."],"answer":2,"rationale":"OSHA's GHS-aligned Hazard Communication Standard requires 16 standardized sections in all SDS. This standardization lets users find information in consistent locations across all products."},
{"topic":"Pedicure","question":"Extremely thick fissured heels during pedicure consultation:","choices":["Paraffin only.","Service refused until fissures heal.","Super glue applied to seal fissures before pedicure","Gentle callus reduction, heel balm, home care education."],"answer":3,"rationale":"Thick fissured heels: gentle callus reduction removes hard fissure edges, healing heel balm is applied, and home care education provided. Deep bleeding fissures may need medical referral."},
{"topic":"Nail Enhancements","question":"Household cleaning chemicals may affect acrylic enhancements by:","choices":["Having no effect — cured acrylic is completely inert.","Yellowing, softening slightly, or degrading the polymer surface over time.","Making the enhancement stronger through chemical cross-linking","Improving adhesion by etching the acrylic so new product grips the roughened surface."],"answer":1,"rationale":"Household chemicals (bleach, solvents, disinfectants) can yellow or surface-degrade acrylic. Clients should wear gloves during chemical cleaning to protect their enhancements."},
{"topic":"Safety and Sanitation","question":"To reduce neck strain during nail services, the technician should:","choices":["Tilt neck forward 45 degrees to see the work.","Position work at a height allowing neutral cervical spine with minimal forward head posture.","Rotating the head in full circles between each nail to keep the cervical muscles loose and stretched.","Wear a cervical collar during long service days."],"answer":1,"rationale":"Forward head posture significantly increases cervical load. Raising the work surface or using an arm rest to bring work closer to eye level reduces this strain."},
{"topic":"Manicure","question":"Stiletto nail shape requires:","choices":["Short nail beds to give the shape proper balance and support.","A special filing tool not used for other shapes.","Strong, longer nails or enhancement product.","Only strong natural nails with no enhancement product."],"answer":2,"rationale":"Stiletto comes to a sharp point — the most structurally weak shape. Natural nails rarely maintain this without breaking; typically maintained with acrylic or gel enhancement."},
{"topic":"Nail Enhancements","question":"Green discoloration under a nail enhancement is caused by:","choices":["Normal moisture buildup under the enhancement, harmless and self-clearing.","A chemical reaction between the enhancement product and nail plate.","Pseudomonas aeruginosa — a bacterial infection, not mold.","A mold (fungal) infection between the enhancement and nail plate."],"answer":2,"rationale":"'Greenies' are always Pseudomonas aeruginosa bacteria — not mold. This is one of the most commonly tested NIC exam misconceptions. Pseudomonas produces green-blue pigment (pyocyanin) and thrives in the moist warm pocket created by a lifting enhancement."},
{"topic":"Manicure","question":"Squoval is popular because:","choices":["It is the fastest shape to file.","It provides the most surface area for nail art of any nail shape available.","It is the only shape suitable for short nail beds and thin, weak nails.","It combines the strength of square with the softness of oval."],"answer":3,"rationale":"Squoval takes square's structural benefits and softens the corners slightly. This reduces the tendency of pure-square corners to catch and break."},
{"topic":"Safety and Sanitation","question":"Section 2 of an SDS contains:","choices":["Emergency contact information.","Physical and chemical properties, listing the product's boiling point, pH, and flash point.","First aid measures.","Hazard identification including signal words, pictograms, and precautionary statements."],"answer":3,"rationale":"Section 2 (Hazard Identification) lists the hazard classification, GHS signal word (Danger/Warning), hazard pictograms, and hazard and precautionary statements."},
{"topic":"Nail Enhancements","question":"Applying too much nail tip adhesive (nail glue) during tip application causes:","choices":["Stronger adhesion from extra adhesive.","Seepage onto skin, causing bonding and allergic reaction.","Easier tip removal during future appointments.","Faster adhesive cure time."],"answer":1,"rationale":"Excess cyanoacrylate adhesive: migrates under the natural nail (bonding to the nail bed causing pain and potential nail damage) and onto surrounding skin (causing skin bonding and allergic reaction risk). Apply thin coats only."}
]
</script>
<script>
const questions=JSON.parse(document.getElementById('question-data').textContent),q=document.getElementById('question'),topic=document.getElementById('topic'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next'),quiz=document.getElementById('quiz'),result=document.getElementById('result');let current=0,chosen=Array(questions.length).fill(null);
function render(){const item=questions[current],pick=chosen[current];topic.textContent=item.topic;q.textContent=item.question;counter.textContent=`Question ${current+1} of ${questions.length}`;bar.style.width=`${((current+1)/questions.length)*100}%`;answers.replaceChildren();item.choices.forEach((text,index)=>{const button=document.createElement('button'),letter=document.createElement('span'),label=document.createElement('span');button.className='answer';button.disabled=pick!==null;letter.className='letter';letter.textContent='ABCD'[index];label.textContent=text;button.append(letter,label);if(pick!==null){if(index===item.answer)button.classList.add('correct');if(index===pick&&pick!==item.answer)button.classList.add('wrong')}button.addEventListener('click',()=>choose(index));answers.append(button)});if(pick===null){feedback.className='feedback';feedback.textContent='';next.disabled=true}else{const right=pick===item.answer;feedback.className=`feedback show ${right?'good':'bad'}`;feedback.innerHTML=`<strong>${right?'Correct':'Incorrect'} · Correct answer: ${'ABCD'[item.answer]}</strong><br>${item.rationale}`;next.disabled=false}prev.disabled=current===0;next.textContent=current===questions.length-1?'Finish':'Next →'}
function choose(index){chosen[current]=index;render()}
prev.addEventListener('click',()=>{if(current>0){current--;render()}});next.addEventListener('click',()=>{if(chosen[current]===null)return;if(current<questions.length-1){current++;render()}else showResult()});
function showResult(){const correct=chosen.reduce((total,pick,index)=>total+(pick===questions[index].answer),0);document.getElementById('score').textContent=`${correct}/${questions.length}`;document.getElementById('result-title').textContent='Practice Test 15 complete';document.getElementById('result-text').textContent=correct>=16?'Excellent work — keep reviewing any missed rationales.':'Review the missed rationales, then take the test again to strengthen your score.';quiz.classList.add('hidden');result.classList.remove('hidden');bar.style.width='100%';counter.textContent='Complete'}
document.getElementById('restart').addEventListener('click',()=>{current=0;chosen=Array(questions.length).fill(null);result.classList.add('hidden');quiz.classList.remove('hidden');render()});render();
</script>
</html>
