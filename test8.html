<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Technology Practice Test 8</title>
<style>
:root{--ink:#241b1a;--muted:#756a66;--paper:#fffdfa;--rose:#b51f46;--rose2:#f8dce4;--line:#eadfda;--green:#2f6b46;--greenbg:#e5f3e9;--red:#a21f36;--redbg:#fde8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf4ef,#f4e7e5 50%,#efe8f2);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--rose);color:white;font:23px Georgia}.counter{font-size:14px;color:var(--muted);font-weight:700}.progress{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:linear-gradient(90deg,var(--rose),#db6785);transition:.25s}.card{background:rgba(255,253,250,.96);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 70px rgba(63,37,30,.14);padding:clamp(24px,5vw,48px)}.topic{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--rose2);color:#8e1939;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.question{font:400 clamp(18px,2.4vw,24px)/1.3 Georgia,"Times New Roman",serif;margin:22px 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:flex-start;text-align:left;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cb8b9c}.letter{flex:0 0 34px;height:34px;border:1px solid #ddcfca;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#fcf8f6}.answer.correct{border-color:#7dae8d;background:var(--greenbg)}.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}.answer.wrong{border-color:#d8798a;background:var(--redbg)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}.feedback{display:none;margin-top:20px;padding:18px 20px;border-left:4px solid;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--greenbg);border-color:var(--green)}.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback strong{display:block;font-size:17px;margin-bottom:4px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#eee5e1}.btn:disabled{opacity:.42}.result{text-align:center;padding:clamp(34px,7vw,74px)}.result h1{font:clamp(38px,6vw,62px)/1.04 Georgia;margin:15px 0}.result p{color:var(--muted);font-size:18px;line-height:1.6}.score{font:800 76px Georgia;color:var(--rose);margin:18px 0 4px}.hidden{display:none!important}@media(max-width:640px){.shell{padding-top:18px}.card{border-radius:20px;padding:21px}.answer{padding:14px}.btn{flex:1}.brand span:last-child{display:none}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand"><span class="mark">N</span><span>Nail Technology Practice</span></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div>
<section id="quiz" class="card"><span id="topic" class="topic"></span><h1 id="question" class="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn primary" disabled>Next →</button></div></section>
<section id="result" class="card result hidden"><span class="topic">Complete</span><div id="score" class="score"></div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="btn primary" id="restart">Take it again</button></section></main>
<script>
const questions=[{"t":"Safety and Sanitation","q":"The nail technician washes their hands after completing a nail service to:","a":["Remove only visible product dust.","Replace the need to disinfect implements.","Prepare the hands for applying lotion.","Protect against organisms transferred during the service and prevent transmission to the next client."],"c":3,"e":"Handwashing removes organisms acquired during the service and helps prevent cross-contamination between clients."},{"t":"Blood Spill / Safety","q":"Used razor blades must be disposed of in:","a":["A puncture-resistant sharps container.","A regular wastebasket wrapped in tissue.","A closed laundry bag.","The salon recycling container."],"c":0,"e":"Used blades are sharps and must go into a labeled, puncture-resistant sharps container."},{"t":"Nail Enhancements","q":"The self-leveling property of builder gel means:","a":["It cures without a UV or LED lamp.","It removes itself when soaked in water.","It automatically matches the natural nail color.","It flows slightly after application to smooth and level its surface."],"c":3,"e":"Self-leveling gel moves slightly before curing, helping the technician create an even, smooth surface."},{"t":"Manicure","q":"Cuticle oil applied after nail services serves to:","a":["Harden enhancement product instantly.","Moisturize the nail and surrounding skin and improve the finished appearance.","Disinfect the nail plate.","Remove the inhibition layer from gel."],"c":1,"e":"Cuticle oil conditions the nail and surrounding skin while giving the completed service a hydrated, polished appearance."},{"t":"Manicure","q":"Nails should be filed in which direction?","a":["In one direction, working from the corner toward the center.","Rapidly back and forth across the free edge.","From the center outward toward both corners.","Vertically from the cuticle to the free edge."],"c":0,"e":"Filing from each side toward the center in controlled strokes helps prevent splitting and weakening of the free edge."},{"t":"Nail Enhancements","q":"The exothermic heat produced during acrylic polymerization:","a":["Always means the product is defective.","Is a normal reaction byproduct whose intensity depends on factors such as monomer quantity and temperature.","Occurs only when acrylic is applied too dry.","Shows that the enhancement has been exposed to water."],"c":1,"e":"Acrylic polymerization releases heat normally; product amount, mix ratio, and ambient temperature can affect how much heat is felt."},{"t":"Blood Spill / Safety","q":"Sterilization is required rather than disinfection for implements that:","a":["Touch only intact skin.","Contact blood or penetrate tissue, such as lancets.","Are made of plastic.","Are used only to apply polish."],"c":1,"e":"Items that penetrate tissue or contact blood require the highest decontamination level; in salons, these items are commonly single-use and discarded."},{"t":"Safety and Sanitation","q":"The workstation disinfectant used between clients must be:","a":["A pleasant-smelling household cleaner.","EPA-registered, mixed at the correct dilution, and left wet for the full label contact time.","Pure acetone applied for 30 seconds.","Any soap labeled antibacterial."],"c":1,"e":"Effective disinfection requires an appropriate EPA-registered product used exactly according to its dilution and contact-time directions."},{"t":"Pedicure / Manicure","q":"The primary difference between a pedicure and a manicure is:","a":["A pedicure never includes polish.","A manicure includes massage but a pedicure does not.","A pedicure uses only disposable implements.","A pedicure focuses on feet and toenails and may include lower-leg massage and callus reduction."],"c":3,"e":"Pedicures address the feet and toenails and commonly include foot care, callus reduction, and lower-leg massage."},{"t":"Nail Enhancements","q":"Gel enhancement curing that produces an excessive heat spike may indicate:","a":["The nail was filed in one direction.","The client used cuticle oil the previous day.","The gel color is too light.","The product was applied too thickly or the curing lamp is too powerful or incompatible."],"c":3,"e":"A thick layer can polymerize rapidly and generate intense heat; an incompatible or overly powerful lamp can make the reaction worse."},{"t":"Safety and Sanitation","q":"A tuberculocidal disinfectant indicates:","a":["A product intended only for household floors.","A low-level cleaner that kills fungi only.","A product that sterilizes every implement.","Broad-spectrum, intermediate-level disinfection effective against Mycobacterium tuberculosis and many other pathogens."],"c":3,"e":"Tuberculocidal claims indicate intermediate-level, broad-spectrum effectiveness, but the product is still a disinfectant rather than a sterilant."},{"t":"Manicure","q":"The nail plate surface is buffed using:","a":["A metal cuticle pusher.","Coarse callus-removal blades.","Cotton soaked in acetone only.","Buffing blocks or files of progressively finer grit."],"c":3,"e":"Progressively finer abrasives smooth the nail surface mechanically while limiting unnecessary removal of nail-plate layers."},{"t":"Pedicure","q":"Toenail filing technique differs from fingernail filing in that toenails:","a":["Should always be shaped to a sharp point.","Must be filed below the end of the toe.","Are filed straight across more strictly because rounded corners can encourage ingrown nails.","Should never be filed."],"c":2,"e":"Keeping toenails straight across and avoiding deeply rounded corners helps reduce the risk of ingrown nails."},{"t":"Nail Enhancements","q":"The polygel (acrygel or hybrid) enhancement system is characterized by:","a":["A runny lacquer that air-dries.","A powder used without resin or activator.","A liquid-and-powder system that hardens immediately.","A putty-like product sculpted before UV or LED curing, combining acrylic workability with gel curing."],"c":3,"e":"Polygel stays workable while being shaped and then hardens only when cured in the appropriate lamp."},{"t":"Blood Spill / Safety","q":"Hepatitis B virus (HBV) is especially concerning in nail salons because:","a":["It is destroyed immediately by ordinary soap.","It is transmitted only through blood transfusions.","It is primarily spread by insects.","It can survive on contaminated surfaces for up to seven days and can spread through blood contact."],"c":3,"e":"HBV can remain infectious on surfaces for days, so correct blood-spill procedures, cleaning, and disinfection are essential."},{"t":"Pedicure","q":"Calluses should not be completely removed because:","a":["Calluses are always aesthetically desirable.","Complete removal takes too long.","Calluses provide natural protection against pressure and friction.","Only a physician may touch a callus."],"c":2,"e":"A callus is protective thickened skin. It may be reduced carefully for comfort, but removing it completely eliminates natural protection."},{"t":"Nail Enhancements","q":"A nail tip applied with a gap at the side because it does not fully cover the nail plate width will:","a":["Be sealed adequately by the overlay product.","Lift at the uncovered side.","Provide extra flexibility.","Create a more natural appearance."],"c":1,"e":"A tip that is too narrow lacks adhesive contact at the side, creating a weak point that can lift or break."},{"t":"Pedicure","q":"Toe separators used during polish application:","a":["Provide stability for every foot-care step.","Assist with callus reduction.","Stretch the joints to speed polish drying.","Keep toes apart so fresh polish does not transfer between adjacent toes."],"c":3,"e":"Toe separators prevent neighboring toes from touching and smearing fresh polish during application and drying."},{"t":"Nail Enhancements","q":"Powder dip products are classified as:","a":["A gel polish requiring a UV lamp.","A hybrid system between acrylic and gel.","An air-dry lacquer with added powder.","A cyanoacrylate-based coating system."],"c":3,"e":"Dip systems use cyanoacrylate resin that polymerizes around the powder particles when the activator is applied."},{"t":"Safety and Sanitation / Pedicure","q":"A pedicure basin must be disinfected:","a":["Once daily at the end of business.","Between every client using an EPA-registered disinfectant for the full label contact time.","Weekly during deep cleaning.","Only when visible debris is present."],"c":1,"e":"Pedicure basins must be cleaned and disinfected after every client with an appropriate EPA-registered product used for its full contact time."}];
let index=0,score=0,responses=Array(questions.length).fill(null);const $=id=>document.getElementById(id),letters=["A","B","C","D"];
function render(){const x=questions[index];$("counter").textContent=`Question ${index+1} of ${questions.length}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;$("topic").textContent=x.t;$("question").textContent=x.q;$("answers").innerHTML="";x.a.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${letters[i]}</span><span>${v}</span>`;b.onclick=()=>choose(i);$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";$("prev").disabled=index===0;$("next").disabled=responses[index]===null;$("next").textContent=index===questions.length-1?"See results →":"Next →";if(responses[index]!==null)paint(responses[index])}
function choose(n){if(responses[index]!==null)return;responses[index]=n;if(n===questions[index].c)score++;paint(n)}function paint(n){const x=questions[index];[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add("correct");if(i===n&&i!==x.c)b.classList.add("wrong")});const good=n===x.c;$("feedback").className=`feedback show ${good?"good":"bad"}`;$("feedback").innerHTML=`<strong>${good?"Correct!":"Incorrect — correct answer: "+letters[x.c]}</strong>${x.e}`;$("next").disabled=false}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="Quiz complete";$("bar").style.width="100%";const p=Math.round(score/questions.length*100);$("score").textContent=`${score}/${questions.length}`;$("resultTitle").textContent=p>=80?"Excellent work!":p>=60?"Good progress!":"Keep practicing!";$("resultText").textContent=`You scored ${p}%. Review the explanations and try again to strengthen the areas you missed.`}
$("prev").onclick=()=>{if(index){index--;render()}};$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;render()}};$("restart").onclick=()=>{index=score=0;responses.fill(null);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};document.addEventListener("keydown",e=>{const n=parseInt(e.key);if(n>=1&&n<=4&&responses[index]===null)choose(n-1)});render();
</script></body></html>
